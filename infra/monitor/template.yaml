AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  iterate-monitor: tools/view.py (the team board page, read-only) on Lambda behind an API Gateway HTTP API.
  Deployed by infra/monitor/deploy.sh, which also uploads the code.

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain, e.g. monitor.example.com. Empty means only the execute-api URL.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone id that holds DomainName. Required when DomainName is set.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: iterate-monitor
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: iterate-monitor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/iterate-board
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/iterate-board/index/new
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/iterate-board/index/top
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/iterate-monitor
      RetentionInDays: 14

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: iterate-monitor
      Role: !GetAtt Role.Arn
      Runtime: python3.14
      Architectures: [arm64]
      Handler: run.sh
      MemorySize: 512
      Timeout: 20
      ReservedConcurrentExecutions: 2
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:30
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PROTOCOL: tcp  # the page's "/" queries the table; the port being open is enough
          AWS_LWA_ENABLE_COMPRESSION: "true"  # gzip for browsers that ask for it
      Code:
        ZipFile: "# placeholder: infra/monitor/deploy.sh uploads the real code with aws lambda update-function-code"

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: iterate-monitor
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 3
        ThrottlingBurstLimit: 6

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref Certificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  Mapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    DependsOn: Stage
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref CustomDomain
      Stage: $default

  AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId

Outputs:
  Url:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/
  CustomUrl:
    Condition: HasDomain
    Value: !Sub https://${DomainName}/
