<style>
:root {
  color-scheme: dark;
  --paper: #100f0e; --sheet: #191715; --ink: #ebe5d8; --mute: #a59c8e; --faint: #7b7368; --rule: #2e2a25;

}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--paper); overflow: hidden;
  font: 400 14px/1.5 "Archivo", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--brass); outline-offset: 4px; border-radius: 2px; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#gl.point { cursor: pointer; } canvas#gl.drag { cursor: grabbing; }
.scrim { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(48% 78% at 0% 0%, rgba(16, 15, 14, .94), rgba(16, 15, 14, .82) 55%, rgba(16, 15, 14, 0) 100%),
    radial-gradient(75% 80% at 52% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .5) 100%); }

.head { position: fixed; left: 40px; top: 24px; width: min(430px, 30vw); pointer-events: none; }
.head > * { pointer-events: auto; }
.lab { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); text-decoration: none; }
.lab:hover { color: var(--ink); }

h1 { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 27px; line-height: 1.2; letter-spacing: -.01em; margin: 10px 0 14px; text-wrap: pretty; }
h1 b { font-weight: 400; color: var(--ink); border-bottom: 1px solid var(--brass); }
.thin { font-size: 12.5px; line-height: 1.5; color: var(--mute); border-top: 1px solid var(--rule); padding-top: 10px; }
.thin b { color: var(--ink); font-weight: 600; }
.ctl { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 22px; border-top: 1px solid var(--rule); padding-top: 10px; }
.seg { display: flex; gap: 14px; }
.seg button { color: var(--mute); font-size: 13px; padding: 2px 0; border-bottom: 1px solid transparent; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--brass); }
.key { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; color: var(--mute); align-items: center; }
.key i { width: 12px; height: 12px; border-radius: 50%; display: block; background: var(--c); box-shadow: inset -2px -3px 4px rgba(0, 0, 0, .45), inset 1px 2px 2px rgba(255, 255, 255, .25); }
.key i.sq { border-radius: 2px; } .key i.ring { background: none; box-shadow: none; border-radius: 0; width: 0; height: 0; border: 6px solid transparent; border-bottom: 10px solid #b89b62; border-top: 0; }

.card { position: fixed; right: 40px; top: 24px; width: 330px; max-height: min(calc(100vh - 110px), 61vh); overflow: auto; background: rgba(22, 20, 18, .93);
  border: 1px solid var(--rule); border-radius: 3px; padding: 18px 20px 16px; scrollbar-width: thin; }
.card[hidden] { display: none; }
.card .who { padding-right: 22px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; }
.card h2 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 17px; line-height: 1.25; margin: 8px 0 10px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.big { display: flex; align-items: baseline; gap: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
.big strong { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 40px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.big span { color: var(--mute); font-size: 13px; }
dl { margin: 10px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 0; font-size: 13px; }
dt, dd { margin: 0; padding: 5px 0; border-top: 1px solid var(--rule); }
dt { color: var(--mute); } dd { text-align: right; font-weight: 600; } dd small { font-weight: 400; color: var(--faint); font-size: 12px; margin-left: 6px; }
dd.warn { color: var(--warn); } dd.good { color: var(--brass); }
.sec { margin-top: 14px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.rec { font-size: 12.5px; color: var(--mute); margin-top: 6px; overflow-wrap: anywhere; }
.rec b { color: var(--ink); font-weight: 600; } .rec code { font: inherit; color: var(--ink); } .rec .none { color: var(--warn); }
.rec ul { margin: 4px 0 0; padding: 0; list-style: none; } .rec li { padding: 3px 0; border-top: 1px solid var(--rule); }
.rec p { margin: 6px 0 0; }
.x { position: absolute; right: 10px; top: 8px; color: var(--faint); font-size: 18px; line-height: 1; padding: 4px 6px; }

.tag { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; will-change: transform; }
.tip { font-size: 12px; background: rgba(22, 20, 18, .95); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 9px; opacity: 0; transition: opacity .12s; max-width: 340px; white-space: normal; }
.tip.on { opacity: 1; } .tip b { font-weight: 600; } .tip span { color: var(--mute); }
.read { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); opacity: 0; transition: opacity .3s; }
.read.on { opacity: 1; }
.read strong { display: block; font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 26px; letter-spacing: -.01em; text-transform: none; color: var(--ink); line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.read.over strong { color: var(--warn); } .read.under strong { color: var(--brass); }
.hint { position: fixed; right: 40px; bottom: 16px; text-align: right; font-size: 12px; color: var(--faint); pointer-events: none; }
.status { position: fixed; left: 40px; bottom: 16px; font-size: 12px; color: var(--faint); }
.status.bad { color: var(--warn); }
#err { position: fixed; left: 8px; bottom: 40px; color: var(--warn); font-size: 12px; white-space: pre-wrap; z-index: 9; }

@media (max-width: 900px) {
  .head { left: 0; right: 0; top: 0; width: auto; padding: 12px 16px 22px; background: linear-gradient(rgba(16, 15, 14, .96), rgba(16, 15, 14, .86) 78%, rgba(16, 15, 14, 0)); }
  .kicker { margin-top: 8px; font-size: 11px; } h1 { font-size: 17px; margin: 4px 0 6px; }
  .thin, .key, .status { display: none; } .ctl { margin-top: 6px; padding-top: 6px; }
  .card { left: 10px; right: 10px; top: auto; bottom: 34px; width: auto; max-height: 34vh; padding: 12px 14px; }
  .card h2 { font-size: 15px; margin: 4px 0 6px; } .big strong { font-size: 26px; }
  .hint { right: 0; left: 0; text-align: center; bottom: 8px; font-size: 11px; } .read strong { font-size: 18px; }
}

  </div>

</div>
<aside class="card" id="card" hidden></aside>

<div class="tag read" id="read"></div>
<div class="hint" id="hint">Click a weight to weigh it, or carry it to the left pan &middot; &larr; &rarr; next &middot; B bench</div>
<div class="status" id="status"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const fail = (m) => { $('err').textContent += m + '\n'; };
window.addEventListener('error', (e) => fail(e.message));
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nf = (x, d = 0) => x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const same = (b) => b.toLowerCase().replace(/[^a-z0-9]/g, '');
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- data ----------------------------------------------------------------------------------------------------------
let EXTRA = null, LIVE = null, SCORES = [], sig = '';
const KIND = { base: 'Untrained base', rl: 'RL-Zero-Math', other: 'Edit or other model' };
let B = null;            // the benchmark on the bench: {name, n, base, rl, rate, weights, blanks, order, best, top}
let benches = [];

function ledger(scores) {
  const groups = {};
  for (const s of scores) (groups[same(s.benchmark)] ??= []).push(s);
  const out = [];
  for (const rows0 of Object.values(groups)) {
    const count = {}; for (const s of rows0) count[s.n] = (count[s.n] || 0) + 1;
    const n = +Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    const seen = new Set(), rows = [];
    for (const s of rows0.filter((s) => s.n === n).sort((a, b) => a.sk < b.sk ? -1 : 1)) {
      const k = [s.model, s.right, s.tokens, s.config].join('|');
      if (!seen.has(k)) { seen.add(k); rows.push(s); }
    }
    // the baseline every gain is counted from: the untrained base with the plain prompt at T 1.0, as first posted
    const base = rows.find((s) => s.model === 'base' && /^plain, T 1\.0/.test(s.config));
    // RL's own row: the RL checkpoint, plain prompt, one sample, with its token count
    const rl = rows.find((s) => s.model === 'rl' && s.tokens && /^plain/.test(s.config) && !/vote|restart|cap 32|review/.test(s.config));
    const weighed = rows.filter((s) => s.tokens);
    if (!base || !rl || weighed.length < 8 || rl.right <= base.right) continue;
    const pts = (s) => (s.right - base.right) / n * 100;
    const rate = rl.tokens / pts(rl);
    const maxTok = Math.max(...weighed.map((s) => s.tokens));
    const weights = weighed.map((s) => ({ s, id: `${s.result.slice(-6)}.${s.right}.${s.tokens}`, tokens: s.tokens, gain: pts(s),
      price: pts(s) > 0 ? s.tokens / pts(s) : null, over: s.tokens - Math.max(pts(s), 0) * rate, scale: 0.2 * Math.cbrt(s.tokens / maxTok) }));
    let bestRight = -1;
    for (const w of [...weights].sort((a, b) => a.tokens - b.tokens || b.s.right - a.s.right)) { w.frontier = w.s.right > bestRight; if (w.frontier) bestRight = w.s.right; }
    const order = [...weights.filter((w) => w.price).sort((a, b) => a.price - b.price), ...weights.filter((w) => !w.price).sort((a, b) => a.tokens - b.tokens)];
    order.forEach((w, i) => { w.i = i; });
    const top = weights.filter((w) => w.s.right === bestRight).sort((a, b) => a.tokens - b.tokens)[0];
    out.push({ name: rows[0].benchmark, n, base, rl, rate, weights, order, top, best: order[0],
      rlw: weights.find((w) => w.s === rl), blanks: rows.filter((s) => !s.tokens) });
  }
  return out.sort((a, b) => b.n - a.n || b.weights.length - a.weights.length);
}

// ---- renderer, light, room -----------------------------------------------------------------------------------------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap; renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0c0b);
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 120);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.05).texture;

const key = new THREE.SpotLight(0xfff0dc, 520, 60, 0.42, 0.8, 1.6);
key.position.set(-7, 12.5, 9); key.target.position.set(0.4, 0.6, 1.6);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; key.shadow.radius = 3; key.shadow.blurSamples = 8;
key.shadow.camera.near = 6; key.shadow.camera.far = 30;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xbfd0e6, 0.55); rim.position.set(7, 5, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x8a8f99, 0x1a1512, 0.22));
scene.environmentIntensity = 0.55;

// ---- textures made here (decoration: none of them carries data) ----------------------------------------------------
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, srgb = true, rep) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
function turned() {          // lathe-turned metal: fine rings along the axis, as a roughness map
  const c = canvasOf(64, 512), g = c.getContext('2d'), r = rng(7);
  for (let y = 0; y < 512; y++) { const v = 150 + r() * 70 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, y, 64, 1); }
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(255,255,255,${r() * .25})`; g.fillRect(r() * 64, r() * 512, 1 + r() * 14, 1); }
  return tex(c, false, [1, 1]);
}
function grainWood() {
  const c = canvasOf(1024, 256), g = c.getContext('2d'), r = rng(11);
  g.fillStyle = '#241710'; g.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 900; i++) { const y = r() * 256, a = r() * .16; g.strokeStyle = r() < .5 ? `rgba(20,8,4,${a})` : `rgba(96,62,40,${a})`; g.lineWidth = .5 + r() * 1.6;
    g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x * .004 + i) * 5 + (r() - .5) * 2); g.stroke(); }
  return tex(c);
}
const roughTurned = turned();
const metal = (color, rough) => new THREE.MeshStandardMaterial({ color, metalness: 1, roughness: rough, roughnessMap: roughTurned });
const M = {
  base: metal(0xb9955a, 0.42), rl: metal(0xc4c6c9, 0.34), other: metal(0xa9694c, 0.46),
  brass: metal(0xb08c50, 0.38), brassDark: metal(0x7d6338, 0.55), brassFlat: new THREE.MeshStandardMaterial({ color: 0xb08c50, metalness: 1, roughness: 0.36 }),
  wood: new THREE.MeshPhysicalMaterial({ map: grainWood(), roughness: 0.5, clearcoat: 0.6, clearcoatRoughness: 0.25 }),
  porcelain: new THREE.MeshPhysicalMaterial({ color: 0x9d978b, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.25, envMapIntensity: 0.6 }),
  plaster: new THREE.MeshStandardMaterial({ color: 0x8f8a80, roughness: 0.95 }),
  ivory: new THREE.MeshStandardMaterial({ color: 0x9c937f, roughness: 0.6 }),
  agate: new THREE.MeshPhysicalMaterial({ color: 0x6b3a2e, roughness: 0.15, clearcoat: 1 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xcfd6d2, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 0.35 }),
  oil: new THREE.MeshStandardMaterial({ color: 0x4a2a08, roughness: 0.2, envMapIntensity: 0.4 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x2a2623, roughness: 1 }),
};

// ---- the bench: a slab of dark marble; its rulings are engraved from the data ---------------------------------------
const BW = 22, Z0 = -3.4, BD = 13.2, CW = 4096, CH = Math.round(CW * BD / BW), PX = CW / BW;
const marble = canvasOf(1024, Math.round(1024 * BD / BW));
(function () {
  const g = marble.getContext('2d'), r = rng(3), W = marble.width, H = marble.height;
  g.fillStyle = '#1d1f1e'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(${r() < .4 ? '52,56,53' : '8,9,9'},${.04 + r() * .06})`; g.beginPath(); g.ellipse(r() * W, r() * H, 40 + r() * 160, 20 + r() * 70, r() * 3, 0, 7); g.fill(); }
  g.filter = 'blur(0.5px)';
  for (let i = 0; i < 90; i++) {
    let x = r() * W, y = r() * H, a = -0.5 + r() * 0.9 + (r() < .3 ? 1.6 : 0); const big = r() < .12;
    g.strokeStyle = `rgba(205,200,186,${big ? .22 + r() * .25 : .06 + r() * .12})`; g.lineWidth = big ? .5 + r() * 1.1 : .25 + r() * .4;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 40; k++) { a += (r() - .5) * .5; x += Math.cos(a) * (8 + r() * 14); y += Math.sin(a) * (8 + r() * 14); g.lineTo(x, y);
      if (r() < .08) { g.stroke(); g.beginPath(); g.moveTo(x, y); g.lineWidth *= .7; } }
    g.stroke();
  }
  g.filter = 'none';
})();
const noise = canvasOf(256, 256);
(function () { const g = noise.getContext('2d'), d = g.createImageData(256, 256), r = rng(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 16; } g.putImageData(d, 0, 0); })();
$('grain').style.backgroundImage = `url(${(() => { const c = canvasOf(160, 160), g = c.getContext('2d'), d = g.createImageData(160, 160), r = rng(9); for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i + 1] = d.data[i + 2] = r() * 255; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c.toDataURL(); })()})`;
const benchCanvas = canvasOf(CW, CH), benchTex = tex(benchCanvas);
const slabSide = new THREE.MeshStandardMaterial({ color: 0x151716, roughness: 0.4 });
const slabTop = new THREE.MeshStandardMaterial({ map: benchTex, roughness: 0.33, metalness: 0.0, envMapIntensity: 0.8 });
const slab = new THREE.Mesh(new THREE.BoxGeometry(BW, 0.7, BD), [slabSide, slabSide, slabTop, slabSide, slabSide, slabSide]);
slab.position.set(0, -0.35, Z0 + BD / 2); slab.receiveShadow = true; scene.add(slab);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), M.wall); wall.position.set(0, 8, Z0 - 0.6); scene.add(wall);
const cx = (x) => (x + BW / 2) * PX, cz = (z) => (z - Z0) * PX;

// ---- the balance ---------------------------------------------------------------------------------------------------
const H = 3.3, L = 2.05, HANG = 1.95, PANR = 0.62, TH_MAX = 0.135, NEEDLE = 2.42, PLINTH = 0.34;
const balance = new THREE.Group(); scene.add(balance);
function shadowed(m) { m.castShadow = true; m.receiveShadow = true; return m; }
function rod(a, b, r, mat) {
  const d = new THREE.Vector3().subVectors(b, a), m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat));
  m.position.copy(a).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); return m;
}
const lathe = (pts, seg = 48) => new THREE.LatheGeometry(pts.map((p) => new THREE.Vector2(p[0], p[1])), seg);
// plinth, feet, column
const plinth = shadowed(new THREE.Mesh(new THREE.BoxGeometry(5.7, PLINTH - 0.06, 1.75), M.wood)); plinth.position.y = 0.06 + (PLINTH - 0.06) / 2; balance.add(plinth);
const lip = shadowed(new THREE.Mesh(new THREE.BoxGeometry(5.82, 0.05, 1.87), M.wood)); lip.position.y = 0.085; balance.add(lip);
for (const [x, z] of [[-2.6, -0.7], [2.6, -0.7], [-2.6, 0.7], [2.6, 0.7]]) { const f = shadowed(new THREE.Mesh(lathe([[0, 0], [0.13, 0], [0.14, 0.03], [0.09, 0.06], [0, 0.06]], 24), M.brass)); f.position.set(x, 0, z); balance.add(f); }

async function refresh() {       // the live rows replace the build's rows; a failed read keeps what is shown and tries again

  try { const r = await fetch('/data'); if (!r.ok) throw new Error(r.status); LIVE = await r.json(); } catch (e) { ok = false; }
  if (LIVE?.scores) use(LIVE.scores, !B);
  status(ok);
  setTimeout(refresh, ok ? 60000 : 15000);
}
(async function () {
  try { const r = await fetch('data.json'); if (!r.ok) throw new Error(r.status); EXTRA = await r.json(); } catch (e) { fail('data.json is missing: run build.py'); }
  await Promise.all([document.fonts.load('600 20px Archivo'), document.fonts.load('300 20px Newsreader')]).catch(() => {});
  resize();
  if (EXTRA?.scores) { use(EXTRA.scores, true); refresh(); } else await refresh();
  if (!B) return;
  stepCamera(1, true);
  if (!STILL) for (let i = 0; i < 150; i++) advance(1 / 60);   // the first frame already has its weight on the pan
  started = true; last = performance.now();
  if (STILL) still(); else requestAnimationFrame(frame);
})();
</script>
