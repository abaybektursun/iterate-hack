<html lang="en">

<style>
:root {
  color-scheme: dark;

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; border-radius: 2px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.turn, canvas.orbit { cursor: grabbing; } canvas.pick { cursor: pointer; } canvas.crank { cursor: ew-resize; }
.grain { position: fixed; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay; z-index: 1;

.head { position: fixed; left: 0; top: 0; right: 0; padding: 20px 40px 0; z-index: 2; pointer-events: none; }
.head > * { pointer-events: auto; }
.top { display: flex; align-items: baseline; gap: 14px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--faint); }
.top a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--rule); }
.top a:hover { color: var(--ink); }

.foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 40px 16px; z-index: 2; display: grid; grid-template-columns: 330px 1fr; gap: 0 44px; align-items: end; pointer-events: none; }

.clock { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 0 10px; align-items: end; }
.clock strong { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 34px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.clock small { font-size: 11px; color: var(--faint); letter-spacing: .04em; line-height: 1.3; padding-bottom: 3px; }

.scrub input::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
.scrub input::-moz-range-track { height: 1px; background: var(--rule); }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #b8955a; border: 1px solid #e3cd9c; box-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.scrub input::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #b8955a; border: 1px solid #e3cd9c; }
.def { font-size: 11.5px; line-height: 1.45; color: var(--faint); border-top: 1px solid var(--rule); padding-top: 8px; }

.card .q { font-family: "Newsreader", Georgia, serif; font-size: 21px; line-height: 1.25; margin: 10px 0 8px; color: var(--ink); overflow-wrap: anywhere; }
.card p { margin: 0 0 10px; font-size: 13px; color: var(--mute); overflow-wrap: anywhere; }
.card .sc { border-top: 1px solid var(--rule); padding: 6px 0; display: grid; grid-template-columns: 74px 1fr; gap: 0 10px; font-size: 12.5px; color: var(--mute); }

.card .sc b small { color: var(--faint); font-size: 12px; } .card .sc u { text-decoration: none; color: var(--ink); }
.card .by { font-size: 12px; color: var(--faint); padding-top: 9px; border-top: 1px solid var(--rule); }

@media (max-width: 1100px) { .def .cols { columns: 2; } h1 { font-size: 21px; } }
@media (max-width: 760px) {
  .head { padding: 12px 16px 0; }
  h1 { font-size: 16.5px; line-height: 1.25; margin: 8px 0 4px; }
  .note { display: none; }
  .foot { display: block; padding: 0 16px 10px; }

  .def .cols { columns: 1; }

  #tip { max-width: 260px; }
}

<canvas id="c" aria-label="An antique mechanical race game: six brass tokens in slots on green baize, one per method family of the base model, at their best MATH-500 score; fixed brass posts for the RL checkpoint; a crank that runs the hours"></canvas>

<script type="module">

// ------------------------------------------------------------------ the data: families, advances, the RL posts
const EX = new RegExp(DATA.exclude, 'i'), ONE = new RegExp(DATA.one, 'i');

const family = s => {      // the same rule as build.py: the first family whose pattern the configuration matches

function ingest(rows, tt, t1) {

      let j = i, top = L.lines[i];
      while (j < L.lines.length && L.lines[j].r === top.r) { if (L.lines[j].v > top.v) top = L.lines[j]; j++; }

      if (top.v > best) { best = top.v; const st = { t: top.t, best, s: top, L }; L.steps.push(st); pinsData.push(st); }

  }
  pinsData.sort((a, b) => a.t - b.t || a.L.i - b.L.i).forEach((st, i) => st.n = i + 1);

DATA.scores.forEach(s => s.f = s.f || family(s));
ingest(DATA.scores, DATA.titles, DATA.t1);

// the board, in world units: the track runs along x, the lanes are stacked along z
const X0 = -9, X200 = -7.8, X500 = 10, PARK = -9.62, Y0 = 0.3;
const sx = v => v <= 200 ? lerp(X0, X200, v / 200) : lerp(X200, X500, (v - 200) / 300);     // the engraved scale, broken at 200
const LZ = i => -3.9 + 1.6 * i, RLZ = -6.05, ZP = -5.3;

const CR = { x: 13.75, z: 2.4, r: 0.86 }, REV = 8;                                            // the crank: REV turns for the whole replay
const bestAt = (L, t) => { let b = null; for (const st of L.steps) if (st.t <= t) b = st; return b; };
const xAt = (L, t) => { let x = PARK; for (const st of L.steps) x = lerp(x, sx(st.best), ease(clamp((t - st.t) / (W_MOVE * SPAN), 0, 1))); return x; };

// ------------------------------------------------------------------ renderer, room, light
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0908');
const camera = new THREE.PerspectiveCamera(24, 1, 1, 300);

function studio() {   // a photographer's room for the metal to reflect: one large softbox, a strip, a warm bounce
  const es = new THREE.Scene(), lit = (w, h, v, c = [1, 1, 1]) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c[0] * v, c[1] * v, c[2] * v), side: THREE.DoubleSide }));

  const key = lit(34, 24, 6.0, [1, 0.95, 0.87]); key.position.set(-18, 28, -10); key.lookAt(0, 0, 0);
  const top = lit(50, 30, 1.6, [1, 0.96, 0.9]); top.position.set(4, 36, 14); top.lookAt(0, 0, 0);
  const strip = lit(5, 34, 3.0, [0.88, 0.93, 1]); strip.position.set(34, 12, 4); strip.lookAt(0, 2, 0);
  const front = lit(44, 6, 1.5, [1, 0.9, 0.8]); front.position.set(0, 8, 36); front.lookAt(0, 2, 0);
  const bounce = lit(50, 50, 0.1, [1, 0.8, 0.6]); bounce.position.set(0, -6, 0); bounce.rotation.x = Math.PI / 2;

studio();
const key = new THREE.SpotLight(new THREE.Color(1.0, 0.94, 0.85), 2.3, 0, 0.62, 0.7, 0);   // one lamp, behind and to the left
key.position.set(-15, 30, -14); key.target.position.set(1, 0, 0.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { near: 16, far: 60 }); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 5;

// ------------------------------------------------------------------ surfaces
const tex = (cv, srgb, rep) => { const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
const cvs = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const serif = '"Newsreader", Georgia, serif', sans = '"Archivo", sans-serif', INK = '#120c07';

function mahogany() {      // grain along the canvas y axis
  const [cv, c] = cvs(256, 1024), rand = rnd(3);
  c.fillStyle = '#4a1f12'; c.fillRect(0, 0, 256, 1024);
  for (let i = 0; i < 620; i++) {

    c.lineWidth = 0.5 + rand() * 2.6; c.strokeStyle = rand() < 0.62 ? `rgba(22,6,3,${0.08 + rand() * 0.24})` : `rgba(176,96,56,${0.05 + rand() * 0.13})`; c.stroke();

  return cv;
}
function nap() {           // the bump of the cloth
  const [cv, c] = cvs(256, 256), rand = rnd(5), im = c.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = 96 + rand() * 90; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }

}
function baize() {         // the cloth with its printed gilt lines: lane borders, the start, every 50 of the scale
  const U = 72, w = XD - XI0, d = ZI1 - ZI0, [cv, c] = cvs(Math.round(w * U), Math.round(d * U)), rand = rnd(11);
  c.fillStyle = '#1f4634'; c.fillRect(0, 0, cv.width, cv.height);

    g.addColorStop(0, dk ? 'rgba(8,26,18,.055)' : 'rgba(70,120,92,.04)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); }
  const X = x => (x - XI0) * U, Z = z => (z - ZI0) * U;
  const ln = (x0, z0, x1, z1, lw, al) => { c.beginPath(); c.moveTo(X(x0), Z(z0)); c.lineTo(X(x1), Z(z1)); c.lineWidth = lw; c.strokeStyle = `rgba(196,168,104,${al})`; c.stroke(); };
  const zA = LZ(0) - 0.58, zB = LZ(lanes.length - 1) + 1.02;

  return cv;
}

function sweep(pts, len) {      // a moulding: the profile (outward, height) drawn along +z, smooth where the profile bends gently

  seg.forEach((s, i) => {
    const a = pts[i], b = pts[i + 1], na = mix(s, seg[i - 1]), nb = mix(s, seg[i + 1]), o = pos.length / 3;

  });

  for (const [z, nz] of [[0, -1], [len, 1]]) { const o = pos.length / 3; pts.forEach(p => { pos.push(p[0], p[1], z); nor.push(0, 0, nz); uv.push(p[0], p[1]); }); tri.forEach(t => idx.push(o + t[0], o + t[1], o + t[2])); }

}

  if (rows.length < 3 || !rows.some(s => s.m === 'rl')) throw new Error('data has no MATH-500 lines');
  const tt = { ...DATA.titles }, items = Object.fromEntries(d.items.map(i => [i.id, i]));
  for (const s of rows) { const p = (d.plain[s.r] || {}).title || tt[s.r] || (items[s.r] ? items[s.r].text.split('\n')[0].replace(/^title: /, '').slice(0, 110) : null); if (p) tt[s.r] = p; }
  leftOut = rows.filter(s => !s.f).length; source = 'the live board, read ' + new Date().toISOString().slice(11, 16) + ' UTC';
  const atEnd = frac >= 0.999;
  ingest(rows.filter(s => s.f), tt, Math.max(...d.scores.map(s => Number(BigInt(s.sk.split('#')[0]) / 1000000n))));
  if (atEnd) { frac = shown = 1; }
  rebuild();
}
live().catch(e => { console.warn('live board not read, the snapshot stays:', e.message); });
