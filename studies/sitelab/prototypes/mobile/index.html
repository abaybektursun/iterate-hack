<style>

  #sentence { font-family: Newsreader, serif; font-weight: 380; font-size: 25px; line-height: 1.24; letter-spacing: -.005em;
    margin: 0 0 11px; text-wrap: pretty; }

  #card p.t { font-family: Newsreader, serif; font-size: 16.5px; line-height: 1.34; margin: 11px 0 10px; }

    line-height: 1.36; color: #37332d; }

    color: var(--ink2); margin-bottom: 4px; }

<body>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/+esm';

const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dur = m => m < 1 ? 'under a minute' : m < 60 ? Math.round(m) + ' min' : Math.floor(m / 60) + ' h ' + String(Math.round(m % 60)).padStart(2, '0') + ' min';

/* ---------- the rules that turn the board into a mobile (constants, the same for every item) ---------- */
const LEAF_AREA = n => 0.05 + 0.02 * n;                       // m2 of sheet, from the comment count
const LEAF_OUT = idle => 0.28 + 0.2 * Math.log2(1 + idle / 4); // m from the session's pivot, from the minutes idle
const SHEET = 2.7;                                            // kg per m2 (1 mm aluminium)
const BEAD = 0.25;                                            // kg, one per result the session closed today
const ROOT_HALF = 1.7, ROOT_STEM = 1.9, HOOK_Y = 7.55, BOW = 0.22;
const FLOOR_MIN = 45;                                         // cut leaves stay on the floor this many minutes
const PAINT = ['#8f3a2a', '#24282b', '#c29d4e', '#566874', '#d8ceb6', '#767a63'];

/* ---------- renderer, room, light ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#bdb7ab');
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 120);
const TARGET = V(-1.5, 3.75, 0);
let camDist = 16, az = 0.1, azTo = 0.1;

function noiseTex(size, draw, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(repeat, repeat);
  t.anisotropy = 8; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const plaster = noiseTex(512, (g, s) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) { const v = 118 + rnd() * 22 | 0; g.fillStyle = `rgba(${v},${v},${v},.5)`; g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 3, 1 + rnd() * 2); }
  for (let i = 0; i < 60; i++) { const v = rnd() < .5 ? 100 : 150; g.fillStyle = `rgba(${v},${v},${v},.06)`; g.beginPath(); g.ellipse(rnd() * s, rnd() * s, 20 + rnd() * 60, 8 + rnd() * 30, rnd() * 3, 0, 7); g.fill(); }
}, 7);
const brushed = noiseTex(512, (g, s) => {
  g.fillStyle = '#8c8c8c'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 2600; i++) { const v = 90 + rnd() * 90 | 0; g.fillStyle = `rgba(${v},${v},${v},.22)`; g.fillRect(rnd() * s - 60, rnd() * s, 40 + rnd() * 240, 1); }
  for (let i = 0; i < 30; i++) { g.strokeStyle = 'rgba(200,200,200,.25)'; g.lineWidth = .6; g.beginPath(); const x = rnd() * s, y = rnd() * s; g.moveTo(x, y); g.lineTo(x + rnd() * 80 - 40, y + rnd() * 30 - 15); g.stroke(); }
});
const concrete = noiseTex(512, (g, s) => {
  g.fillStyle = '#7d7d7d'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 500; i++) { const v = 95 + rnd() * 60 | 0; g.fillStyle = `rgba(${v},${v},${v},.10)`; g.beginPath(); g.ellipse(rnd() * s, rnd() * s, 6 + rnd() * 50, 6 + rnd() * 40, rnd() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 5000; i++) { const v = 90 + rnd() * 70 | 0; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(rnd() * s, rnd() * s, 1, 1); }
}, 5);

const WALL_Z = -3.4;
const wallMat = new THREE.MeshLambertMaterial({ color: '#d6d0c4', bumpMap: plaster, bumpScale: .5 });
const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 24), wallMat); wall.position.set(0, 8, WALL_Z); wall.receiveShadow = true; scene.add(wall);
const floorMat = new THREE.MeshLambertMaterial({ color: '#d9d1c4', map: concrete });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), floorMat); floor.rotation.x = -Math.PI / 2; floor.position.z = WALL_Z + 20; floor.receiveShadow = true; scene.add(floor);
const skirt = new THREE.Mesh(new THREE.BoxGeometry(60, .11, .03), new THREE.MeshLambertMaterial({ color: '#c9c3b7' }));
skirt.position.set(0, .055, WALL_Z + .015); skirt.receiveShadow = true; scene.add(skirt);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshBasicMaterial({ color: '#b3ada1' }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, HOOK_Y + .16, WALL_Z + 20); scene.add(ceil);

const key = new THREE.SpotLight(0xfff1dc, 2.9, 0, 0.7, 1, 0);
key.position.set(-5.5, 10.5, 10.5); key.target.position.set(0.6, 3.6, WALL_Z);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.camera.near = 6; key.shadow.camera.far = 30;
key.shadow.radius = 3.2; key.shadow.blurSamples = 8; key.shadow.autoUpdate = false; key.shadow.bias = -0.0004;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(0xf6efe3, 0xa59d90, 0.92));
const rim = new THREE.DirectionalLight(0xdfe7f0, 0.55); rim.position.set(7, 6, -2); scene.add(rim);

const steel = new THREE.MeshStandardMaterial({ color: '#8f9296', metalness: 1, roughness: .34, roughnessMap: brushed, envMapIntensity: 1.1 });
const brass = new THREE.MeshStandardMaterial({ color: '#b08d4f', metalness: 1, roughness: .3, roughnessMap: brushed, envMapIntensity: 1.2 });
const bare = new THREE.MeshStandardMaterial({ color: '#b9b8b3', metalness: .55, roughness: .5, roughnessMap: brushed, bumpMap: brushed, bumpScale: .4, side: THREE.BackSide, envMapIntensity: 1.0 });
const hookG = new THREE.Group(); hookG.position.set(0, HOOK_Y, 0); scene.add(hookG);
{ const pl = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .025, 32), steel); pl.position.y = .15; hookG.add(pl);
  const sh = new THREE.Mesh(new THREE.CylinderGeometry(.014, .014, .1, 8), steel); sh.position.y = .1; hookG.add(sh);
  const hk = new THREE.Mesh(new THREE.TorusGeometry(.045, .012, 8, 24, Math.PI * 1.5), steel); hk.position.y = .02; hk.rotation.set(0, Math.PI / 2, -Math.PI / 4); hk.castShadow = true; hookG.add(hk); }

/* grain overlay: one static tile of film grain */
{ const g = $('grain'), c = g.getContext('2d'); g.width = g.height = 256; const im = c.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255 | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  c.putImageData(im, 0, 0); g.style.width = '100%'; g.style.height = '100%'; g.style.imageRendering = 'auto';
  g.style.background = 'none'; }

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const t = Math.tan(camera.fov * Math.PI / 360), tall = w / h < 0.8, halfW = tall ? 3.7 : 5.3;
  TARGET.set(tall ? .1 : -1.5, tall ? 2.7 : 3.75, 0);
  camDist = Math.max(4.25 / t, halfW / (t * camera.aspect)); camera.updateProjectionMatrix();
}
function placeCamera() {
  camera.position.set(TARGET.x + Math.sin(az) * camDist, 3.5, Math.cos(az) * camDist); camera.lookAt(TARGET);
}
addEventListener('resize', () => { resize(); if (STILL) frameOnce(); });

/* ---------- physics ---------- */
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
const DT = 1 / 120; world.timestep = DT;
if ('numSolverIterations' in world.integrationParameters) world.integrationParameters.numSolverIterations = 12;
const G_MOB = (0x0001 << 16) | 0x0002, G_FLOOR = (0x0002 << 16) | 0x0001;
{ const b = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, -1, 0));
  world.createCollider(RAPIER.ColliderDesc.cuboid(40, 1, 40).setCollisionGroups(G_FLOOR).setFriction(.9), b); }
const hookBody = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, HOOK_Y, 0));

const nodes = new Set();        // every body in the room: hanging, falling, lying
const picks = [];               // meshes the pointer can hit
const qY = a => new THREE.Quaternion().setFromAxisAngle(V(0, 1, 0), a);
const tq = new THREE.Quaternion(), tv = V(), tv2 = V(), tv3 = V();
const bq = b => { const r = b.rotation(); return tq.set(r.x, r.y, r.z, r.w); };
const toWorld = (n, local, out = V()) => { const p = n.body.translation(); return out.copy(local).applyQuaternion(bq(n.body)).add(p); };
const slot = (parent, x) => V(x, -parent.stem - BOW * x * x, 0);   // a point on the parent's bow

function makeNode(kind, key, parent, x, spec) {
  const n = { kind, key, parent, x, xTo: x, children: [], mass: 0, subMass: 0, yawI: 1, rest: 0, dead: 0, ...spec };
  n.worldRest = (parent ? parent.worldRest : 0) + n.rest;
  n.anchor = parent ? slot(parent, x) : V();
  const pos = parent ? toWorld(parent, n.anchor) : V(0, HOOK_Y, 0);
  const q = qY(n.worldRest); if (spec.swing) q.multiply(new THREE.Quaternion().setFromAxisAngle(V(0, 0, 1), spec.swing));
  n.body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setRotation(q)
    .setLinearDamping(.02).setAngularDamping(kind === 'leaf' ? .12 : .3));
  n.joint = world.createImpulseJoint(RAPIER.JointData.spherical(n.anchor, { x: 0, y: 0, z: 0 }), parent ? parent.body : hookBody, n.body, true);
  n.group = new THREE.Group(); scene.add(n.group);
  if (parent) parent.children.push(n);
  nodes.add(n); return n;
}
function setCollider(n, desc, mass) {
  if (n.col) world.removeCollider(n.col, true);
  n.col = world.createCollider(desc.setMass(mass).setCollisionGroups(G_MOB).setFriction(.9).setRestitution(.05), n.body); n.mass = mass;
}
function reanchor(n) {
  const a = slot(n.parent, n.x); n.anchor.copy(a);
  if (n.joint.setAnchor1) n.joint.setAnchor1(a);
  else { world.removeImpulseJoint(n.joint, true); n.joint = world.createImpulseJoint(RAPIER.JointData.spherical(a, { x: 0, y: 0, z: 0 }), n.parent.body, n.body, true); }
}

/* --- arms: a stem from the pivot down to a bowed wire that carries the children --- */
const WIRE = { root: .024, person: .017, session: .0115 }, DENS = { root: 3, person: .9, session: .8 };   // m radius, kg per m
function dressArm(n) {     // one merged wire per arm: stem, eye, bow, end beads, an eyelet where each child hangs
  for (const m of n.dress || []) { n.group.remove(m); m.geometry.dispose(); const i = picks.indexOf(m); if (i >= 0) picks.splice(i, 1); }
  const xs = n.children.map(c => c.x).concat(0), a = Math.min(...xs) - .07, b = Math.max(...xs) + .07, r = WIRE[n.kind];
  const pts = []; for (let i = 0; i <= 16; i++) pts.push(slot(n, a + (b - a) * i / 16));
  const curve = new THREE.CatmullRomCurve3(pts);
  const parts = [new THREE.TubeGeometry(curve, 28, r, 7), new THREE.CylinderGeometry(r * .8, r * .8, n.stem, 7).translate(0, -n.stem / 2, 0),
    new THREE.TorusGeometry(r * 2.2, r * .7, 6, 16).translate(0, -r * 2, 0),
    new THREE.SphereGeometry(r * 1.5, 10, 8).translate(pts[0].x, pts[0].y, 0), new THREE.SphereGeometry(r * 1.5, 10, 8).translate(pts[16].x, pts[16].y, 0)];
  for (const c of n.children) { const p = slot(n, c.x); parts.push(new THREE.TorusGeometry(r * 1.5, r * .5, 5, 12).rotateY(Math.PI / 2).translate(p.x, p.y - r * 1.4, 0)); }
  const wire = new THREE.Mesh(mergeGeometries(parts), steel); wire.castShadow = true; parts.forEach(g => g.dispose());
  const hit = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, .09, 4)); hit.visible = false; hit.userData.node = n; picks.push(hit);
  n.dress = [wire, hit]; n.group.add(wire, hit); n.span = b - a;
}
function weighArm(n) {
  const xs = n.children.map(c => c.xTo).concat(0), a = Math.min(...xs) - .07, b = Math.max(...xs) + .07;
  const key = a.toFixed(2) + b.toFixed(2); if (n.colKey === key) return; n.colKey = key;
  // the collision box is deeper than the wire so the solver gets a sane inertia about the wire's own axis; nothing touches it while it hangs
  setCollider(n, RAPIER.ColliderDesc.cuboid((b - a) / 2, n.stem / 3, .14).setTranslation((a + b) / 2, -n.stem * 2 / 3, 0), DENS[n.kind] * (b - a + n.stem));
}

/* --- leaves: one sheet of painted metal per open work item --- */
function leafShape(id, area) {
  const a = .05 + .15 * hash(id + 'a'), b = .1 + .2 * hash(id + 'b'), c = .08 * hash(id + 'c');
  const p1 = 6.28 * hash(id + 'd'), p2 = 6.28 * hash(id + 'e'), p3 = 6.28 * hash(id + 'f');
  const f = t => 1 + a * Math.cos(t - p1) + b * Math.cos(2 * (t - p2)) + c * Math.cos(3 * (t - p3));
  let A = 0; const N = 256; for (let i = 0; i < N; i++) A += .5 * f(i / N * 6.2832) ** 2 * 6.2832 / N;
  const k = Math.sqrt(area / A);                       // the sheet has exactly the area the comment count gives
  return t => k * f(t);
}
function paintTex(n, rmax) {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#b4b3ae'; g.fillRect(0, 0, S, S);
  const path = sc => { g.beginPath(); for (let i = 0; i <= 96; i++) { const t = i / 96 * 6.2832, r = n.shape(t) * sc; g.lineTo(S / 2 + r * Math.cos(t) / (2 * rmax) * S, S / 2 - r * Math.sin(t) / (2 * rmax) * S); } g.closePath(); };
  path(.975); g.fillStyle = n.paint; g.fill(); g.save(); g.clip();
  let s = 1 + hash(n.key) * 9999 | 0; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 520; i++) { g.fillStyle = r() < .5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)'; g.fillRect(r() * S - 30, r() * S, 30 + r() * 110, 1 + r() * 1.5); }
  for (let i = 0; i < 5; i++) { g.strokeStyle = 'rgba(200,198,190,.5)'; g.lineWidth = .5; g.beginPath(); const x = r() * S, y = r() * S; g.moveTo(x, y); g.lineTo(x + r() * 40 - 20, y + r() * 14 - 7); g.stroke(); }
  const lum = parseInt(n.paint.slice(1, 3), 16) * .3 + parseInt(n.paint.slice(3, 5), 16) * .6 + parseInt(n.paint.slice(5, 7), 16) * .1;
  g.fillStyle = lum > 140 ? 'rgba(40,36,30,.62)' : 'rgba(240,232,214,.6)';
  const fs = Math.max(13, Math.min(30, 15 / (rmax * 2) * 1.0)); g.font = `600 ${fs}px Archivo, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(n.key.replace('work-', ''), S / 2, S / 2 + S * .06);
  g.restore();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;

  lastMove = { x: e.clientX, y: e.clientY, t: now };
});
const up = e => {
  if (!down) return; const tap = down.moved < 6 && performance.now() - down.t < 500;
  if (tap) { if (down.node && down.node.kind === 'leaf') select(down.node); else if (!down.node) select(null); }
  down = null; grab = null; canvas.style.cursor = 'default';
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); wind.set(4.5, .3, -1.2); gust = 1; }
  else if (e.key === 'Escape') select(null);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const L = [...leaves.values()].map(n => ({ n, x: toWorld(n, n.center).project(camera).x })).sort((a, b) => a.x - b.x).map(o => o.n);
    if (!L.length) return; const i = L.indexOf(selected), d = e.key === 'ArrowRight' ? 1 : -1; select(L[(i < 0 ? (d > 0 ? 0 : L.length - 1) : i + d + L.length) % L.length]);
  }
});

/* ---------- data: poll, keep the last good read ---------- */
async function poll(first) {
  try {
    const r = await fetch('/data'); if (!r.ok) throw new Error('/data ' + r.status);
    const d = await r.json(), now = Date.now(); lastComments = d.last_comments || {};
    sync(buildModel(d, now), now, !first);
    if (first) { settle(1400); const id = location.hash.slice(1); if (leaves.has(id)) select(leaves.get(id), true); else if (onFloor.has(id)) select(onFloor.get(id), true); }
    else if (STILL) { settle(900); frameOnce(); }
    setTimeout(poll, 20000);
  } catch (err) { console.warn(err); $('clock').textContent = 'board unreachable, retrying'; setTimeout(() => poll(first), first ? 2500 : 10000); if (first && !root) $('sentence').textContent = 'Waiting for the board…'; }
}

/* ---------- frame ---------- */
function draw() {
  for (const n of nodes) {
    if (n.dirty && n.kind !== 'leaf' && n.kind !== 'beads' && !n.dead) { dressArm(n); n.dirty = false; }
    const p = n.body.translation(), r = n.body.rotation(); n.group.position.set(p.x, p.y, p.z); n.group.quaternion.set(r.x, r.y, r.z, r.w);
  }
  placeCamera(); key.shadow.needsUpdate = (shadowTick++ & 1) === 0 || STILL; renderer.render(scene, camera); placeTags();   // the shadow map is redrawn every second frame
}
function frameOnce() { for (const n of nodes) if (n.dirty && n.kind !== 'leaf' && n.kind !== 'beads') { dressArm(n); n.dirty = false; } draw(); writeLean(); }
let shadowTick = 0, last = performance.now(), acc = 0, leanT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - last) / 1000); last = t; acc += dt; clock += dt;
  let k = 0; while (acc >= DT && k++ < 5) { slide(DT); forces(); world.step(); acc -= DT; } if (acc > DT) acc = 0;
  wind.multiplyScalar(Math.exp(-dt / .9)); gust *= Math.exp(-dt / .9);
  az += (azTo - az) * (1 - Math.exp(-dt * 4));
  const nowp = performance.now();
  for (const n of nodes) if (n.dead && !n.keep && nowp - n.dead > 12000 && !(n.parent && nodes.has(n.parent) && !n.parent.dead)) { if (!n.children.some(c => nodes.has(c))) destroy(n); }
  draw(); if ((leanT += dt) > .5) { leanT = 0; writeLean(); }
}
resize(); placeCamera();
try { await Promise.race([document.fonts.load('600 20px Archivo'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
await poll(true);
window.__mobile = { nodes, leaves, sync: (m) => sync(m, Date.now(), true), get model() { return model; } };   // for the console
if (STILL) frameOnce(); else requestAnimationFrame(frame);
</script>
