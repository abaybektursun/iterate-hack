const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

{ // a studio to reflect: one large soft box upper left, a dim warm fill right, a dark room
  const env = new THREE.Scene(), bm = (c, i) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide });

  glass: new THREE.MeshStandardMaterial({ color: 0xcfd8d6, roughness: .08, metalness: 0, transparent: true, opacity: .13, envMapIntensity: 1.6, depthWrite: false }),

  shade: new THREE.MeshBasicMaterial({ map: tex(8, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,.62)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }), transparent: true, depthWrite: false }),

function stamp(bg, ink, tick) {
