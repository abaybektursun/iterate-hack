<style>

// ------------------------------------------------------------------ surfaces drawn once: oak, plaster, card edges
const tex = (cv, srgb, rep) => { const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };

const OAK_W = 5, OAK_H = 3;   // one tile of the oak texture covers this many drawer widths, along and across the grain

function oak() {   // quarter-sawn oak: straight grain, open pores, a few pale ray flecks across the grain. Tiles in both directions.
  const SX = 1024, SY = 2048, [cv, c] = cvs(SX, SY), rand = rnd(11), TAU = Math.PI * 2;

  for (let i = 0; i < 240; i++) wavy(rand() * SY, 12, 5 + rand() * 40, rand() < 0.5 ? `rgba(52,30,12,${0.03 + rand() * 0.07})` : `rgba(190,144,88,${0.025 + rand() * 0.06})`);   // early and late wood
  for (let i = 0; i < 1800; i++) wavy(rand() * SY, 9, 0.5 + rand() * 1.6, rand() < 0.7 ? `rgba(40,22,8,${0.04 + rand() * 0.11})` : `rgba(204,156,100,${0.03 + rand() * 0.08})`);
  const at = (x, y, m, f) => { for (const dx of x < m ? [0, SX] : x > SX - m ? [0, -SX] : [0]) for (const dy of y < m ? [0, SY] : y > SY - m ? [0, -SY] : [0]) f(x + dx, y + dy); };

    const x = rand() * SX, y = rand() * SY, l = 3 + rand() * 15; c.lineWidth = 0.6 + rand() * 0.9; c.strokeStyle = `rgba(30,16,6,${0.12 + rand() * 0.22})`;

    const x0 = rand() * SX, y0 = rand() * SY, slant = (rand() - 0.5) * 0.5, k = 1 + Math.floor(rand() * 4);

}

const [oakMap, oakRough] = oak();

const caseMat = new THREE.MeshStandardMaterial(oakOpts);
