<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

const DATA = await (await fetch('data.json')).json();
const SETS = Object.fromEntries(DATA.sets.map(s => [s.key, s]));

// ---- constants shared by the shader and the picking code

const PER = +(Q.get('p') || 600);                       // particles per slot

{ const h = location.hash.slice(1).split('/'); if (SETS[h[0]] && SETS[h[0]].per === 4) { st.model = h[0]; if (h[1] === '32768' && SETS[h[0] + '_cap32']) { st.run = 32; st.wall = st.wallCur = 32768; } } }

const COMMON = `
uniform sampler2D uS; uniform float uTime, uFront, uPx, uHotA, uHotB, uDim, uHotU, uHotW;
const float YS = ${YS}, SPEED = ${SPEED.toFixed(1)}, CYCLE = ${CYCLE.toFixed(1)}, R = ${R.toFixed(1)}, SPAN = ${SPAN};
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd(uint v){ return float(pcg(v)) / 4294967295.0; }
vec3 top(vec4 a){ float du = a.x - uHotU; float th = (a.x + uHotW * sign(du) * .011 * exp(-abs(du) * 70.) - .5) * SPAN; return vec3(R * sin(th), 0., R * (1. - cos(th)) + a.z); }

  if (hot) { c = vec3(1.35, .82, .28); sz *= 2.; } else c *= uDim;
  sz *= sqrt(clamp(al, 0., 1.));
  vec4 mv = modelViewMatrix * vec4(p, 1.);
  gl_Position = al > 0. ? projectionMatrix * mv : vec4(2., 2., 2., 1.);
  gl_PointSize = uPx * sz / -mv.z;
  vC = c; vA = al;
}`,
  fragmentShader: `
varying vec3 vC; varying float vA, vS;
void main(){ vec2 q = (gl_PointCoord - .5) * 2.; q.x *= 1. + 1.3 * vS; float r2 = dot(q, q); if (r2 > 1.) discard;   // a grain: a small matte ball lit by the key light

});

const beadMat = new THREE.ShaderMaterial({
  uniforms: partMat.uniforms,

varying vec3 vC; varying float vA, vS;
void main(){
  vS = 0.; vec4 a = texelFetch(uS, ivec2(gl_VertexID, 0), 0); vec3 ce = texelFetch(uS, ivec2(gl_VertexID, 2), 0).rgb; float fs = float(gl_VertexID);

  float al = (a.y > uFront || a.y < 1.) ? 0. : 1.;

}`,

// ---- the instrument: a frosted glass plate in a brass frame that rides two rails; the left rail is the engraved token scale
function canvasTex(w, h, draw, rx, ry) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = 8; return t; }

  for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(30,30,30,${.1 + rand() * .2})`; g.lineWidth = .4; const x = rand() * w, y = rand() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rand() - .5) * 90, y + (rand() - .5) * 30); g.stroke(); } }, 6, 1);

  u.uHotW.value += ((hs < 0 ? 0 : 1) - u.uHotW.value) * (STILL ? 1 : .14);
  plate.position.y = -st.wallCur * YS; 

  // camera
  if (!ptr.size) { cam.yaw += cam.vy; cam.pitch += cam.vp; cam.vy *= .92; cam.vp *= .92; cam.yaw += (.2 - cam.yaw) * .003; }
  cam.yaw = Math.max(-1.25, Math.min(1.25, cam.yaw)); cam.pitch = Math.max(-.18, Math.min(.95, cam.pitch));
  cam.depth += (Math.max(16384, st.wallCur) - cam.depth) * (1 - Math.exp(-dt * 2.2));
  const th = Math.tan(camera.fov * Math.PI / 360), sh = cam.depth * YS + 7 + (cam.depth - 16384) / 16384 * 3.5, sw = 33, asp = (W - colW) / H;
  const dist = (Math.max(sh / 2 / th, sw / 2 / (th * asp)) + 4) * cam.zoom;
  cam.sx += (cam.lx - cam.sx) * .03; cam.sy += (cam.ly - cam.sy) * .03;
  const yaw = cam.yaw + (STILL ? 0 : Math.sin(now * .11) * .03) + cam.sx * .06, pitch = cam.pitch + cam.sy * .03, ty = -cam.depth * YS / 2 - .2;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, 2.2 + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, ty, 2.2); camera.updateMatrixWorld();
  u.uPx.value = 2.0 * 40 * (H / 1000) * renderer.getPixelRatio() * Math.min(1.7, Math.sqrt(600 / perNow));
  labels(dt);
  renderer.shadowMap.needsUpdate = st.wallCur !== shadowW; shadowW = st.wallCur;
  renderer.render(scene, camera);
}
