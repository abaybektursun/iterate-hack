<body>

<script type="module">
import * as THREE from 'three';
const $ = id => document.getElementById(id);
let stamp = 0;                                                            // raised by anything outside the frame loop that changes the picture
addEventListener('error', e => { $('err').textContent += (e.message || e) + '\n'; });
addEventListener('unhandledrejection', e => { $('err').textContent += (e.reason && e.reason.message || e.reason) + '\n'; });

// ---------------------------------------------------------------- data: every number below is read from data.json
const D = await (await fetch('data.json')).json();
const N = D.n, STEPS = D.steps, F = D.facts, K = STEPS.length + 1;        // five steps and the register of what remains
const rows = STEPS.map(s => Uint8Array.from(s.rows, ch => +ch));
STEPS.forEach((s, k) => { const sum = rows[k].reduce((a, b) => a + b, 0); if (sum !== s.right) throw new Error(`data.json: ${s.key} has ${sum} rows right, total says ${s.right}`); });
const unsolved = new Uint8Array(N); let nNone = 0, nEvery = 0;
for (let i = 0; i < N; i++) { const m = rows.reduce((a, r) => a + r[i], 0); if (!m) { unsolved[i] = 1; nNone++; } if (m === STEPS.length) nEvery++; }
if (nNone !== D.none || nEvery !== D.every) throw new Error('data.json: the counts of none and every do not match the rows');
const PIN = D.pins;                                                        // slot in a register -> problem index
const cur = [...rows, unsolved], prev = [new Uint8Array(N), rows[0], rows[1], rows[2], rows[3], new Uint8Array(N)];
const total = [...STEPS.map(s => s.right), nNone];
const fmt = x => String(x).replace('-', '−');
const SAY = [
  [`The untrained base model, asked plainly, solves ${total[0]} of the ${N} problems.`,
   `One sample per problem at T 1.0. In ${F.plain_nothing_extracted} answers the grader finds no final answer at all.`],
  [`Start its answer with ${F.cue_tokens} tokens, “line!”, two line breaks and “Okay”, and the same weights solve ${total[1]}.`,
   `The cue is published (Wang et al., arXiv 2610.06851). It turns ${F.cue_up} problems right and ${F.cue_down} wrong.`],
  [`Ask four times and keep the most common answer: ${total[2]}. Still no training.`,
   `Costs ${F.vote_times_tokens} times the tokens of one RL sample. The four samples are a repeat run (${F.vote_samples.join(', ')}). RL under the same vote: ${F.rl_vote}.`],
  [`Add RL’s ${F.edit_k} largest directions per weight matrix, at 1.5 times their size: ${total[3]} in one sample.`,
   `The directions are taken from RL’s weights, so this step is not free of reward. The edit is ${F.edit_norm_percent} % of the norm of the weights.`],
  [`RL training itself, one sample: ${total[4]}. The eight directions ${total[3] === total[4] ? 'tie it' : total[3] > total[4] ? 'pass it' : 'stay below it'}.`,
   `Difference ${fmt(F.edit_minus_rl[0].toFixed(1))} points, 95 % interval ${fmt(F.edit_minus_rl[1])} to ${F.edit_minus_rl[2]}. On ${F.hard_n} harder problems RL has ${F.hard_rl}, the edit ${F.hard_edit}. An earlier RL run here: ${F.rl_first_run}.`],
  [`${total[5]} problems are solved by none of the five.`,
   `${nEvery} are solved by all five. Press any pin to read its problem.`],
];
const LABEL = ['Base, plain prompt', 'Base + opening cue', 'Vote over 4 samples', 'Base + 8 RL directions × 1.5', 'RL, one sample', 'Solved by none'];
const SHORT = ['Plain', 'Cue', 'Vote', 'Edit', 'RL', 'None'];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];
$('lead').textContent = `Three opening tokens take an untrained 7B model from ${total[0]} to ${total[1]} of ${N} math problems. RL training reaches ${total[4]}.`;

// ---------------------------------------------------------------- the timeline (seconds)
const T = 90, T0 = 6, PER = 13, ZERO0 = 3.0, ZERO1 = 5.6;
const S = k => T0 + PER * k;                                              // start of station k
const SWEEP = k => k === 5 ? 1.5 : 3.6, STAG = k => k === 5 ? .11 : .012;
const RIP0 = 2.6;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const spring = s => s <= 0 ? 0 : 1 - Math.exp(-14 * s) * Math.cos(20 * s);

// ---------------------------------------------------------------- the instrument's measures
const P = .1, COLS = 25, ROWS = 20, GAP = 4.6, RZ = -.2, PLATE = .05, RISE = .17, PINL = .3, PINR = .034;
const X = k => k * GAP;
const colOf = j => (j / ROWS) | 0, rowOf = j => j % ROWS;
const px = (k, j) => X(k) + (colOf(j) - (COLS - 1) / 2) * P, pz = j => RZ + (rowOf(j) - (ROWS - 1) / 2) * P;
const zeroT = (k, j) => ZERO0 + (k * COLS + colOf(j)) / (K * COLS) * (ZERO1 - ZERO0 - .4);
const carryT = (k, j) => S(k) + .9 + colOf(j) / COLS * 1.2 + rowOf(j) * .01;
const ripT = (k, j) => S(k) + RIP0 + SWEEP(k) * (colOf(j) + .5) / COLS + rowOf(j) * STAG(k);
const barX = t => {                                                        // the setting bar: it crosses register k during that station's ripple
  let k = clamp(Math.floor((t - T0) / PER), 0, K - 1), u = t - S(k) - RIP0;
  if (t < T0) return X(0) - 1.6;
  if (u < 0) { const a = k ? X(k - 1) + 1.45 : X(0) - 1.6, b = X(k) - 1.4; return a + (b - a) * sm((u + RIP0 - .2) / (RIP0 - .2)); }
  return X(k) - 1.4 + 2.85 * sm(u / (SWEEP(k) + .3));
};
const upAt = (k, j, t) => {                                                // is the pin of slot j in register k up at time t (0 or 1)
  const i = PIN[j];
  if (t < T0) return cur[k][i] && t < zeroT(k, j) ? 1 : 0;
  if (t >= ripT(k, j)) return cur[k][i];
  return prev[k][i] && t >= carryT(k, j) ? 1 : 0;
};
const heightAt = (k, j, t) => {                                            // 0 flush, 1 fully up, with the spring of the rise
  const i = PIN[j];
  if (t < T0) return cur[k][i] ? 1 - sm((t - zeroT(k, j)) / .3) : 0;
  const a = prev[k][i] ? spring(t - carryT(k, j)) : 0, b = cur[k][i];
  if (a === b && (b === 0 || t > carryT(k, j) + 1)) return b;
  const s = t - ripT(k, j);
  return s <= 0 ? a : b > a ? a + (b - a) * spring(s) : a + (b - a) * sm(s / .22);
};
const countAt = (k, t) => { let n = 0; for (let j = 0; j < N; j++) n += upAt(k, j, t); return n; };

// ---------------------------------------------------------------- renderer
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const QS = new URLSearchParams(location.search);
const dpr = Math.min(devicePixelRatio, 2); renderer.setPixelRatio(dpr);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false; renderer.toneMapping = THREE.NoToneMapping;
const BG = new THREE.Color(0x0b0a09);
const scene = new THREE.Scene(); scene.background = BG; scene.fog = new THREE.Fog(BG, 16, 58);
const camera = new THREE.PerspectiveCamera(30, 1, .2, 120);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

// the room the metal reflects: a long softbox overhead, a strip behind, a low card in front, dark walls
{ const room = new THREE.Scene(), lit = (c, i) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide });
  room.add(new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: 0x35322e, side: THREE.BackSide })));
  const add = (w, h, c, i, p, r) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lit(c, i)); m.position.set(...p); m.rotation.set(...r); room.add(m); };
  add(20, 9, 0xfff0dc, 5.5, [-10, 13, 13.5], [Math.PI / 2, 0, 0]);              // key softbox, up on the left and to the front, off the zenith
  add(50, 1.6, 0xdfe6f0, 3.2, [0, 7, -22], [0, 0, 0]);                       // rim strip behind
  add(46, 9, 0xe8dcc8, 1.5, [0, 3, 24], [0, Math.PI, 0]);                  // fill card in front
  add(8, 12, 0xfff3e0, 2.2, [-28, 8, 4], [0, Math.PI / 2, 0]);             // side panel on the key side
  add(1.2, 16, 0xfff6ea, 9, [-13, 8, 22], [0, Math.PI, 0]);                // a tall strip in front on the left: the line of light down every pin
  add(60, 60, 0xd8d2c8, .5, [0, 14.6, 0], [Math.PI / 2, 0, 0]);            // the ceiling, dim
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: 0x191613 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -6; room.add(floor);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(room, .015).texture; pm.dispose(); }

const key = new THREE.DirectionalLight(0xfff0db, 2.9); key.castShadow = true; key.shadow.mapSize.set(1024, 2048); key.shadow.autoUpdate = false; key.shadow.camera.up.set(1, 0, 0);   // the map's long side runs along the rail
key.position.set(X(2.5) - 9, 16, 9); key.target.position.set(X(2.5), 0, .3); scene.add(key, key.target);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 17, bottom: -17, near: 4, far: 40 }); key.shadow.bias = -.0004; key.shadow.normalBias = .012; key.shadow.radius = 1.5;
const rim = new THREE.DirectionalLight(0xcfd9ea, .5); rim.position.set(X(2.5) + 10, 5, -14); rim.target.position.set(X(2.5), 0, 0); scene.add(rim, rim.target);
scene.add(new THREE.HemisphereLight(0xb9b2a6, 0x1c1814, .35));

// ---------------------------------------------------------------- procedural surfaces
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function tex(w, h, draw, srgb) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }
const grainTex = tex(512, 512, (g, w, h) => {                              // fine satin noise, read as roughness (green) by the bed and the bench
  const im = g.createImageData(w, h); for (let i = 0; i < w * h; i++) { const v = 150 + rnd() * 70 + (rnd() < .004 ? -70 : 0); im.data.set([v, v, v, 255], i * 4); } g.putImageData(im, 0, 0);
  g.globalAlpha = .1; g.strokeStyle = '#fff'; for (let i = 0; i < 60; i++) { g.beginPath(); const x = rnd() * w, y = rnd() * h, a = rnd() * 6.3, l = 20 + rnd() * 90; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.lineWidth = .5; g.stroke(); } });
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
const brushTex = tex(1024, 256, (g, w, h) => {                             // brushed along x: long faint streaks
  g.fillStyle = '#909090'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const y = rnd() * h, x = rnd() * w, l = 80 + rnd() * 500, v = (rnd() * 255) | 0; g.fillStyle = `rgba(${v},${v},${v},${.05 + rnd() * .1})`; g.fillRect(x, y, l, .6 + rnd()); if (x + l > w) g.fillRect(0, y, x + l - w, 1); } });
brushTex.wrapS = brushTex.wrapT = THREE.RepeatWrapping;

// ---------------------------------------------------------------- the bed: one machined section, extruded along the rail
const X0 = X(0) - 2.7, X1 = X(K - 1) + 2.7, SLOPE0 = [.95, 0], SLOPE1 = [2.5, -.86];
const slopeLen = Math.hypot(SLOPE1[0] - SLOPE0[0], SLOPE1[1] - SLOPE0[1]), slopeAng = Math.atan2(-(SLOPE1[1] - SLOPE0[1]), SLOPE1[0] - SLOPE0[0]);
const NRM = new THREE.Vector3(0, Math.cos(slopeAng), Math.sin(slopeAng));  // the slope's normal
const onSlope = (x, v, lift = 0) => new THREE.Vector3(x, (SLOPE0[1] + SLOPE1[1]) / 2 + v * Math.sin(slopeAng), (SLOPE0[0] + SLOPE1[0]) / 2 - v * Math.cos(slopeAng)).addScaledVector(NRM, lift);
const black = new THREE.MeshStandardMaterial({ color: 0x0d0d0e, metalness: 0, roughness: .42, roughnessMap: grainTex, envMapIntensity: .5 });
grainTex.repeat.set(1.5, 1.5);
{ const sh = new THREE.Shape(); sh.moveTo(-1.62, -1); sh.lineTo(-1.62, 0); sh.lineTo(SLOPE0[0], 0); sh.lineTo(SLOPE1[0], SLOPE1[1]); sh.lineTo(SLOPE1[0], -1); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: X1 - X0, bevelEnabled: true, bevelSize: .018, bevelOffset: -.018, bevelThickness: .018, bevelSegments: 3, steps: 1 });
  const bed = new THREE.Mesh(g, black); bed.rotation.y = -Math.PI / 2; bed.position.x = X1; bed.castShadow = bed.receiveShadow = true; scene.add(bed); }
const brassMat = new THREE.MeshStandardMaterial({ color: 0xc4a560, metalness: 1, roughness: .26, envMapIntensity: 1.3 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0xa9a59d, metalness: 1, roughness: .22, envMapIntensity: 1.2 });
for (let k = 0; k <= K; k++) for (const z of [-1.3, 2.1]) {                 // feet
  const f = new THREE.Mesh(new THREE.CylinderGeometry(.16, .19, .07, 40), brassMat); f.position.set(X0 + .5 + (X1 - X0 - 1) * k / K, -1.035, z); f.castShadow = true; scene.add(f); }
