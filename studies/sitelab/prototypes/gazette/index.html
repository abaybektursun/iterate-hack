<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invariant: gazette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0b0a09; --ui: #e9e2d3; --mute: #a59c8c; --faint: #7c7467; --rule: #322d27; --spot: #c8694f;
  --ink: #1a1613; --red: #9a2d1d; --hair: rgba(26, 22, 19, .62); --col: 372px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ui); overflow: hidden; font: 400 14px/1.5 "Archivo", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--spot); outline-offset: 3px; border-radius: 2px; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
canvas#c.pick { cursor: grab; }

/* the printed page: real text, laid on the sheet by a matrix3d that follows the camera */
#sheet { position: fixed; left: 0; top: 0; transform-origin: 0 0; opacity: 0; transition: opacity .22s linear; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 1; }
#sheet.off { pointer-events: none; transition: none; }
#scratch { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; z-index: -1; }
.pg { position: relative; width: 980px; height: 1330px; padding: 38px 44px 40px; display: flex; flex-direction: column; color: var(--ink); --fs: 13.6px;
  font: 400 var(--fs)/1.3 "Newsreader", Georgia, serif; font-optical-sizing: auto; font-variant-numeric: oldstyle-nums proportional-nums; font-kerning: normal;
  hyphens: manual; -webkit-hyphens: manual; overflow-wrap: anywhere; text-rendering: optimizeLegibility; }
.pg.t1 { --fs: 15px; } .pg.t2 { --fs: 16.6px; } .pg.t3 { --fs: 18.6px; } .pg.t4 { --fs: 21px; }
.pg * { margin: 0; }
.pg .lab { font-family: "Archivo", sans-serif; font-stretch: 96%; font-weight: 600; font-size: 9.6px; line-height: 1.3; letter-spacing: .13em; text-transform: uppercase; font-variant-numeric: lining-nums tabular-nums; hyphens: manual; }
.pg .red { color: var(--red); font-weight: 700; }
.topline { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--hair); }
.flag { font-weight: 500; font-size: 84px; line-height: 1; letter-spacing: -.022em; text-align: center; padding: 12px 0 10px; white-space: nowrap; hyphens: manual; }
.flag i { font-weight: 400; }
.dateline { display: flex; justify-content: space-between; gap: 6px 18px; flex-wrap: wrap; border-top: 3px double var(--ink); border-bottom: 1px solid var(--hair); padding: 6px 0 5px; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2.72fr) minmax(0, 1fr); gap: 0 20px; padding-top: 16px; }
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side { min-height: 0; overflow: hidden; border-left: 1px solid var(--hair); padding-left: 19px; }
.pg [data-id] { cursor: zoom-in; }

.lead { padding-bottom: 15px; }
.lead .lab { display: block; padding-bottom: 8px; }
.lead h3 { font-weight: 600; font-size: 3.5em; line-height: 1.01; letter-spacing: -.018em; text-wrap: balance; hyphens: manual; padding-bottom: .22em; }
.lead .stand { font-style: italic; font-weight: 400; font-size: 1.42em; line-height: 1.24; text-align: left !important; text-wrap: pretty; hyphens: manual; padding-bottom: .62em; }
.lbody { columns: 3; column-gap: 20px; column-rule: 1px solid var(--hair); border-top: 1px solid var(--hair); padding-top: 10px; }
.pg p { text-align: justify; text-indent: 1.15em; orphans: 2; widows: 2; }
.pg p:first-of-type, .pg p.ni { text-indent: 0; }
.dc { float: left; font-weight: 500; font-size: 4.15em; line-height: .8; padding: .05em .07em 0 0; margin-bottom: -.06em; color: var(--red); font-variant-numeric: lining-nums; }
.rl { font-variant-caps: all-small-caps; font-weight: 600; letter-spacing: .07em; padding-right: .2em; }

.rest { flex: 1; min-height: 0; overflow: hidden; columns: 3; column-gap: 20px; column-rule: 1px solid var(--hair); column-fill: auto; border-top: 3px double var(--ink); padding-top: 11px; }
.rest.bal { flex: 0 0 auto; column-fill: balance; }
.story { padding-bottom: .8em; margin-bottom: .75em; border-bottom: 1px solid var(--hair); }
.story .lab { display: block; padding-bottom: 4px; break-after: avoid; }
.story h4 { font-weight: 600; font-size: 1.5em; line-height: 1.08; letter-spacing: -.008em; hyphens: manual; text-wrap: balance; padding-bottom: .3em; break-after: avoid; break-inside: avoid; }
.story.a h4 { font-size: 2.05em; font-weight: 500; line-height: 1.04; letter-spacing: -.014em; }
.story.i h4 { font-style: italic; font-weight: 500; font-size: 1.62em; }
.hd { display: block; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--hair); padding: 5px 0 4px; margin-bottom: 8px; break-after: avoid; }
.side .hd ~ .hd { margin-top: 16px; }
.bs { padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid rgba(26, 22, 19, .28); break-inside: avoid; }
.bs .l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 5px; white-space: nowrap; }
.bs .m { font-variant-caps: all-small-caps; font-weight: 600; letter-spacing: .05em; flex: none; }
.bs .b { flex: none; }
.bs .dots { flex: 1 1 0; min-width: 0; border-bottom: 1px dotted var(--hair); transform: translateY(-3px); }
.bs .n { flex: none; margin-left: auto; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.bs .n i { font-style: normal; font-weight: 300; padding: 0 1px; }
.bs .cf { font-style: italic; font-size: .9em; line-height: 1.22; hyphens: manual; }
.more { display: block; padding: 2px 0 0; }
.tl { text-align: left !important; text-indent: -1em !important; padding: 0 0 .42em 1em; line-height: 1.2; hyphens: manual; break-inside: avoid; }
.tl i { font-style: normal; font-variant-caps: all-small-caps; letter-spacing: .05em; padding-left: .3em; white-space: nowrap; }
.side .tl { font-style: italic; }
.brief { padding-top: 2px; }
.grab { position: absolute; left: 0; bottom: 0; width: 132px; height: 132px; cursor: grab; }
.grab:active { cursor: grabbing; }
.pg.narrow { width: 430px; height: 800px; padding: 18px 18px 20px; --fs: 12.3px; }
.pg.narrow.t1 { --fs: 13.2px; } .pg.narrow.t2 { --fs: 14.2px; } .pg.narrow.t3 { --fs: 15.4px; } .pg.narrow.t4 { --fs: 16.8px; }
.narrow .lab { font-size: 7.6px; letter-spacing: .12em; }
.narrow .flag { font-size: 39px; padding: 7px 0 6px; }
.narrow .topline { padding-bottom: 4px; }
.narrow .dateline { justify-content: center; padding: 4px 0 3px; text-align: center; }
.narrow .body { display: flex; flex-direction: column; padding-top: 10px; }
.narrow .lead { padding-bottom: 9px; }
.narrow .lead h3 { font-size: 2.15em; }
.narrow .lead .stand { font-size: 1.16em; }
.narrow .lbody { columns: 2; column-gap: 14px; padding-top: 7px; }
.narrow .rest { columns: 2; column-gap: 14px; padding-top: 8px; }
.narrow .story.a h4 { font-size: 1.5em; font-weight: 600; } .narrow .story.i h4 { font-size: 1.4em; } .narrow .story h4 { font-size: 1.3em; }
.narrow .grab { width: 84px; height: 84px; }
.narrow .sideblock { padding-bottom: 6px; }

/* the words around the stone */
.shade { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, rgba(9, 8, 7, .93), rgba(9, 8, 7, .78) 20%, rgba(9, 8, 7, 0) 34%); }
.shade::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0a09 0, #0b0a09 calc(var(--col) + 6px), rgba(11, 10, 9, 0) calc(var(--col) + 46px)); opacity: 0; transition: opacity .3s; }
body.zoomed .shade::after { opacity: 1; }
.colm { position: fixed; left: 0; top: 0; bottom: 0; width: var(--col); padding: 22px 0 18px 40px; display: flex; flex-direction: column; pointer-events: none; z-index: 2; }
.colm > * { pointer-events: auto; }
.top { display: flex; align-items: baseline; gap: 14px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--faint); }
.top a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--rule); }
.top a:hover { color: var(--ui); }
h1 { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 26px; line-height: 1.19; letter-spacing: -.012em; margin: 24px 0 12px; text-wrap: balance; }
h1 b { font-weight: 400; color: #f4ecdb; font-variant-numeric: lining-nums; } h1 b.s { color: var(--spot); }
.note { font-size: 12.5px; color: var(--mute); padding-bottom: 14px; }
.ctl { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--rule); padding: 12px 0 10px; }
.ctl button { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; border: 1px solid #4b443b; border-radius: 99px; padding: 4px 13px; }
.ctl button:hover { border-color: var(--spot); } .ctl button:disabled { opacity: .3; cursor: default; border-color: #4b443b; }
.ctl span { margin-left: auto; font-family: "Newsreader", serif; font-size: 17px; font-weight: 300; color: var(--ui); white-space: nowrap; }
.listhead, .list button { display: grid; grid-template-columns: 74px 30px 1fr; gap: 10px; align-items: baseline; }
.listhead { font-size: 10.5px; letter-spacing: .06em; color: var(--faint); padding: 2px 0 4px; border-bottom: 1px solid var(--rule); }
.list { flex: 0 0 auto; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3a352f transparent; }
.list button { width: 100%; padding: 4px 0; font-size: 12.5px; color: var(--mute); border-bottom: 1px solid #211e1a; font-variant-numeric: tabular-nums; }
.list button em { font-style: normal; font-family: "Newsreader", serif; font-size: 15px; line-height: 1; color: var(--ui); text-align: right; font-variant-numeric: lining-nums tabular-nums; }
.list button span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: "Newsreader", serif; font-size: 14px; }
.list button:hover, .list button.on { color: var(--ui); } .list button.on span:first-child { color: var(--spot); }
.def { font-size: 11.5px; line-height: 1.45; color: var(--faint); padding-top: 10px; margin-top: auto; flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3a352f transparent; }
.def b { color: var(--mute); font-weight: 500; } .def summary { display: none; } .def p { margin: 0 0 5px; }
#slip { position: fixed; z-index: 3; right: 26px; bottom: 24px; width: 300px; background: #ece3cf; color: var(--ink); padding: 13px 16px 12px; border-radius: 1px; box-shadow: 0 1px 0 rgba(255, 255, 255, .25) inset, 0 14px 34px rgba(0, 0, 0, .55);
  transform: translateY(10px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .28s cubic-bezier(.2, .7, .2, 1); font-family: "Newsreader", Georgia, serif; }
#slip.on { opacity: 1; transform: none; pointer-events: auto; }
#slip .k { font: 600 9.5px/1.3 "Archivo", sans-serif; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; border-bottom: 1px solid var(--hair); padding-bottom: 5px; }
#slip .k button { letter-spacing: .06em; text-transform: none; font-weight: 500; color: var(--ink); opacity: .7; }
#slip .id { font-size: 25px; line-height: 1.1; font-weight: 500; letter-spacing: -.01em; padding: 8px 0 2px; font-variant-numeric: lining-nums; }
#slip .by { font-size: 15px; line-height: 1.3; } #slip .by b { font-weight: 600; }
#slip .wy { font: 500 11px/1.4 "Archivo", sans-serif; color: var(--red); padding-top: 7px; }
#err { position: fixed; left: 8px; bottom: 8px; color: #d0725a; font-size: 12px; white-space: pre-wrap; z-index: 9; max-width: 70%; }

@media (max-width: 1180px) { :root { --col: 306px; } .colm { padding-left: 24px; } h1 { font-size: 22px; } }
@media (max-width: 760px) {
  .shade { background: linear-gradient(180deg, rgba(9, 8, 7, .9), rgba(9, 8, 7, 0) 15%, rgba(9, 8, 7, 0) 90%, rgba(9, 8, 7, .9)); }
  .shade::after { background: linear-gradient(180deg, #0b0a09 0, #0b0a09 84px, rgba(11, 10, 9, 0) 104px); }
  .colm { width: auto; right: 0; padding: 9px 12px 7px; }
  .top { font-size: 10.5px; gap: 10px; }
  h1 { font-size: 13.6px; line-height: 1.2; margin: 5px 0 0; font-weight: 400; text-wrap: pretty; }
  .note, .listhead, .list { display: none; }
  .ctl { margin-top: auto; border-top: 0; padding: 0; gap: 6px; }
  .ctl button { background: rgba(14, 13, 11, .85); padding: 5px 12px; } .ctl span { font-size: 15px; }
  .def { position: absolute; left: 12px; right: 12px; bottom: 44px; margin: 0; padding: 0; }
  .def summary { display: inline-block; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--mute); cursor: pointer; background: rgba(14, 13, 11, .85); padding: 2px 8px; border-radius: 99px; list-style: none; }
  .def[open] { background: rgba(14, 13, 11, .96); border: 1px solid var(--rule); padding: 8px 10px; max-height: 50vh; overflow-y: auto; }
  #slip { left: 10px; right: 10px; width: auto; bottom: 50px; }
}
</style>

<body>
<canvas id="c" aria-label="A letterpress proof sheet on a printer's stone under a lamp, with the stack of earlier editions turned face down beside it"></canvas>
<div id="sheet" class="off"></div>
<div id="scratch"></div>
<div class="shade"></div>
<div class="colm">
  <div class="top"><a href="../../">← Lab</a><span>Gazette · the board in print</span></div>
  <h1 id="line">&nbsp;</h1>
  <div class="note" id="note"></div>
  <div class="ctl">
    <button id="prev" aria-label="Earlier edition">←</button><button id="play" aria-label="Page through the two days">Play</button><button id="next" aria-label="Later edition">→</button>
    <span id="now"></span>
  </div>
  <div class="listhead"><span>Edition, UTC</span><span>results</span><span>lead</span></div>
  <div class="list" id="list"></div>
  <details class="def" id="def"></details>
</div>
<div id="slip"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import hyphen from 'https://cdn.jsdelivr.net/npm/hyphen@1.10.4/en-us/+esm';   // the TeX patterns: browsers differ in whether hyphens: auto has a dictionary

const $ = id => document.getElementById(id);
const err = m => { $('err').textContent += m + '\n'; };
addEventListener('error', e => err(e.message));
addEventListener('unhandledrejection', e => err(String(e.reason && e.reason.message || e.reason)));
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cut = (t, n) => t.length <= n ? t : t.slice(0, n - 1).replace(/\s+\S*$/, '').replace(/[,;:(\[]$/, '') + '…';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const BLOCK = 10800, SF = -8 * 3600;   // 3-hour blocks on the UTC clock; San Francisco is UTC-8 in November
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const two = n => String(n).padStart(2, '0');
const hm = s => { const d = new Date(s * 1000); return two(d.getUTCHours()) + ':' + two(d.getUTCMinutes()); };
const REFUTED = /refut|\bnot?\b|\bloses\b/i;

/* ───────── data: the snapshot of build.py, then the board itself ───────── */
const DATA = await (await fetch('data.json')).json();
let results = DATA.results, work = DATA.work, readAt = DATA.built, live = false, EDS = [];

function compose() {
  results.sort((a, b) => a.t - b.t);
  const by = new Map(), best = new Map();
  for (const r of results) { const b = Math.floor(r.t / BLOCK); if (!by.has(b)) by.set(b, []); by.get(b).push(r); }
  EDS = [...by.keys()].sort((a, b) => a - b).map(b => {
    const rs = by.get(b), ed = { b, t0: b * BLOCK, rs, lines: [] };
    for (const r of rs) {
      r.gain = r.topl = null; r.head = r.title || cut(r.what || r.text || r.caveat || r.id, 84);
      const mine = [];
      for (const l of r.sc || []) {
        const pct = 100 * l[2] / l[3], key = l[1] + '|' + l[3], line = { r, l, pct, gain: 0 };
        if (l[0] !== 'rl') {   // a gain: points above the best score any earlier result posted on this benchmark for a model other than RL
          if (best.has(key) && pct > best.get(key)) { line.gain = pct - best.get(key); if (!r.gain || line.gain > r.gain.gain) r.gain = line; }
          mine.push([key, pct]);
        }
        if (l[3] >= 100 && (!r.topl || pct > r.topl.pct)) r.topl = line;
        ed.lines.push(line);
      }
      for (const [k, p] of mine) if (!best.has(k) || p > best.get(k)) best.set(k, p);
    }
    const g = rs.filter(r => r.gain).sort((a, c) => c.gain.gain - a.gain.gain)[0], h = rs.filter(r => r.topl).sort((a, c) => c.topl.pct - a.topl.pct)[0];
    if (g) { ed.lead = g; ed.mark = g.gain; ed.why = `Largest gain · ${g.gain.l[1]} +${g.gain.gain.toFixed(1)} points to ${g.gain.l[2]}/${g.gain.l[3]}`; }
    else if (h) { ed.lead = h; ed.mark = h.topl; ed.why = `Highest score · ${h.topl.l[2]}/${h.topl.l[3]} on ${h.topl.l[1]}`; }
    else { ed.lead = rs.find(r => r.what) || rs[0]; ed.why = 'First result posted'; }
    ed.others = rs.filter(r => r !== ed.lead).sort((a, c) => !!c.what - !!a.what || !!c.text - !!a.text || a.t - c.t);
    ed.refuted = rs.filter(r => REFUTED.test(r.title || ''));
    ed.commits = DATA.commits.filter(c => c >= ed.t0 && c < ed.t0 + BLOCK).length;
    const wf = Math.max(ed.t0, DATA.work_from), we = ed.t0 + BLOCK;   // the board lists closed work items only from work_from on
    ed.work = we > wf ? [work.filter(w => w[1] >= wf && w[1] < we).length, work.filter(w => w[2] >= wf && w[2] < we).length, wf > ed.t0 ? wf : 0] : null;
    return ed;
  });
}
compose();

/* ───────── the page: one front page per edition, set in HTML ───────── */
let narrow = innerWidth <= 760, PW = 980, PH = 1330;
const pages = new Map();   // edition index -> { el, canvas, tex }
const stamp = s => { const d = new Date(s * 1000); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const hy = t => esc(hyphen.hyphenateSync(t, { minWordLength: 6 }));
const para = (label, t) => t ? `<p>${label ? `<span class="rl">${label}</span> ` : ''}${hy(t)}</p>` : '';

function storyNode(r, k) {
  const a = document.createElement('article');
  a.className = 'story' + (k === 0 ? ' a' : k % 3 === 2 ? ' i' : ''); a.dataset.id = r.id;
  const body = r.what ? para('', r.what) + para('Why', r.why) + para('Caveat', r.caveat) : para('', r.text ? cut(r.text, 380) : '') + para('Caveat', r.caveat);
  a.innerHTML = `<span class="lab">${hm(r.t)} UTC</span><h4>${esc(r.head)}</h4>${body}`;
  return a;
}
function scoreNode(line, mark) {
  const d = document.createElement('div'), l = line.l;
  d.className = 'bs'; d.dataset.id = line.r.id;
  d.innerHTML = `<div class="l1"><span class="m">${l[0] === 'rl' ? 'RL' : esc(l[0])}</span><span class="b">${esc(l[1])}</span><span class="dots"></span><span class="n${line === mark ? ' red' : ''}">${l[2]}<i>/</i>${l[3]}</span></div><div class="cf">${esc(cut(l[4], 74))}</div>`;
  return d;
}
const titleNode = (r, time) => { const p = document.createElement('p'); p.className = 'tl'; p.dataset.id = r.id; p.innerHTML = esc(r.head) + (time ? `<i>${hm(r.t)}</i>` : ''); return p; };
const label = (cls, t) => { const s = document.createElement('span'); s.className = 'lab ' + cls; s.textContent = t; return s; };

function buildPage(i) {
  const ed = EDS[i], L = ed.lead, d0 = new Date(ed.t0 * 1000), h0 = d0.getUTCHours(), sf = new Date((ed.t0 + SF) * 1000).getUTCHours();
  const pg = document.createElement('div');
  pg.className = 'pg ' + (narrow ? 'narrow' : 'wide');
  const wk = ed.work ? `Work items${ed.work[2] ? ' since ' + hm(ed.work[2]) : ''} ${ed.work[0]} opened, ${ed.work[1]} closed` : 'Work items not on the board’s list';
  const lb = [L.what ? L.why : L.text, L.what ? L.caveat : '', L.what ? L.text : L.caveat].filter(Boolean).map((t, k) => {

  const fresh = b.items.filter(i => i.kind === 'result' && !have.has(i.id)).map(i => { const p = b.plain[i.id] || {}, r = { id: i.id, t: Math.floor(i.at_ns / 1e9), who: i.who, sc: b.scores.filter(s => s.result === i.id).map(s => [s.model, s.benchmark, s.right, s.n, cut(s.config, 120), s.tokens]) };
    for (const k of ['title', 'what', 'why', 'caveat']) if (p[k]) r[k] = cut(p[k], k === 'title' ? 140 : 420);
    const t = cut(rest(i.text), 900); if (t) r.text = t; return r; });
  const wk = new Map(work.map(w => [w[0], w]));
  for (const i of b.items) if (i.kind === 'work') wk.set(i.id, [i.id, Math.floor(i.at_ns / 1e9), i.closed_at ? Date.parse(i.closed_at) / 1000 : 0]);
  const changed = fresh.length || wk.size !== work.length || [...wk.values()].some(w => !work.find(o => o[0] === w[0] && o[2] === w[2]));
  live = true; readAt = Math.floor(Date.now() / 1000);
  if (changed) {
    const n = EDS.length, at = EDS[cur].b;
    results = results.concat(fresh); work = [...wk.values()]; compose();
    for (const p of pages.values()) p.tex.dispose(); pages.clear();
    if (EDS.length !== n) makeSheets();
    for (const s of sheets) { s.u.uHas.value = 0; s.u.uTex.value = blank; }
    cur = Math.max(0, EDS.findIndex(e => e.b === at)); if (!q.get('e')) cur = EDS.length - 1;
    want = cur; shown = -1; fly = null; setStacks(); words(); show(); hold();
  } else { for (const p of pages.values()) { const s = p.el.querySelector('.read'); if (s) s.textContent = `Board read ${hm(readAt)} UTC`; } }
}
