}

const store = { get() { try { return JSON.parse(localStorage.getItem('call-it') || '[]'); } catch { return []; } },
                add(g) { try { localStorage.setItem('call-it', JSON.stringify([...store.get(), g].slice(-20))); } catch {} } };

// ---- renderer, light, room
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x12100d);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(34, 1, 1, 600);
const key = new THREE.SpotLight(0xffe6c8, 5.6, 0, 0.5, 1, 0); key.position.set(-20, 44, 20); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 3; key.shadow.blurSamples = 8; key.shadow.bias = -0.0003;
key.shadow.camera.near = 20; key.shadow.camera.far = 90;

scene.add(key, key.target, rim, new THREE.HemisphereLight(0xfff1dc, 0x15110c, 0.12));
const MAXA = renderer.capabilities.getMaxAnisotropy();

// ---- procedural surfaces
function tex(w, h, draw, rx = 1, ry = 1, color = false) {

  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let k = 0; k < n; k++) { g.globalAlpha = 0.05 + rnd() * 0.2; g.fillStyle = tones[k % tones.length]; g.beginPath(); g.arc(rnd() * w, rnd() * h, r * (0.3 + rnd()), 0, 7); g.fill(); }
  g.globalAlpha = 1;
};
const woodMap = tex(1024, 256, streaks('#4a3324', ['#2a1a10', '#66493a', '#38241a', '#57402f'], 3200, 460, 1.5), 1, 1, true);
const ebonyMap = tex(1024, 256, streaks('#1d1a17', ['#0e0c0a', '#2c2823', '#141210'], 2200, 420, 1.5), 1, 1, true);
const woodBump = tex(1024, 256, streaks('#808080', ['#404040', '#c0c0c0'], 2200, 380, 1.4));
const brushed = tex(512, 512, streaks('#8c8c8c', ['#3c3c3c', '#e8e8e8'], 5200, 300, 1));

  return new THREE.MeshStandardMaterial({ map: m, bumpMap: b, bumpScale: 0.3, roughness: src === woodMap ? 0.38 : 0.7 }); };
const metal = (color, rough, rx = 1, ry = 1) => { const b = brushed.clone(); b.repeat.set(rx, ry); b.needsUpdate = true;
  return new THREE.MeshStandardMaterial({ color, metalness: 1, roughness: rough, roughnessMap: b, bumpMap: b, bumpScale: 0.12, envMapIntensity: 1.1 }); };
const brass = metal(0xb89455, 0.62), brassLong = metal(0x9c7d48, 0.7, 30, 1), nickel = metal(0xc2c4c4, 0.55), blued = metal(0x4a607c, 0.5), black = metal(0x25231f, 0.78, 12, 1);
const redEnamel = new THREE.MeshPhysicalMaterial({ color: 0xb23f29, roughness: 0.35, clearcoat: 0.6 });
const ivory = new THREE.MeshStandardMaterial({ color: 0xe6dcc3, roughness: 0.42 });
const box = (w, h, d, mat, r = 0.05) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat); m.castShadow = m.receiveShadow = true; return m; };

// ---- the instrument. 1 scale unit = U world units; x runs along the rule, z toward the viewer.
const U = 0.2, TILE = 25, H = 0.5, TW = 2.7, ZR = TW / 2 + 0.45, ROWS_Z0 = -(TW / 2 + 1.25), RACK_D = 4.2, BACK = ROWS_Z0 - RACK_D - 0.15, ZB = ZR + 1.1;
const desk = new THREE.Mesh(new THREE.PlaneGeometry(700, 300), new THREE.MeshStandardMaterial({ map: leatherMap, roughness: 0.8, metalness: 0, envMapIntensity: 0.5 }));
desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);
const fixed = new THREE.Group(), sight = new THREE.Group(); scene.add(fixed, sight);
for (const z of [ZR, -ZR]) { const r = box(420, H, 0.86, wood(52)); r.position.set(0, H / 2, z); fixed.add(r); }
const beam = box(420, 0.18, 0.5, brassLong, 0.03); beam.position.set(0, 0.09, ZB); fixed.add(beam);
// cursor: glass, two brass bridges, the red hairline
const cursor = new THREE.Group(); sight.add(cursor);
const glass = new THREE.Mesh(new RoundedBoxGeometry(2.3, 0.07, 2 * ZR + 0.9, 2, 0.03), new THREE.MeshPhysicalMaterial({ color: 0xf2f6f4, transparent: true, opacity: 0.16, roughness: 0.04, metalness: 0, clearcoat: 1, envMapIntensity: 1.6, depthWrite: false }));
glass.position.y = H + 0.1; cursor.add(glass);
for (const z of [ZR + 0.3, -ZR - 0.3]) { const b = box(2.6, 0.26, 0.34, brass, 0.06); b.position.set(0, H + 0.1, z); cursor.add(b);
  for (const x of [-1.05, 1.05]) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 16), nickel); s.position.set(x, H + 0.245, z); cursor.add(s); } }
const hair = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.012, 2 * ZR + 0.3), new THREE.MeshBasicMaterial({ color: 0xc23a22 })); hair.position.y = H + 0.058; cursor.add(hair);
// caliper jaws on the brass beam
function jaw(side) {
  const g = new THREE.Group();
  const body = box(0.5, 0.62, 1.0, brass, 0.07); body.position.set(side * 0.25, 0.31, ZB); g.add(body);
  const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.16, 24), nickel); knob.position.set(side * 0.25, 0.7, ZB); knob.castShadow = true; g.add(knob);
  const len = ZB + TW / 2 - 0.3, blade = box(0.05, 0.05, len, blued, 0.01); blade.position.set(0, H + 0.2, ZB - 0.4 - len / 2); g.add(blade);
  const tooth = box(0.05, 0.3, 0.3, blued, 0.01); tooth.position.set(0, H + 0.08, ZB - 0.45); g.add(tooth);
  sight.add(g); return g;
}
const jawL = jaw(-1), jawH = jaw(1);
// the carriage: slide with the printed scale, the rack of forecasts under a lid, the steel needle
const carriage = new THREE.Group(); scene.add(carriage);
const tapeMat = () => new THREE.MeshStandardMaterial({ roughness: 0.4 });
let tiles = [], body = null, tray = null, lidPivot = new THREE.Group(), rack = new THREE.Group(), needle = new THREE.Group();
carriage.add(lidPivot, rack, needle);
{ const bar = box(0.08, 0.08, TW / 2 - BACK + 0.2, blued, 0.015); bar.position.set(0, H + 0.42, (TW / 2 + BACK) / 2 - 0.1); needle.add(bar);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 24), blued); head.position.set(0, H + 0.42, BACK + 0.05); head.castShadow = true; needle.add(head);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.36, TW - 0.1), blued); edge.position.set(0, H + 0.22, 0); needle.add(edge); needle.visible = false; }

function drawTile(g, W, Hh, r, t0) {
  const px = W / TILE, X = v => (v - t0) * px, ink = '#2b2118';
  g.fillStyle = '#e4d9bd'; g.fillRect(0, 0, W, Hh);
  for (let k = 0; k < 900; k++) { g.globalAlpha = 0.03 + rnd() * 0.05; g.fillStyle = k % 2 ? '#bfae88' : '#f6efdc'; g.fillRect(rnd() * W, rnd() * Hh, 30 + rnd() * 160, 1); }

  const side = jawAt(e.clientX, e.clientY); canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag');
  drag = { side, x: e.clientX, p0: S.p, d0: side < 0 ? S.dl : S.dh, target: S.p }; S.goal = null; click(0.5, 1.4);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) { canvas.classList.toggle('pick', !!rowAt(e.clientX, e.clientY) || !!jawAt(e.clientX, e.clientY)); return; }
  const dx = (e.clientX - drag.x) * perPx(), r = R();
  if (!drag.side) drag.target = drag.p0 - dx;
  else { const d = Math.max(r.step, Math.min(r.hi - r.lo, snap(drag.d0 + drag.side * dx, r.step))), was = drag.side < 0 ? S.dl : S.dh;
    if (d !== was) { if (drag.side < 0) S.dl = d; else S.dh = d; click(0.7, 1.25); readout(); if (still) frame(0); } }
});
const up = () => { if (!drag) return; drag = null; canvas.classList.remove('drag'); writeHash(); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { if (S.phase !== 'aim') return; e.preventDefault(); S.goal = null; S.v += (e.deltaY + e.deltaX) * 0.25; }, { passive: false });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key === 'Enter') { e.preventDefault(); $('go').click(); return; }
  if (S.phase !== 'aim') return;
  const r = R(), k = e.altKey ? 1 : (e.shiftKey ? 10 : 1) / Math.min(1, r.step), dir = { ArrowRight: 1, ArrowLeft: -1, PageUp: 25, PageDown: -25 }[e.key], wid = { ArrowUp: 1, ArrowDown: -1 }[e.key];
  if (dir) { e.preventDefault(); S.v = 0; S.goal = Math.max(r.lo, Math.min(r.hi, snap(S.goal ?? S.p, r.step) + dir * k * r.step)); click(0.8); }
  if (wid) { e.preventDefault(); const lim = x => Math.max(r.step, Math.min(r.hi - r.lo, x + wid * k * r.step)); S.dl = lim(S.dl); S.dh = lim(S.dh); click(0.7, 1.25); readout(); writeHash(); }
  if (still) frame(0);
});
addEventListener('hashchange', boot);
canvas.addEventListener('webglcontextlost', e => e.preventDefault()); canvas.addEventListener('webglcontextrestored', () => location.reload());
addEventListener('resize', () => { resize(); table(); if (still) frame(0); });

// ---- motion
const spring = (x, v, target, k, c, dt) => { v += (-k * (x - target) - c * v) * dt; return [x + v * dt, v]; };
let jl = 0, jh = 0, lastDet = 0, shown = '';
function step(dt) {
  const r = R();
  if (S.phase === 'aim') {
    const before = S.p;
    if (drag && !drag.side) { const np = S.p + (drag.target - S.p) * (1 - Math.exp(-dt * 16)); S.v = S.v * 0.6 + 0.4 * (np - S.p) / dt; S.p = np; }
    else if (S.goal != null) { [S.p, S.v] = spring(S.p, S.v, S.goal, 420, 38, dt); if (Math.abs(S.p - S.goal) < 0.004 && Math.abs(S.v) < 0.05) { S.p = S.goal; S.v = 0; S.goal = null; writeHash(); } }
    else { S.p += S.v * dt; S.v *= Math.exp(-dt * 1.9);                                  // coast, then fall into the nearest detent
      if (Math.abs(S.v) < 14 * r.step + 4) { const t = snap(S.p, r.step); S.v += (-260 * (S.p - t) - 22 * S.v) * dt;
        if (Math.abs(S.p - t) < 0.003 && Math.abs(S.v) < 0.05 && S.p !== t) { S.p = t; S.v = 0; writeHash(); } } }
    if (S.p < r.lo) { S.p = r.lo; S.v = Math.abs(S.v) * 0.25; click(1.4, 0.5); } if (S.p > r.hi) { S.p = r.hi; S.v = -Math.abs(S.v) * 0.25; click(1.4, 0.5); }
    const det = Math.round(S.p / Math.max(r.step, 1)); if (det !== lastDet) { lastDet = det; if (before !== S.p) click(Math.min(1, 0.35 + Math.abs(S.v) / 120)); }
  } else {
    A.t += dt; const c = S.commits[S.i];
    if (drag) { const np = S.p + (drag.target - S.p) * (1 - Math.exp(-dt * 16)); S.v = S.v * 0.6 + 0.4 * (np - S.p) / dt; S.p = np; }
    else if (!A.scored) S.p += (A.nx - S.p) * (1 - Math.exp(-dt * 3.2));
    else { S.p += S.v * dt; S.v *= Math.exp(-dt * 2.4); }
    S.p = Math.max(r.lo, Math.min(r.hi, S.p));
    const det = Math.round(S.p); if (det !== lastDet) { lastDet = det; if (Math.abs(A.nv) > 3 || drag) click(0.4); }
    if (A.t > 0.15) [A.lid, A.lidV] = spring(A.lid, A.lidV, A.lidT, 30, 9.5, dt);
    if (A.t > 1.0 && A.nT == null) { A.nT = r.measured; needle.visible = true; click(1.2, 0.8); }
    if (A.nT != null) { const k = 26, cc = 7.6; [A.nx, A.nv] = spring(A.nx, A.nv, A.nT, k, cc, dt);
      if (!A.scored && ((Math.abs(A.nx - A.nT) < 0.3 && Math.abs(A.nv) < 2.5) || A.t > 3.8)) { A.scored = true; A.dialT = c.gain; click(1.6, 0.55); text(); table(); } }
    [A.dial, A.dialV] = spring(A.dial, A.dialV, A.dialT, 38, 5.5, dt);
  }
  if (S.phase === 'aim') [A.dial, A.dialV] = spring(A.dial, A.dialV, 0, 38, 9, dt);
  V.hw += (V.hwT - V.hw) * (1 - Math.exp(-dt * 2.6));
  jl += (S.dl - jl) * (1 - Math.exp(-dt * 20)); jh += (S.dh - jh) * (1 - Math.exp(-dt * 20));
}
let sig = '';
function draw(force) {
  const r = R(), now = [S.p, jl, jh, A.lid, A.nx, A.dial, V.hw, V.w, V.h, S.i, S.phase, A.scored, needle.visible, S.sel].map(x => typeof x === 'number' ? x.toFixed(4) : x).join();
  if (now === sig && !force) return;                    // nothing moved: no render
  sig = now; place();
  carriage.position.x = -(S.p - r.lo) * U;
  sight.position.x = S.phase === 'reveal' ? (S.call - S.p) * U : 0;
  jawL.position.x = -jl * U; jawH.position.x = jh * U;
  lidPivot.scale.z = Math.max(0.05, 1 - 0.94 * A.lid);                   // the cover rolls back into its housing
  needle.position.x = (A.nx - r.lo) * U;
  for (const o of rows) o.g.position.y = o.f.who === S.sel ? 0.14 : 0;
  dneedle.rotation.y = -Math.max(-3.15, Math.min(3.15, A.dial)) / 3 * 2 * Math.PI / 3;
  key.target.position.set(0, 0, 0);
  renderer.render(scene, camera);
  const c = mine(), put = (el, [x, y], dy = 0) => { el.style.left = x + 'px'; el.style.top = y + dy + 'px'; };
  const s = `${num(c.value)}|${num(c.low)}|${num(c.high)}`;
  if (s !== shown && S.phase === 'aim') { shown = s; readout(); }
  $('tv').textContent = num(c.value); $('tl').textContent = num(c.low); $('th').textContent = num(c.high);
  const sx = sight.position.x, zt = ZB + 0.95;
  put($('tv'), scr(sx, 0.2, zt), 0); put($('tl'), scr(sx + jawL.position.x - 0.25, 0.2, zt)); put($('th'), scr(sx + jawH.position.x + 0.25, 0.2, zt));
  const near = (jl + jh) * U * V.w / (2 * V.hw) < 120; $('tv').style.opacity = near ? 0 : 1;
  if (needle.visible) { $('tm').hidden = false; $('tm').innerHTML = `<i>Measured</i>${A.scored ? num(r.measured) : num(snap(A.nx, r.step))}`; put($('tm'), scr(needle.position.x + carriage.position.x, 0.6, ZR + 0.1)); }
}
let last = 0;
const FPS = new URLSearchParams(location.search).has('fps') ? { n: 0, t0: 0, first: 0 } : null;      // ?fps prints the frame rate, for checking
function frame(t) {
  if (FPS) { FPS.first ||= Math.round(performance.now()); FPS.n++; if (t - FPS.t0 > 2000) { $('err').textContent = `${Math.round(FPS.n * 1000 / (t - FPS.t0))} fps, first frame at ${FPS.first} ms`; FPS.n = 0; FPS.t0 = t; } } const dt = Math.min(0.25, (t - last) / 1000 || 0.016); last = t;
  if (still) { for (let k = 0; k < 240; k++) step(0.016); V.hw = V.hwT; jl = S.dl; jh = S.dh; draw(); return; }
  for (let k = Math.max(1, Math.ceil(dt * 120)), h = dt / k; k > 0; k--) step(h);      // fixed small steps: the motion keeps real time at any frame rate
  draw(); requestAnimationFrame(frame); }

function boot() {
  const q = readHash(), n = S.commits.length, a = (q.get('a') || '').split(':').map(Number);
  if (q.get('v') && n) { S.i = n - 1; buildRound(R()); S.phase = 'aim'; commit(true); }
  else if (n >= NR) { S.i = NR - 1; buildRound(R()); commit(true); }
  else { const r = ROUNDS[n], ok = a.length === 3 && a.every(Number.isFinite) && a[0] >= r.lo && a[0] <= r.hi && a[1] >= r.step && a[2] >= r.step;
    startRound(n, ok ? [snap(a[0], r.step), snap(a[1], r.step), snap(a[2], r.step)] : null); jl = S.dl; jh = S.dh; }
  if (still) frame(0);
}
resize(); boot(); V.hw = V.hwT; jl = S.dl; jh = S.dh;
if (still) frame(0); else requestAnimationFrame(frame);
</script>
