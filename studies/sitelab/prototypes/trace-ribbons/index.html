<style>
/* A bench instrument in a dark room: wire, brass, glass, stone and one red lacquer mark. Warm charcoal and bone; value does the work. */
:root { color-scheme: dark; --paper: #131211; --ink: #e8e2d6; --mute: #a39c90; --faint: #736d64; --rule: #2c2925; --accent: #c9583c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
body { font: 400 13.5px/1.5 "Archivo", ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#gl.drag { cursor: grabbing; }
canvas#gl.hit { cursor: pointer; }
.caps { font-size: 10.5px; font-weight: 560; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

.lead { position: fixed; left: 48px; top: 40px; width: min(400px, calc(100vw - 96px)); pointer-events: none; }
.lead::before { content: ""; position: absolute; inset: -70px -110px -80px -70px; z-index: -1; background: radial-gradient(closest-side, rgba(19, 18, 17, .86) 55%, transparent); }
.inside .lead::before { background: radial-gradient(closest-side, rgba(19, 18, 17, .95) 60%, transparent); }
.kicker { display: flex; gap: 14px; align-items: baseline; }
.kicker b { color: var(--ink); font-weight: 560; }
h1 { font: 300 clamp(21px, 1.85vw, 27px)/1.26 "Newsreader", Georgia, serif; margin: 18px 0 22px; letter-spacing: -.004em; text-wrap: pretty; }
h1 em { font-style: italic; font-weight: 400; }
.share { pointer-events: auto; border-top: 1px solid var(--rule); padding-top: 14px; }
.share p { margin: 0 0 12px; color: var(--mute); font-size: 12.5px; }
.bar { display: flex; height: 5px; margin-bottom: 12px; background: #1c1a18; gap: 1px; }
.bar i { display: block; height: 100%; }
.legend button { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 2.5px 0; font-size: 12.5px; color: var(--mute); border-bottom: 1px solid transparent; transition: color .2s, opacity .2s; }
.legend button:hover, .legend button[aria-pressed=true] { color: var(--ink); }
.legend.has button:not([aria-pressed=true]) { opacity: .38; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 55%, #000)); }
.legend i.flat { height: 2px; border-radius: 0; background: var(--c); width: 12px; }
.legend span:last-child { color: var(--ink); font-weight: 500; }
.note { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--faint); font-size: 12px; }

.side { position: fixed; right: 0; top: 0; bottom: 138px; width: min(380px, 92vw); padding: 40px 36px 0 30px; display: flex; flex-direction: column;
  background: linear-gradient(90deg, transparent, rgba(19, 18, 17, .9) 20%); transform: translateX(100%); transition: transform .6s cubic-bezier(.3, 0, .15, 1); }
.side.open { transform: none; }
.side h2 { font: 300 24px/1.2 "Newsreader", Georgia, serif; margin: 10px 0 2px; }
.side .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 14px 0; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.side .facts span:nth-child(odd) { color: var(--faint); }
.step { display: flex; align-items: center; gap: 16px; font-size: 12.5px; color: var(--mute); margin: 6px 0 10px; }
.step button { width: 28px; height: 28px; border: 1px solid var(--rule); text-align: center; color: var(--ink); transition: border-color .2s; }
.step button:hover { border-color: var(--mute); }
.calls { flex: 1; overflow-y: auto; margin-right: -16px; padding-right: 12px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.calls button { display: grid; grid-template-columns: 9px 42px 1fr auto; gap: 10px; align-items: baseline; width: 100%; padding: 4.5px 0; font-size: 12.5px; color: var(--mute); border-bottom: 1px solid #1d1b19; }

.x { position: absolute; right: 30px; top: 34px; width: 28px; height: 28px; text-align: center; color: var(--mute); font-size: 17px; }

.dock { position: fixed; left: 48px; right: 48px; bottom: 26px; }
.dock::before { content: ""; position: absolute; inset: -30px -48px -26px; z-index: -1; background: linear-gradient(transparent, rgba(19, 18, 17, .9) 45%); pointer-events: none; }

  background: #1a1816; border: 1px solid #37332e; opacity: 0; transition: opacity .15s; z-index: 5; }
.tip.on { opacity: 1; }
.tip b { font-weight: 560; } .tip span { color: var(--mute); }
.tag { position: fixed; pointer-events: none; font-size: 12px; color: var(--mute); white-space: nowrap; transform: translate(0, -50%); text-shadow: 0 0 5px var(--paper), 0 0 2px var(--paper); transition: opacity .4s; }
.tag b { color: var(--ink); font-weight: 500; }
.ring { position: fixed; pointer-events: none; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 1px solid var(--ink); opacity: 0; }

  .lead { left: 18px; top: 16px; width: calc(100vw - 36px); } .legend, .share p { display: none; } h1 { font-size: 19px; margin: 10px 0 12px; }
  .dock { left: 18px; right: 18px; bottom: 14px; } .now { flex-wrap: wrap; gap: 8px 14px; } .now b { font-size: 19px; } .now .sp { margin-left: 0; gap: 16px; } .side { bottom: 150px; }
}

<script type="module">

const D = await (await fetch('data.json')).json();

{

const mains = R.map((r, i) => i).filter(i => R[i].main);

const STUDIO = `
  uniform vec3 uBg;
  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

    : (c => `<button data-k="${x.k}" style="--c:${CSS[GI[c[2]]]}"><i></i><span>${hhmm(c[0])}</span><span>${esc(D.tools[c[3]])}${D.labels[c[4]] ? ' · ' + esc(D.labels[c[4]]) : ''}</span><span>${c[1] < 0 ? '' : dur(c[1])}</span></button>`)(r.calls[x.k])).join('');
}
function setCur(k, jump) {
  cur = k; const r = R[sel];
  for (const b of $('calls').children) b.classList.toggle('cur', b.dataset.k !== undefined && +b.dataset.k === k);
  $('spos').textContent = k >= 0 ? `Call ${k + 1} of ${r.calls.length}` : `${r.calls.length} calls. Use the arrows to step.`;
  if (k >= 0) { const b = $('calls').querySelector(`[data-k="${k}"]`); b && b.scrollIntoView({ block: 'nearest' }); if (jump) { zGoal = Z(r.calls[k][0]); setPlay(false); } }
  history.replaceState(null, '', '#ribbon-' + sel + (k >= 0 ? '/call-' + k : ''));
}
function step(d) {
  if (sel < 0) return; const r = R[sel]; if (!r.calls.length) return;
  let k = cur; if (k < 0) { const t = T(zNow); k = r.calls.findIndex(c => c[0] >= t); if (k < 0) k = r.calls.length; if (d > 0) k--; }
  setCur(Math.max(0, Math.min(r.calls.length - 1, k + d)), true);
}
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1); $('close').onclick = () => select(-1);
$('calls').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k !== undefined) setCur(+b.dataset.k, true); else { zGoal = Z(+b.dataset.t); setPlay(false); } };
$('play').onclick = () => { if (!playing && zGoal > ZEND - 1) zGoal = zNow = 0; setPlay(!playing); };
$('busy').onclick = () => { zGoal = (peakBin + .5) / NB * ZEND; };
$('start').onclick = () => { zGoal = 0; };
$('view').onclick = () => { outGoal = 1 - outGoal; $('view').setAttribute('aria-pressed', !outGoal); document.body.classList.toggle('inside', !outGoal); };
addEventListener('keydown', e => {
  if (e.key === 'Escape') select(-1); else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  else if (e.key === 'ArrowRight') { sel >= 0 ? step(1) : (zGoal += 60); } else if (e.key === 'ArrowLeft') { sel >= 0 ? step(-1) : (zGoal -= 60); }
});

/* ---------- picking: the bead or flare under the pointer ---------- */
function lower(z) { let lo = 0, hi = beads.length; while (lo < hi) { const m = (lo + hi) >> 1; if (beads[m].z < z) lo = m + 1; else hi = m; } return lo; }
function pick(mx, my) {
  const w = innerWidth, h = innerHeight; let best = null, bd = 1e9;
  const test = (o, x, y, z, radPx) => { v3.set(x, y, z).applyMatrix4(world.matrixWorld).project(camera); if (v3.z > 1 || v3.z < -1) return;
    const dx = (v3.x * .5 + .5) * w - mx, dy = (-v3.y * .5 + .5) * h - my, dd = Math.hypot(dx, dy) - radPx; if (dd < bd) { bd = dd; best = o; } };
  const zc = camera.position.z, from = lower(outside > .5 ? zNow - 160 : zc), to = lower((outside > .5 ? zNow : zc) + 420);
  for (let j = from; j < to; j++) { const b = beads[j]; if (sel >= 0 && b.r !== sel && R[b.r].root !== R[sel].root) continue; if (U.uCat.value >= 0 && GI[R[b.r].calls[b.k][2]] !== U.uCat.value) continue;
    test(b, b.x, b.y, b.z, Math.min(14, b.rad / (U.uPx.value * Math.max(1, Math.abs(b.z - zc))))); }
  for (const p of posts) if (Math.abs(p.z - zNow) < 420) test(p, p.x, p.y, p.z, 6);
  return bd < 9 ? best : null;
}
const tip = $('tip');
function showTip(o, mx, my) {
  if (!o) { tip.classList.remove('on'); canvas.classList.remove('hit'); return; }
  canvas.classList.add('hit');
  if (o.it) tip.innerHTML = `<b>Board ${esc(o.it.kind)}</b> <span>${esc(o.it.id)} · ${esc(o.it.who)} · ${clock(o.t)}</span><br>${esc(o.it.text.slice(0, 220))}${o.it.text.length > 220 ? '…' : ''}`;
  else { const r = R[o.r], c = r.calls[o.k]; tip.innerHTML = `<b>${esc(D.tools[c[3]])}</b>${D.labels[c[4]] ? ' ' + esc(D.labels[c[4]]) : ''}<br><span>${CATNAME[D.cats[c[2]]]} · ${clock(c[0])}<br>ran ${dur(c[1])} · returned ${chars(c[5])}<br>${r.main ? 'session' : 'subagent'}: ${esc(r.title || r.sid.slice(0, 8))}</span>`; }
  tip.style.left = Math.min(mx + 16, innerWidth - 330) + 'px'; tip.style.top = Math.min(my + 14, innerHeight - 130) + 'px'; tip.classList.add('on');
}
let drag = null, hover = null;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, moved: 0 }; canvas.classList.add('drag'); });
canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
  lean.x = (e.clientX / innerWidth - .5) * 2; lean.y = (e.clientY / innerHeight - .5) * 2;
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    if (drag.moved > 6) { rollGoal += dx * .006; zGoal += dy * .45; if (Math.abs(dy) > 2) setPlay(false); } }
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('drag'); const wasClick = drag && drag.moved <= 6; drag = null; if (!wasClick) return;
  const o = pick(e.clientX, e.clientY);
  if (!o) { if (sel >= 0) select(-1); return; }
  if (o.it) { select(o.r); zGoal = o.z; setPlay(false); } else select(o.r, o.k, true);
});
canvas.addEventListener('pointerleave', () => { mouse.on = false; showTip(null); });
canvas.addEventListener('wheel', e => { e.preventDefault(); zGoal += (Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX) * .12; }, { passive: false });
let tlDrag = false;
const tlSeek = e => { const b = tl.getBoundingClientRect(); zGoal = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)) * ZEND; };
tl.addEventListener('pointerdown', e => { tl.setPointerCapture(e.pointerId); tlDrag = true; tlSeek(e); });
tl.addEventListener('pointermove', e => { if (tlDrag) tlSeek(e); });
tl.addEventListener('pointerup', () => { tlDrag = false; });

/* names of the sessions, upright beside their ribbons at the present ring */
const tags = mains.map(i => { const d = document.createElement('div'); d.className = 'tag'; $('tags').appendChild(d); return d; });
const ringEl = $('ring');
function toScreen(x, y, z) { v3.set(x, y, z).applyMatrix4(world.matrixWorld).project(camera); return [(v3.x * .5 + .5) * innerWidth, (-v3.y * .5 + .5) * innerHeight, v3.z]; }

/* ---------- frame ---------- */
let last = performance.now(), lastHash = '', frame = 0;
const q = new URLSearchParams(location.search), still = q.has('still');
if (q.has('t')) zNow = zGoal = Z(+q.get('t')); if (q.has('in')) { outGoal = outside = 0; $('view').setAttribute('aria-pressed', true); document.body.classList.add('inside'); } if (q.has('pause')) setPlay(false);
const h = location.hash.match(/^#ribbon-(\d+)(?:\/call-(\d+))?/);
function tick(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; frame++;
  if (playing) { zGoal += speed * dt; if (zGoal >= ZEND) { zGoal = ZEND; setPlay(false); } }
  zGoal = Math.max(0, Math.min(ZEND, zGoal));
  const k = 1 - Math.exp(-dt * 7);
  zNow += (zGoal - zNow) * k; roll += (rollGoal - roll) * k; outside = outGoal;
  world.rotation.z = roll; world.updateMatrixWorld();
  U.uNow.value = zNow; U.uTime.value = now / 1000; nowRing.position.z = zNow;
  // camera: inside the tunnel just behind the present ring; outside, beside it; with a selection, close to that ribbon
  const o = outside;
  if (sel >= 0) pos(sel, zNow, foc).applyMatrix4(world.matrixWorld); else foc.set(0, 0, zNow);
  if (o > .5) {  // beside the tunnel: the future runs into the distance on the left. With a selection, closer and centred on that ribbon
    const d = sel >= 0 ? .45 : 1;
    tp.set(foc.x + (42 + lean.x * 5) * d, foc.y + (23 - lean.y * 6) * d, zNow - 48 * d);
    tlk.set(foc.x, foc.y - 1.5 * d, zNow + 16 * d);
  } else if (sel >= 0) {  // inside, beside the chosen ribbon on the side of the axis, looking along it
    const rr = Math.hypot(foc.x, foc.y) || 1, ux = foc.x / rr, uy = foc.y / rr;
    tp.set(foc.x - ux * 4.2 + lean.x, foc.y - uy * 4.2 + .9 - lean.y, zNow - 8);
    pos(sel, zNow + 13, v3).applyMatrix4(world.matrixWorld); tlk.set(v3.x, v3.y, zNow + 13);
  } else { tp.set(lean.x * 2.4, 1.2 - lean.y * 1.8, zNow - 16); tlk.set(lean.x * 1.2, -lean.y * .8, zNow + 55); }
  const kc = still || frame < 3 ? 1 : 1 - Math.exp(-dt * 3.2); camP.lerp(tp, kc); camL.lerp(tlk, kc);
  setShift(dt); camera.position.copy(camP); camera.lookAt(camL); camera.updateMatrixWorld();
  composer.render();

  // overlays
  const t = T(zNow); let active = 0, alive = 0; const act = new Map();
  for (const r of R) { const s = stateAt(r, t); if (s < 0) continue; alive++; if (s !== C_IDLE) { active++; act.set(r.root, (act.get(r.root) || 0) + (r.main ? 0 : 1)); } }
  const ct = clock(t), at = `${active} of ${alive} open transcripts are active at the ring`;
  if ($('clock').textContent !== ct) $('clock').textContent = ct; if ($('active').textContent !== at) $('active').textContent = at;
  const tg = [];
  mains.forEach((i, j) => { const r = R[i], d = tags[j], on = t >= r.t0 - 1 && t <= r.t1 + 1 && (sel < 0 || R[sel].root === i);
    const [x2, y2, z] = toScreen(r.x, r.y, zNow);
    d.style.opacity = on && z < 1 ? 1 : 0; if (on) tg.push({ d, x: x2, y: y2 });
    const n = act.get(i) || 0, txt = `<b>${esc(r.title || 'Session ' + r.sid.slice(0, 8))}</b>${n ? ' · ' + n + ' subagent' + (n > 1 ? 's' : '') + ' active' : ''}`; if (d.dataset.t !== txt) { d.dataset.t = txt; d.innerHTML = txt; } });
  tg.sort((a, b) => a.y - b.y); const y0 = tg.reduce((a, g) => a + g.y, 0) / (tg.length || 1) + 46 - (tg.length - 1) * 9;  // names in a column under the ring's centre, in the order of their ribbons
  tg.forEach((g, j) => { g.d.style.left = Math.max(120, Math.min(innerWidth - 120, g.x + 30)) + 'px'; g.d.style.top = Math.max(20, Math.min(innerHeight - 130, y0 + j * 18)) + 'px'; });
  if (sel >= 0 && cur >= 0) { const b = beads[R[sel].bead[cur]], [x, y, z] = toScreen(b.x, b.y, b.z); ringEl.style.opacity = z < 1 && Math.abs(b.z - zNow) < 60 ? 1 : 0; ringEl.style.left = x + 'px'; ringEl.style.top = y + 'px'; } else ringEl.style.opacity = 0;
  if (sel >= 0 && cur < 0 && frame % 6 === 0) { const r = R[sel]; let kk = -1; for (let q = 0; q < r.calls.length && r.calls[q][0] <= t; q++) kk = q;
    for (const b of $('calls').children) b.classList.toggle('cur', b.dataset.k !== undefined && +b.dataset.k === kk); }
  if (mouse.on && !drag && frame % 2 === 0) { hover = pick(mouse.x, mouse.y); showTip(hover, mouse.x, mouse.y); }
  drawTimeline();
  requestAnimationFrame(tick);
}
resize();
if (h && R[+h[1]]) select(+h[1], h[2] !== undefined ? +h[2] : undefined, true);
requestAnimationFrame(tick);
</script>
