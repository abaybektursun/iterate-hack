<style>

  color-scheme: dark;

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const D = await (await fetch("data.json")).json();

/* ---------- time ---------- */
const PST = -8 * 3600;  // the hackathon is in San Francisco; every stored time is UTC
const allT = [...D.ev.map(e => e[0]), ...D.commits.map(c => c.t), ...D.items.map(i => i.t), ...D.msgs.map(m => m.t)];
const T0 = Math.floor(allT.reduce((a, b) => Math.min(a, b)) / 3600) * 3600;

let HEND = hr(allT.reduce((a, b) => Math.max(a, b)));   // the newest event, in hours since T0
const HGEO = HEND + .08;                                 // the coil is built to here
const DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const two = n => String(n).padStart(2, "0");

const day = t => DAY[new Date((t + PST) * 1000).getUTCDay()];
const when = t => `${day(t)} ${clock(t)}`;
const dur = s => s < 90 ? `${Math.round(s)} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ---------- colour: the site's person hues by sorted name, at low chroma ---------- */
const HUES = [325, 150, 65, 195, 105, 45, 175, 350];
const sorted = [...D.people].sort();
const hue = p => HUES[sorted.indexOf(D.people[p]) % HUES.length];
function oklch(L, C, h) {  // -> linear sRGB
  const a = C * Math.cos(h * Math.PI / 180), b = C * Math.sin(h * Math.PI / 180);
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.291485548 * b) ** 3;

}
const LIGHT = D.people.map((_, p) => oklch(.7, .065, hue(p)));  // muted: the hue names the person, the value does the work
const css = p => `oklch(.76 .065 ${hue(p)})`;

/* ---------- layout: one band per person, one lane per concurrent agent session ---------- */
const PITCH = 8.5, LANE = .5, GAP = 1.5, RIN = 5.2;
const order = D.people.map((_, p) => p).sort((a, b) => D.sessions.filter(s => s.p === a).length - D.sessions.filter(s => s.p === b).length);
const bands = [];
{ let r = RIN;
  for (const p of order) {
    const ends = [];  // greedy: a session takes the lowest lane that is free when it starts
    for (const s of D.sessions.filter(s => s.p === p).sort((a, b) => a.a - b.a)) {
      let k = ends.findIndex(e => e + 600 < s.a); if (k < 0) k = ends.length;
      ends[k] = s.b; s.lane = k;
    }
    bands[p] = { r0: r, r1: r + Math.max(1, ends.length) * LANE, lanes: ends.length };
    for (const s of D.sessions) if (s.p === p) s.r = r + (s.lane + .5) * LANE;
    r = bands[p].r1 + GAP;
  }
}
const ROUT = Math.max(...bands.map(b => b.r1)), RS0 = ROUT + 1.6, RS1 = RS0 + 7;  // the score comb: RS0 is 0 %, RS1 is 100 %
const radius = (p, s) => s >= 0 && D.sessions[s] ? D.sessions[s].r : bands[p].r0 - .4;  // no session: the rail inside the band
const HC = HGEO / 2;
const P = (h, r, lift = 0, out = new THREE.Vector3()) => { const a = h * 2 * Math.PI; return out.set((h - HC) * PITCH + lift, r * Math.cos(a), r * Math.sin(a)); };

/* ---------- records -> marks ---------- */
const KIND = { work: "Work", result: "Result", idea: "Idea", knowledge: "Note", skill: "Skill" };
const byId = new Map(D.items.map(i => [i.id, i]));
const sessionOf = new Map(D.sessions.map((s, i) => [s.id, i]));
const turnaround = (from, to) => D.items.filter(i => i.k === "work" && i.c != null && i.c > from && i.c <= to).map(i => (i.c - i.t) / 60);  // tools/cycle.py: claim to close

/* ---------- renderer: a table-top instrument in a studio. One key light with a shadow, a soft fill, a rim ---------- */
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
let PR = Math.min(devicePixelRatio, 2); renderer.setPixelRatio(PR);
const BG = 0x171614;
renderer.setClearColor(BG, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.04;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;  // redrawn only when the play head or a layer changes
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(BG, 520, 1500);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(23, 1, 4, 3000);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: .055, rotateSpeed: .5, zoomSpeed: .7, panSpeed: .7, minDistance: 8, maxDistance: 900, screenSpacePanning: true, maxPolarAngle: 1.5 });

let dirty = 2, shadowDirty = true;  // a frame is drawn only when something changed
renderer.domElement.addEventListener("webglcontextlost", e => { e.preventDefault(); $("status").textContent = "The graphics context was lost. Waiting for the browser to restore it."; });
renderer.domElement.addEventListener("webglcontextrestored", () => { $("status").textContent = ""; dirty = 2; shadowDirty = true; });
const U = { uNow: { value: 0 }, uTau: { value: .05 }, uSolo: { value: -1 }, uPx: { value: 1000 } };
const FLOOR = -(RS1 + 5.5), LEN = HGEO * PITCH;
{ const key = new THREE.DirectionalLight(0xfff1dc, 2.6); key.position.set(-110, 230, 150); key.castShadow = true;
  const c = key.shadow.camera, half = LEN / 2 + 60; Object.assign(c, { left: -half, right: half, top: 90, bottom: -90, near: 20, far: 620 });
  key.shadow.mapSize.set(2048, 1024); key.shadow.bias = -.0012; key.shadow.normalBias = .5;
  const rim = new THREE.DirectionalLight(0xc9d6e6, .9); rim.position.set(160, 70, -220);
  scene.add(key, rim, new THREE.HemisphereLight(0xe9e2d6, 0x2a2622, .32)); }

/* procedural grain: fine noise with short brushed streaks, for bump and roughness */
function grain(streak) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 65536; i++) { const v = 128 + (rnd() - .5) * 70; im.data.set([v, v, v, 255], i * 4); }
  g.putImageData(im, 0, 0);
  for (let i = 0; i < streak; i++) { g.globalAlpha = .05 + rnd() * .12; g.fillStyle = rnd() > .5 ? "#fff" : "#000"; g.fillRect(rnd() * 256, rnd() * 256, 20 + rnd() * 160, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const GRAIN = grain(0), BRUSH = grain(2600), TABLE = grain(400); TABLE.repeat.set(220, 220);

/* a material whose parts exist only behind the play head. cut: fragments after it are not drawn. pop: an instance grows in as it passes */
function timed(mat, mode) {
  const patch = depth => sh => {
    Object.assign(sh.uniforms, { uNow: U.uNow, uTau: U.uTau, uSolo: U.uSolo, uPx: U.uPx });
    sh.vertexShader = "attribute float aT, aP; uniform float uNow, uTau, uSolo, uPx; varying float vT, vS;\n" + sh.vertexShader.replace("#include <begin_vertex>", `#include <begin_vertex>
  vT = aT; vS = (uSolo < 0. || abs(aP - uSolo) < .5 || aP < -.5) ? 1. : 0.;
  ${mode !== "cut" ? "float k = clamp((uNow - aT) / uTau, 0., 1.) - 1.; k = 1. + 2.3 * k * k * k + 1.3 * k * k; transformed *= k * vS;" : ""}
  ${mode === "far" ? "transformed *= max(1., 2.6 * length((modelViewMatrix * instanceMatrix * vec4(0., 0., 0., 1.)).xyz) / (uPx * .46));" : ""}`);
    sh.fragmentShader = "uniform float uNow; varying float vT, vS;\n" + (depth
      ? sh.fragmentShader.replace("void main() {", `void main() {\n  ${mode === "cut" ? "if (vT > uNow) discard;" : ""}`)
      : sh.fragmentShader.replace("#include <color_fragment>", `#include <color_fragment>\n  ${mode === "cut" ? "if (vT > uNow) discard; diffuseColor.rgb *= mix(.3, 1., vS);" : ""}`));
  };

  const d = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: mat.side }); d.onBeforeCompile = patch(true); d.customProgramCacheKey = () => mode + "d";
  mat.userData.depth = d; return mat;
}
const std = (o, mode = "pop") => timed(new THREE.MeshStandardMaterial(o), mode);
const MAT = {
  brass: std({ color: 0xc79a4c, metalness: 1, roughness: .34, envMapIntensity: 1.5 }, "far"),  // a result: never under 2.6 px on screen
  steel: std({ color: 0xb4b6b8, metalness: 1, roughness: .36, roughnessMap: BRUSH }),
  bone: std({ color: 0xe9e2d4, metalness: 0, roughness: .42 }),
  graphite: std({ color: 0x34322f, metalness: .25, roughness: .55 }),
  blued: std({ color: 0x3a4e73, metalness: 1, roughness: .3 }),
  tint: std({ color: 0xffffff, metalness: 0, roughness: .6 }),   // takes the instance colour
  wire: std({ color: 0xffffff, metalness: .9, roughness: .38, vertexColors: true }, "cut"),
  flight: std({ color: 0xffffff, vertexColors: true, metalness: .55, roughness: .62, roughnessMap: GRAIN, bumpMap: GRAIN, bumpScale: .35, envMapIntensity: .9, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1.5, polygonOffsetUnits: 2 }, "cut"),
  flightLite: timed(new THREE.MeshPhongMaterial({ vertexColors: true, specular: 0x2c2a27, shininess: 22, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1.5, polygonOffsetUnits: 2 }), "cut"),
  shaft: std({ color: 0xb9b6ae, metalness: 1, roughness: .62, roughnessMap: BRUSH, envMapIntensity: 1.5 }, "cut"),
};
const BONE = [.80, .76, .68], ANOD = [.028, .027, .026], WORN = [.3, .27, .225], INK = [.62, .59, .53], OXIDE = [.5, .14, .08], WIRE = [.72, .72, .72];

/* the lens: still film grain and a restrained vignette, one quad drawn last */
{ const lens = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ transparent: true, depthTest: false, depthWrite: false,
    vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }",
    fragmentShader: `varying vec2 vUv; float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() { float n = h(floor(gl_FragCoord.xy)), v = .34 * smoothstep(.38, .95, length(vUv - .5)); float a = .04 + v; gl_FragColor = vec4(vec3(n * .04 / a), a); }` }));
  lens.frustumCulled = false; lens.renderOrder = 99; scene.add(lens); }

/* ink on the surfaces: unlit hairlines and dots */

const M = new THREE.Matrix4();

  M.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); const e = M.elements, w = innerWidth / 2, h = innerHeight / 2;
  let best = null, score = 1e9;
  for (const p of picks) {
    if (S.off.has(p.layer)) continue;
    const q = p.pos, cw = e[3] * q.x + e[7] * q.y + e[11] * q.z + e[15]; if (cw <= 0) continue;
    const dx = (e[0] * q.x + e[4] * q.y + e[8] * q.z + e[12]) / cw * w + w - x, dy = h - (e[1] * q.x + e[5] * q.y + e[9] * q.z + e[13]) / cw * h - y;
    const d = Math.hypot(dx, dy), reach = p.prio ? 15 : 6; if (d > reach) continue;
    const solo = U.uSolo.value; if (solo >= 0 && (p.kind === "cmd" ? p.rec[1] : p.rec.p) !== solo) continue;
    const sc = d - p.prio * 2.2 + cw * .004; if (sc < score) { score = sc; best = p; }
  }

  const add = (p, t) => { const b = Math.floor(hr(t) * 12); if (b >= 0 && b < n) bins[p][b]++; };
  D.ev.forEach(e => add(e[1], e[0])); D.commits.forEach(c => add(c.p, c.t)); D.items.forEach(i => add(i.p, i.t)); D.msgs.forEach(m => add(m.p, m.t));

/* Two fixed drawings of the same strip, one for the hours behind the play head and a dim one for those ahead. A frame moves only the cut
   between them and the head, so the 2D canvas is not redrawn while the picture plays. */
let stripKey = "", stripW = 0, stripNow = -1;
function drawStrip(force) {
  const W = hist.clientWidth, H = hist.clientHeight, dpr = Math.min(devicePixelRatio, 2);
  const key = [W, H, HEND, U.uSolo.value, D.items.length].join();
  if (key !== stripKey || force) { stripKey = key; stripW = W; stripNow = -1;
    for (const [cv, past] of [[hist, false], [lit, true]]) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); const hc = cv.getContext("2d"); hc.setTransform(dpr, 0, 0, dpr, 0, 0); hc.clearRect(0, 0, W, H);
      const x = h => h / HEND * W, base = H - 17, top = 22, n = bins[0].length;
      let max = 1; for (let b = 0; b < n; b++) max = Math.max(max, bins.reduce((s, a) => s + a[b], 0));
      const bw = W / (HEND * 12);
      for (let b = 0; b < n; b++) { let y = base;
        for (const p of order) { const hgt = bins[p][b] / max * (base - top); if (!hgt) continue;
          hc.fillStyle = css(p); hc.globalAlpha = (past ? .95 : .3) * (U.uSolo.value < 0 || U.uSolo.value === p ? 1 : .15); hc.fillRect(b * bw + .5, y - hgt, Math.max(1, bw - 1), hgt); y -= hgt; } }
      hc.globalAlpha = 1; hc.font = "500 10.5px Archivo, sans-serif"; hc.textBaseline = "alphabetic";
      for (let h = 0; h <= HEND; h++) { const t = T0 + h * 3600, hd = new Date((t + PST) * 1000).getUTCHours(); hc.fillStyle = "#2c2925"; hc.fillRect(x(h), base, 1, hd % 6 ? 3 : 6);
        if (hd % (W < 700 ? 6 : 2) === 0 && x(h) < W - 30) { hc.fillStyle = hd % 6 ? "#8f887b" : "#cfc7b8"; hc.fillText(hd === 0 ? `${day(t)} 00:00` : `${two(hd)}:00`, x(h) + 3, H - 3); } }
      hc.fillStyle = "#2c2925"; hc.fillRect(0, base, W, 1);
      for (const i of D.items) if (i.k === "result") { hc.fillStyle = past ? "#c8a765" : "#4a443a"; hc.fillRect(x(hr(i.t)) - .5, top - 9, 1.2, 5); }  // one tick per result
      for (const b of blocks) { const x0 = x(Math.max(0, hr(b.a))), x1 = x(Math.min(HEND, hr(b.b))); hc.fillStyle = "#3a352f"; hc.fillRect(x0, 0, 1, 9);
        const text = `claim to result ${Math.round(b.m)} min`; if (b.n && x1 - x0 > hc.measureText(text).width + 12) { hc.fillStyle = "#8f887b"; hc.fillText(text, x0 + 5, 9); } } } }
  if (S.now !== stripNow) { stripNow = S.now; const px = S.now / HEND * stripW; lit.style.clipPath = `inset(0 ${(stripW - px).toFixed(1)}px 0 0)`; head.style.transform = `translateX(${px.toFixed(1)}px)`; }
}
{ let drag = false; const at = e => { const r = hist.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * HEND); S.live = false; };

/* ---------- live: new board items, messages and scores from /data ---------- */
const known = { items: new Set(D.items.map(i => i.id)), msgs: new Set(D.msgs.map(m => Math.round(m.t * 10))), scores: new Set(D.scores.map(s => s.result + s.right + s.n + s.config)) };
let fresh = 0;
async function read() {
  try {

    const pid = w => { let p = D.people.indexOf(w); return p; };
    for (const i of d.items) { const p = pid(i.who); if (p < 0) continue; const old = byId.get(i.id);
      if (old) { if (i.closed_at && old.c == null) { old.c = Date.parse(i.closed_at) / 1000; n++; } continue; }
      const rec = { id: i.id, k: i.kind, p, s: sessionOf.get((i.session || "").slice(0, 8)) ?? -1, t: i.at_ns / 1e9, c: i.closed_at ? Date.parse(i.closed_at) / 1000 : null, text: i.text, title: d.plain?.[i.id]?.title ?? "", branch: i.branch ?? "", ups: i.ups ?? 0, downs: i.downs ?? 0, nc: i.n_comments ?? 0 };
      D.items.push(rec); byId.set(i.id, rec); known.items.add(i.id); n++; }
    for (const m of d.messages) { const t = +m.sk.split("#")[0] / 1e9, k = Math.round(t * 10), p = pid(m.who); if (p < 0 || known.msgs.has(k)) continue; known.msgs.add(k);
      D.msgs.push({ p, s: sessionOf.get((m.session || "").slice(0, 8)) ?? -1, t, text: m.text, branch: m.branch ?? "" }); n++; }
    for (const s of d.scores) { const k = s.result + s.right + s.n + s.config, p = pid(s.who); if (p < 0 || known.scores.has(k)) continue; known.scores.add(k);
      D.scores.push({ t: +s.sk.split("#")[0] / 1e9, result: s.result, model: s.model, bench: s.benchmark, right: s.right, n: s.n, config: s.config ?? "", tokens: s.tokens ?? null, p }); n++; }
