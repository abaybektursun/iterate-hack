<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inside the 7B model's head, literally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:opsz,wght@6..72,300..600&display=swap">
<style>
:root {
  color-scheme: dark;
  --paper: #12110f; --sheet: #1a1917; --ink: #ece7dc; --mute: #a8a295; --faint: #7d786d; --rule: #2b2925;
  --blue: #d2ac62; --red: #d0563d; --on-blue: #15130f;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--paper); overflow: hidden;
  font: 400 14px/1.45 "Archivo", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 3px; }
a { color: inherit; text-decoration-color: var(--faint); text-underline-offset: 3px; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#gl.drag { cursor: grabbing; }
.vig { position: fixed; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(18, 17, 15, .78) 0, rgba(18, 17, 15, 0) 34%), radial-gradient(110% 95% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .42) 100%); }
#grain { position: fixed; inset: 0; pointer-events: none; opacity: .055; mix-blend-mode: overlay; background-size: 160px 160px; }
.kick a { color: var(--faint); text-decoration: none; font-weight: 500; margin-right: 10px; padding-right: 10px; border-right: 1px solid var(--rule); }
.kick a:hover { color: var(--ink); }

/* The words: a flat column on the left. */
.left { position: fixed; left: 34px; top: 26px; bottom: 24px; width: min(640px, calc(100vw - 68px)); display: flex; flex-direction: column; pointer-events: none; }
.left > * { pointer-events: auto; }
.lead { width: min(410px, 100%); }
.kick { font-weight: 600; font-size: 12.5px; color: var(--mute); letter-spacing: .01em; }
.kick b { color: var(--ink); font-weight: 650; }
h1 { margin: 12px 0 0; font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 27px; line-height: 1.22; letter-spacing: -.012em; min-height: 4.9em; font-variant-numeric: lining-nums; }
h1 em { font-style: normal; font-weight: 500; color: #fbf6ea; }
h1 em.r { color: var(--red); }
.src { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--faint); line-height: 1.4; }
.src a { color: var(--mute); }

/* Layer rail */
.rail { flex: 1; min-height: 0; margin: 20px 0 22px; width: 150px; display: flex; flex-direction: column; max-height: 380px; }
.left > .spacer { flex: 1; pointer-events: none; }
.rail .t { font-size: 11.5px; font-weight: 600; color: var(--mute); margin-bottom: 6px; }
.rail .rows { flex: 1; display: flex; flex-direction: column; cursor: pointer; touch-action: none; }
.rail .row { flex: 1; display: flex; align-items: center; gap: 7px; min-height: 0; }
.rail .row i { display: block; max-width: 84px; height: 2px; background: #5d594f; border-radius: 1px; transition: background .2s; min-height: 2px; }
.rail .row span { font-size: 9.5px; color: var(--faint); width: 14px; text-align: right; line-height: 1; opacity: 0; }
.rail .row:nth-child(8n+1) span, .rail .row:last-child span, .rail .row.on span { opacity: 1; }
.rail .row.on i { background: var(--blue); height: 3px; }
.rail .row.on span { color: var(--blue); }
.rail .row:hover i { background: #d8d2c4; }

/* The dial: measured cells only. */
.dial { width: 100%; }
.dial .t { font-size: 11.5px; font-weight: 600; color: var(--mute); margin-bottom: 7px; display: flex; justify-content: space-between; gap: 12px; }
.dial .t span { color: var(--faint); font-weight: 400; }
.cells { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--rule); }
.cell { padding: 9px 10px 8px 0; border-top: 2px solid transparent; margin-top: -1px; position: relative; }
.cell .n { font-size: 11.5px; color: var(--mute); font-weight: 550; }
.cell .v { font-family: "Newsreader", Georgia, serif; font-variant-numeric: lining-nums tabular-nums; font-size: 30px; font-weight: 300; line-height: 1.08; margin-top: 1px; color: #a8a295; }
.cell .c { font-size: 11px; color: var(--faint); margin-top: 1px; }
.cell .c b { color: var(--red); font-weight: 500; }
.cell .bar { height: 2px; background: var(--rule); margin-top: 6px; position: relative; margin-right: 10px; }
.cell .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #8a8478; }
.cell .bar u { position: absolute; right: 0; top: 0; bottom: 0; background: var(--red); opacity: .8; }
.cell.on { border-top-color: var(--blue); }
.cell.on .v { color: #fbf6ea; }
.cell.on .n { color: var(--blue); }
.cell.on .bar i { background: var(--blue); }
.vars { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 9px; min-height: 24px; font-size: 12px; color: var(--faint); align-items: baseline; }
.vars .g { display: flex; gap: 2px; align-items: baseline; }
.vars .g > span { margin-right: 5px; }
.chip { padding: 2px 7px; border-radius: 20px; color: var(--mute); font-weight: 500; font-size: 12px; white-space: nowrap; }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--blue); color: var(--on-blue); font-weight: 600; }
.chip.on.red { background: var(--red); }
.neur { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--faint); align-items: baseline; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* Detail column on the right. */
.side { position: fixed; right: 34px; top: 26px; bottom: 24px; width: 318px; display: flex; flex-direction: column; pointer-events: none; }
.side > * { pointer-events: auto; }
.side.open::before { content: ''; position: fixed; right: 0; top: 0; bottom: 0; width: 440px; background: linear-gradient(90deg, rgba(18, 17, 15, 0), rgba(18, 17, 15, .93) 26%); z-index: -1; pointer-events: none; }
.status { text-align: right; font-size: 11.5px; color: var(--faint); }
.status i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); margin-right: 6px; vertical-align: 1px; }
.status i.beat { animation: beat .7s ease-out; }
.status.off i { background: var(--red); }
@keyframes beat { 0% { opacity: .3; } 100% { opacity: 1; } }
.panel.empty { margin-top: auto; flex: none; }
.panel { margin-top: 18px; overflow: auto; flex: 1; scrollbar-width: thin; scrollbar-color: #35322c transparent; padding-right: 4px; }
.panel .k { font-size: 11.5px; font-weight: 600; color: var(--blue); }
.panel h2 { margin: 3px 0 2px; font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 23px; line-height: 1.2; letter-spacing: -.01em; }
.panel .nm { font-size: 11px; color: var(--faint); word-break: break-all; }
.panel .q { margin: 10px 0 2px; font-family: "Newsreader", Georgia, serif; font-size: 18px; line-height: 1.34; font-weight: 300; color: var(--ink); }
.panel dl { margin: 11px 0 0; }
.panel dl > div { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 12.5px; }
.panel dt { color: var(--mute); }
.panel dd { margin: 0; text-align: right; color: var(--ink); font-weight: 500; }
.panel dd small { display: block; font-size: 11px; color: var(--faint); font-weight: 400; }
.panel .h { margin: 14px 0 5px; font-size: 11.5px; font-weight: 600; color: var(--mute); }
.panel p { margin: 6px 0; font-size: 12px; color: var(--mute); line-height: 1.45; }
.panel svg { display: block; width: 100%; height: auto; }
.tok { display: inline-block; padding: 0 5px; margin: 0 3px 3px 0; border: 1px solid var(--rule); border-radius: 3px; font-size: 11.5px; color: var(--ink); white-space: pre; line-height: 1.5; }
.tok.cue { border-color: var(--blue); color: var(--blue); font-weight: 600; }
.dir { font-size: 11px; color: var(--faint); margin: 7px 0 3px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
.tbl td, .tbl th { padding: 4px 0; border-top: 1px solid var(--rule); text-align: right; font-weight: 400; }
.tbl th { color: var(--faint); font-size: 11px; border-top: 0; }
.tbl td:first-child, .tbl th:first-child { text-align: left; color: var(--mute); }
.tbl tr.hi td { color: #fff; font-weight: 550; }
.tbl td.r { color: var(--red); }
.unit { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.unit i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #585348; }
.unit i.l { background: var(--red); border-color: var(--red); }
.close { float: right; color: var(--faint); font-size: 12px; padding: 2px 4px; }
.close:hover { color: var(--ink); }
.key div { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--mute); }
.key svg { width: 34px; height: 14px; flex: none; }
.hint { margin-top: 12px; font-size: 12px; color: var(--faint); line-height: 1.5; }

/* Labels drawn over the picture. */
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#labels span { position: absolute; transform: translate(-50%, -50%); font-size: 11px; color: var(--ink); white-space: nowrap; font-weight: 500; will-change: transform, opacity; }
#labels span.big { font-size: 12px; color: var(--ink); font-weight: 600; }
#labels span.ev { transform: translate(0, -50%); font-size: 12px; color: var(--ink); background: rgba(18, 17, 15, .82); padding: 3px 9px; border-left: 1px solid var(--blue); }
#labels span.ev b { color: var(--blue); font-weight: 600; white-space: pre; }
#tip { position: fixed; pointer-events: none; font-size: 12px; background: rgba(22, 21, 18, .95); border: 1px solid var(--rule); padding: 4px 8px; border-radius: 4px; display: none; white-space: nowrap; z-index: 5; }
#tip small { color: var(--faint); margin-left: 6px; }
.nav { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); display: flex; gap: 4px; }
.nav .chip { border: 1px solid var(--rule); background: rgba(18, 17, 15, .6); padding: 4px 12px; }
.nav .chip.on { background: var(--blue); border-color: var(--blue); }
#err { position: fixed; left: 8px; bottom: 4px; color: var(--red); font-size: 11px; white-space: pre-wrap; z-index: 9; max-width: 80vw; }

@media (max-height: 940px) { .rail { display: none; } }
@media (max-width: 1180px) {
  .rail { display: none; }
  .side { width: 280px; }
}
@media (max-width: 820px) {
  .left { left: 16px; top: 14px; bottom: 12px; width: calc(100vw - 32px); }
  h1 { font-size: 18px; min-height: 0; margin-top: 6px; }
  .src { display: none; }
  .cell .v { font-size: 20px; }
  .cell .c { font-size: 10px; }
  .side { left: 16px; right: 16px; width: auto; top: auto; bottom: 232px; max-height: 38vh; }
  .side .status { display: none; }
  .panel { background: rgba(18, 17, 15, .95); padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; margin: 0; }
  .panel.empty { display: none; }
  .nav { top: auto; bottom: 324px; left: auto; right: 16px; transform: none; }
  #dialnote { display: none; }
  .dial { background: linear-gradient(rgba(18, 17, 15, 0), rgba(18, 17, 15, .9) 14%); padding-top: 14px; }
  .side { bottom: 362px; max-height: 34vh; }
  .vig { background: none; } .side.open::before { display: none; }
}
</style>

<canvas id="gl"></canvas>
<div class="vig"></div><div id="grain"></div>
<div id="labels"></div>

<div class="left">
<div class="lead">
  <div class="kick"><a href="../../">Lab</a><b>Inside the 7B model</b> · what RL changed in the weights</div>

</div>

<div class="spacer"></div>

  <div class="cells" id="cells"></div>
  <div class="vars" id="vars"></div>
  <div class="neur" id="neur"></div>
</div>
</div>

<div class="nav"><button class="chip" id="bOver">Whole model</button><button class="chip" id="bPrev" aria-label="Previous layer">‹ Layer</button><button class="chip" id="bNext" aria-label="Next layer">Layer ›</button></div>

<div class="side">
  <div class="status" id="status"><i></i><span>Reading the board</span></div>
  <div class="panel empty" id="panel"></div>
</div>
<div id="tip"></div>
<div id="err"></div>

const canvas = $('gl');

{ const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'), im = g.createImageData(160, 160); let x = 9;
  for (let i = 0; i < im.data.length; i += 4) { x = (x * 1664525 + 1013904223) >>> 0; const v = x >>> 24; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }

let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); t.anisotropy = 8; return t; }

const col = h => new THREE.Color(h);
const C_GLASS = col('#838d90'), C_AMBER = col('#b88d48'), C_BRASS = col('#e2b55c'), C_BRASS_LO = col('#a8853f'), C_ETCH = col('#4b5052'), C_PATINA = col('#b0452f'), C_STEEL = col('#9a9da0');
