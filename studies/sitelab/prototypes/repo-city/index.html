    lines[f] = ln; lastC[f] = idx;
    if (w > bestW) { bestW = w; best = f; }
  }
  hmDirty = true;
  if (best >= 0) focus.set(aRect[best * 4], 0, aRect[best * 4 + 1]);
  if (!live) return;
  touched.sort((a, b) => b[0] - a[0]);
  touched.slice(0, 1).forEach(([w, f, add, del, h0, h1]) => beam(aRect[f * 4], aRect[f * 4 + 1], Math.min(2.2, Math.min(aRect[f * 4 + 2], aRect[f * 4 + 3]) * .3), Math.max(h0, h1), col));
  let budget = 70; const DUST = [.9, .78, .6], CHIP = [.62, .6, .56];
  for (const [w, f, add, del, h0, h1] of touched) { if (budget <= 0) break;
    const x = aRect[f * 4], z = aRect[f * 4 + 1], sw = aRect[f * 4 + 2], sd = aRect[f * 4 + 3];
    const nUp = add > 0 ? Math.min(budget, Math.round(1 + 1.6 * Math.log10(1 + add))) : 0; budget -= nUp;
    for (let i = 0; i < nUp; i++) spark(x + (Math.random() - .5) * sw, h1, z + (Math.random() - .5) * sd, (Math.random() - .5) * 3, 2 + Math.random() * 6, (Math.random() - .5) * 3, DUST);
    const nDn = Math.min(budget, Math.round(2.4 * Math.log10(1 + del))); budget -= nDn;       // removed floors: chips fall from the old roof line
    for (let i = 0; i < nDn; i++) { const s = Math.random() < .5 ? -1 : 1, ax = Math.random() < .5; spark(x + (ax ? s * sw * .52 : (Math.random() - .5) * sw), Math.max(h0, h1), z + (ax ? (Math.random() - .5) * sd : s * sd * .52), (ax ? s : 0) * 2.5, .5, (ax ? 0 : s) * 2.5, CHIP); }
  }
  $("ticker").innerHTML = `<i class="hue" style="--h:${HUES[c.a]}"></i><b>${D.people[c.a]}</b>${c.m >= 0 ? " with " + D.models[c.m] : ""} · ${c.h} · +${fmt(c.add)} −${fmt(c.del)} · ${esc(c.s)}`;
}
function seek(t, live) {
  t = Math.min(T1, Math.max(T0, t));
  if (t < T) { lines.fill(0); lastC.fill(-1); aH.fill(0); for (let i = 0; i < NF; i++) aH[i * 3 + 2] = -100; aTint.fill(0); ci = mi = standing = totalLines = 0; convoys = []; live = false; hmDirty = true; }
  let n = 0; while (ci + n < C.length && C[ci + n].t <= t) n++;
  if (n > 60) live = false;
  for (; ci < C.length && C[ci].t <= t; ci++) apply(C[ci], ci, live);
  for (; mi < M.length && M[mi].t <= t; mi++) if (live) convoy(M[mi]);
  T = t; iH.needsUpdate = iTint.needsUpdate = true;
  U.uNow.value = (T - T0) / 3600;
  $("when").textContent = when(T);
  $("s-files").textContent = fmt(standing); $("s-lines").textContent = fmt(totalLines); $("s-commits").textContent = fmt(ci); $("s-merges").textContent = fmt(mi);
}

// ---- scrubber: code and text lines added (up) and deleted (down) per hour -------------------------------------------
const sc = $("scrub"), sx = sc.getContext("2d");
function drawScrub() {
  const w = sc.clientWidth, h = sc.clientHeight, dpr = Math.min(devicePixelRatio, 2); if (sc.width !== w * dpr) { sc.width = w * dpr; sc.height = h * dpr; }
  sx.setTransform(dpr, 0, 0, dpr, 0, 0); sx.clearRect(0, 0, w, h);
  const hrs = D.hours, mx = Math.max(...hrs.map(x => x[0])), base = h - 17, top = base - 14, bw = w * 3600 / SPAN, p = (T - T0) / SPAN;
  hrs.forEach((x, i) => { const x0 = i * bw, part = Math.min(1, Math.max(0, (T - T0 - i * 3600) / 3600));
    const up = x[0] / mx * top, dn = Math.max(x[1] / mx * top, x[1] ? 1 : 0);
    sx.fillStyle = "rgba(235,230,220,.15)"; sx.fillRect(x0 + 1, base - up, bw - 2, up);
    sx.fillStyle = "rgba(235,230,220,.82)"; sx.fillRect(x0 + 1, base - up, (bw - 2) * part, up);
    sx.fillStyle = "rgba(192,106,85,.3)"; sx.fillRect(x0 + 1, base + 1, bw - 2, dn);
    sx.fillStyle = "rgba(192,106,85,.95)"; sx.fillRect(x0 + 1, base + 1, (bw - 2) * part, dn); });
  sx.fillStyle = "rgba(235,230,220,.2)"; sx.fillRect(0, base, w, 1);
  sx.fillStyle = "#e8b877"; sx.fillRect(p * w - .5, 0, 1, h - 12);
  sx.font = '500 10.5px Archivo, sans-serif'; sx.fillStyle = "#7b7469"; sx.textBaseline = "bottom";
  const d0 = new Date(T0 * 1000), first = new Date(d0); first.setMinutes(0, 0, 0); first.setHours(Math.ceil((d0.getHours() + 1) / 4) * 4);
  for (let t = first.getTime() / 1000; t < T1 - 1800; t += 4 * 3600) { const dt = new Date(t * 1000), x = (t - T0) / SPAN * w;
    sx.textAlign = "center"; sx.fillText(dt.getHours() === 0 ? dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : String(dt.getHours()).padStart(2, "0") + ":00", x, h + 1); }
  sx.textAlign = "left"; sx.fillText("Code and text lines per hour: added above the line, deleted below", 2, 10);
}
let dragging = false;
const scrubTo = e => { const r = sc.getBoundingClientRect(); seek(T0 + SPAN * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), false); };
$("scrubwrap").addEventListener("pointerdown", e => { dragging = true; intro = false; e.currentTarget.setPointerCapture(e.pointerId); scrubTo(e); });
$("scrubwrap").addEventListener("pointermove", e => dragging && scrubTo(e));
$("scrubwrap").addEventListener("pointerup", () => dragging = false);
const setPlay = v => { playing = v; $("playicon").setAttribute("d", v ? "M2 1h3.5v12H2zM8.5 1H12v12H8.5z" : "M3 1l10 6-10 6z"); };
$("play").onclick = () => { intro = false; if (!playing && T >= T1 - 1) { seek(T0, false); crane = true; controls.autoRotate = false; } setPlay(!playing); };
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); $("play").click(); } if (e.key === "Escape") select(-1); });

// ---- camera: a slow crane during the replay, then the viewer's ------------------------------------------------------
let crane = true, craneR = 120; const tgt = new THREE.Vector3(), look = new THREE.Vector3(), want = new THREE.Vector3();
controls.addEventListener("start", () => { crane = false; controls.autoRotate = false; });
$("crane").onclick = () => { crane = true; controls.autoRotate = false; if (T >= T1 - 1) { seek(T0, false); setPlay(true); } };
function craneCam(dt) {
  const p = (T - T0) / SPAN, s = p * p * (3 - 2 * p);
  const az = -1.1 + p * 1.6, el = .22 + .2 * s;
  craneR += (Math.min(980, 105 + reach * 2.25) - craneR) * (1 - Math.exp(-dt * .5)); const R = craneR;      // far enough to hold every standing block in frame
  want.copy(mass).lerp(focus, .2 * (1 - s)); want.z += 18 * s;
  tgt.lerp(want, 1 - Math.exp(-dt * .5));
  const dx = Math.sin(az), dz = Math.cos(az), Rh = R * Math.cos(el);
  look.set(tgt.x + Rh * dx, 10 + R * Math.sin(el), tgt.z + Rh * dz);
  for (let i = 0; i < NF; i++) { const h = aH[i * 3 + 1]; if (h < 16) continue;        // the arm rises until no block stands between the lens and its subject
    const px = aRect[i * 4] - tgt.x, pz = aRect[i * 4 + 1] - tgt.z, along = (px * dx + pz * dz) / Rh; if (along < .12 || along > 1.25) continue;
    const off = Math.abs(px * dz - pz * dx), half = Math.max(aRect[i * 4 + 2], aRect[i * 4 + 3]) * .75 + 34; if (off > half) continue;
    const soft = 1 - Math.pow(off / half, 2), need = Math.min(460, (h * 1.25 + 6) / Math.min(1, along) * soft); if (need > look.y) look.y = need; }
  camera.position.lerp(look, 1 - Math.exp(-dt * .9)); controls.target.lerp(tgt, 1 - Math.exp(-dt * 1.2)); camera.lookAt(controls.target);
}

// ---- post: a faint lens bloom on true highlights, tilt-shift focus, grain, vignette ---------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), .16, .35, 1.0));
const tilt = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uMax: { value: 9 }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uMax, uTime; varying vec2 vUv;
    void main(){ float r = uMax * smoothstep(.16, .62, abs(vUv.y - .46)); vec3 c = vec3(0.); float wsum = 0.;
      for (int i = 0; i < 28; i++) { float fi = float(i); float a = fi * 2.39996; float rr = sqrt((fi + .5) / 28.) * r; vec2 o = vec2(cos(a), sin(a)) * rr / uRes;
        vec3 s = texture2D(tDiffuse, vUv + o).rgb; float w = 1. + dot(s, vec3(1.2)); c += s * w; wsum += w; }
      c /= wsum;
      vec2 q = vUv - .5; c *= 1. - .5 * dot(q, q);
      float g = fract(sin(dot(floor(vUv * uRes) + floor(uTime * 24.) * 7.31, vec2(12.9898, 78.233))) * 43758.5453) - .5;
      c += g * (.012 + .03 * sqrt(max(c.g, 0.)));
      gl_FragColor = vec4(max(c, 0.), 1.); }` });
composer.addPass(tilt); composer.addPass(new OutputPass());
function resize() { const w = innerWidth, h = innerHeight, pr = Math.min(devicePixelRatio, 2); renderer.setPixelRatio(pr); renderer.setSize(w, h, false); composer.setPixelRatio(pr); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < h ? 50 : 30; camera.updateProjectionMatrix(); tilt.uniforms.uRes.value.set(w * pr, h * pr); tilt.uniforms.uMax.value = 6 * pr * h / 1000;
  sparks.material.uniforms.uPx.value = cars.material.uniforms.uPx.value = pr * h / 1000; drawScrub(); }
addEventListener("resize", resize);

// ---- hover, click ---------------------------------------------------------------------------------------------------
const dLab = document.createElement("div"); dLab.className = "lab"; dLab.style.opacity = 0; document.body.append(dLab);
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let hov = -1, hovD = -1, sel = -1, downAt = null;
function pick(cx, cy) {
  mouse.set(cx / innerWidth * 2 - 1, -cy / innerHeight * 2 + 1); ray.setFromCamera(mouse, camera); const o = ray.ray.origin, d = ray.ray.direction;
  let best = -1, bt = 1e9;
  for (let i = 0; i < NF; i++) { const h = aH[i * 3 + 1]; if (h < .02) continue; const cx0 = aRect[i * 4], cz0 = aRect[i * 4 + 1], hw = aRect[i * 4 + 2] / 2 + .25, hd = aRect[i * 4 + 3] / 2 + .25;
    let t0 = (cx0 - hw - o.x) / d.x, t1 = (cx0 + hw - o.x) / d.x; if (t0 > t1) [t0, t1] = [t1, t0];
    let a = (0 - o.y) / d.y, b = (h - o.y) / d.y; if (a > b) [a, b] = [b, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, b); if (t0 > t1) continue;
    a = (cz0 - hd - o.z) / d.z; b = (cz0 + hd - o.z) / d.z; if (a > b) [a, b] = [b, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    if (t0 <= t1 && t0 > 0 && t0 < bt) { bt = t0; best = i; } }
  let dist = -1; if (best >= 0) dist = F[best].d; else if (d.y < 0) { const t = -o.y / d.y, gx = o.x + d.x * t, gz = o.z + d.z * t; dist = DS.findIndex(q => gx >= q.r[0] && gx <= q.r[0] + q.r[2] && gz >= q.r[1] && gz <= q.r[1] + q.r[3]); }
  return [best, dist];
}
const tip = $("tip");
function showTip(i, cx, cy) {
  if (i < 0) { tip.classList.remove("on"); return; }
  const f = F[i], c = C[lastC[i]], cut = f.p.lastIndexOf("/");
  tip.innerHTML = `<div class="path">${esc(f.p.slice(0, cut + 1))}<b>${esc(f.p.slice(cut + 1))}</b></div>
    <div class="n"><b>${fmt(lines[i])}</b> lines at ${when(T).slice(-5)} · largest size ${f.b > 1e6 ? (f.b / 1e6).toFixed(1) + " MB" : f.b > 1e3 ? (f.b / 1e3).toFixed(1) + " kB" : f.b + " B"}</div>
    ${c ? `<div class="msg">${esc(c.s)}</div><div class="by hue" style="--h:${HUES[c.a]}"><i></i>${D.people[c.a]}${c.m >= 0 ? " with " + D.models[c.m] : ", no Co-Authored-By trailer"} · ${when(c.t)} · ${c.h}${c.b ? " · branch " + esc(c.b) : ""}</div>` : ""}`;
  tip.classList.add("on"); const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(innerWidth - r.width - 12, cx + 18) + "px"; tip.style.top = Math.max(12, Math.min(innerHeight - r.height - 12, cy - r.height - 14)) + "px";
}
canvas.addEventListener("pointermove", e => { if (e.buttons) { showTip(-1); return; } const [b, d] = pick(e.clientX, e.clientY); hov = b; hovD = d; U.uHover.value = b; canvas.style.cursor = b >= 0 || d >= 0 ? "pointer" : "grab"; showTip(b, e.clientX, e.clientY); });
canvas.addEventListener("pointerleave", () => { hov = hovD = -1; U.uHover.value = -1; showTip(-1); });
canvas.addEventListener("pointerdown", e => downAt = [e.clientX, e.clientY]);
canvas.addEventListener("pointerup", e => { if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; const [b, d] = pick(e.clientX, e.clientY);
  if (e.pointerType !== "mouse") { hov = b; U.uHover.value = b; showTip(b, e.clientX, e.clientY); } select(d === sel ? -1 : d); });
$("px").onclick = () => select(-1);
let board = null;
async function loadBoard() { try { board = await (await fetch("/data")).json(); if (sel >= 0) select(sel); } catch (e) { board = null; } }
loadBoard(); setInterval(loadBoard, 60000);
function select(i) {
  sel = i; U.uSel.value = i; $("panel").classList.toggle("on", i >= 0); if (i < 0) return;
  const d = DS[i]; let nf = 0, nl = 0; const cs = new Set(), by = D.people.map(() => 0);
  for (let f = 0; f < NF; f++) if (F[f].d === i && lines[f] > 0) { nf++; nl += lines[f]; }
  for (let k = 0; k < ci; k++) { const e = C[k].e; for (let j = 0; j < e.length; j += 4) if (F[e[j]].d === i) { if (!cs.has(k)) { cs.add(k); by[C[k].a]++; } break; } }
  $("p-name").textContent = d.name === "root" ? "Root files" : d.name;
  $("p-readme").textContent = d.readme || "This area has no README.md of its own.";
  const res = board && d.name !== "root" ? board.items.filter(it => it.kind === "result" && it.text.includes(d.name + "/")).sort((a, b) => b.at_ns - a.at_ns) : [];
  $("p-dl").innerHTML = `<dt>files standing at ${when(T).slice(-5)}</dt><dd>${fmt(nf)}</dd><dt>lines</dt><dd>${fmt(nl)}</dd><dt>commits that touched it</dt><dd>${fmt(cs.size)}</dd>` +
    D.people.map((p, k) => by[k] ? `<dt class="hue" style="--h:${HUES[k]};color:var(--c)">${p}</dt><dd>${by[k]}</dd>` : "").join("") +
    `<dt>results on the board that name it</dt><dd>${board ? (d.name === "root" ? "–" : res.length) : "board not reachable"}</dd>`;
  $("p-res").innerHTML = res.slice(0, 4).map(it => { const pl = board.plain && board.plain[it.id]; return `<li><b>${esc((pl && pl.title) || it.text.slice(0, 110))}</b><br>${esc(it.who)} · ${when(it.at_ns / 1e9)} · ${esc(it.id)}</li>`; }).join("");
}

// ---- loop -----------------------------------------------------------------------------------------------------------
// test hooks: ?t=0.6 stops the replay at 60%, ?step=0.1 fixes the time step, ?freeze=3 stops the clock there, ?cam=x,y,z, ?sel=<district>
const still = Q.has("t");
let intro = !still;                                                   // the page opens on the finished model, holds it, then replays from the first commit
if (still) seek(T0 + SPAN * Math.max(0, +Q.get("t") - .03), false); else { seek(T1, false); setPlay(false); }
if (Q.has("sel")) select(+Q.get("sel"));
resize(); bake();
craneCam(100); craneCam(100);
if (Q.has("cam")) { crane = false; camera.position.set(...Q.get("cam").split(",").map(Number)); controls.target.set(0, 0, 0); }
let last = performance.now();
function tick(nowMs) {
  let dt = Math.min(.05, Math.max(0, (nowMs - last) / 1000)); last = nowMs;
  if (Q.has("step")) dt = +Q.get("step"); if (Q.has("freeze") && U.uClock.value > +Q.get("freeze")) dt = 0;
  U.uClock.value += dt; tilt.uniforms.uTime.value = U.uClock.value;
  if (intro && U.uClock.value > 2.2) { intro = false; seek(T0, false); setPlay(true); }
  if (playing && !dragging) { const lim = still ? T0 + SPAN * Math.min(1, +Q.get("t")) : T1; seek(Math.min(lim, T + dt * SPAN / REPLAY_S), true); if (T >= T1) { setPlay(false); if (crane) controls.autoRotate = true; } }
  if (crane && (intro || !(T >= T1 && !playing))) craneCam(dt); else controls.update();
  if (hmDirty && U.uClock.value - hmAt > .12 || hmAt > U.uClock.value) bake();
  stepConvoys();
  const now = U.uClock.value;                                           // district outlines: quiet, lighter for a moment when a merge arrives
  DS.forEach((d, i) => { const k = Math.max(0, 1 - (now - pulse[i]) / 2.4), s = (sel === i ? .9 : hovD === i ? .6 : .34) + k * k * .9;
    for (let j = 0; j < 8; j++) plotCol.set([s * .86, s * .8, s * .68], i * 24 + j * 3);
    nameMat[i].opacity = sel < 0 || sel === i ? Math.min(1, .5 + k * .5 + (hovD === i ? .3 : 0)) : .15; });
  plotGeo.attributes.color.needsUpdate = true;
  const ld = sel >= 0 ? sel : hovD;                                     // one floating name, for the district under the pointer or selected
  if (ld >= 0) { const [x, y, w, h] = DS[ld].r, v = new THREE.Vector3(x + w / 2, 0, y + h).project(camera); dLab.textContent = DS[ld].name;
    dLab.style.opacity = v.z < 1 ? .9 : 0; dLab.style.transform = `translate(${(v.x * .5 + .5) * innerWidth}px, ${(-v.y * .5 + .5) * innerHeight + 8}px)`; } else dLab.style.opacity = 0;
  drawScrub();
  composer.render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
