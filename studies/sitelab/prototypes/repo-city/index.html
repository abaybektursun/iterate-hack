setInterval(() => sel >= 0 && playing && !document.hidden && select(sel), 1000);   // the open panel follows the replay
function select(i) {
  wake(); sel = i; U.uSel.value = i; $("panel").classList.toggle("on", i >= 0); if (i < 0) return;
  const d = DS[i]; let nf = 0, nl = 0; const cs = new Set(), by = D.people.map(() => 0);
  for (let f = 0; f < NF; f++) if (F[f].d === i && lines[f] > 0) { nf++; nl += lines[f]; }
  for (let k = 0; k < ci; k++) { const e = C[k].e; for (let j = 0; j < e.length; j += 4) if (F[e[j]].d === i) { if (!cs.has(k)) { cs.add(k); by[C[k].a]++; } break; } }
  $("p-name").textContent = d.name === "root" ? "Root files" : d.name;
  $("p-readme").textContent = d.readme || "This area has no README.md of its own.";
  const res = board && d.name !== "root" ? board.items.filter(it => it.kind === "result" && it.text.includes(d.name + "/")).sort((a, b) => b.at_ns - a.at_ns) : [];
  $("p-dl").innerHTML = `<dt>files standing at ${when(T).slice(-5)}</dt><dd>${fmt(nf)}</dd><dt>lines</dt><dd>${fmt(nl)}</dd><dt>commits that touched it</dt><dd>${fmt(cs.size)}</dd>` +
    D.people.map((p, k) => by[k] ? `<dt class="hue" style="--h:${HUES[k]};color:var(--c)">${p}</dt><dd>${by[k]}</dd>` : "").join("") +
    `<dt>results on the board that name it</dt><dd>${board ? (d.name === "root" ? "–" : res.length) : "no board data yet"}</dd>` +
    (boardErr ? `<dt style="grid-column:1/-1;color:var(--red)">${boardErr}${board ? "; showing the read of " + when(boardAt).slice(-5) : ""}</dt>` : "");
  $("p-res").innerHTML = res.slice(0, 4).map(it => { const pl = board.plain && board.plain[it.id]; return `<li><b>${esc((pl && pl.title) || it.text.slice(0, 110))}</b><br>${esc(it.who)} · ${when(it.at_ns / 1e9)} · ${esc(it.id)}</li>`; }).join("");
}

// ---- loop -----------------------------------------------------------------------------------------------------------
// test hooks: ?t=0.6 stops the replay at 60%, ?step=0.1 fixes the time step, ?freeze=3 stops the clock there, ?cam=x,y,z, ?sel=<district>
const still = Q.has("t");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;      // then: the finished model as one still frame, no replay unless Play is pressed
let intro = !still && !reduced;                                                   // the page opens on the finished model, holds it, then replays from the first commit
if (still) seek(T0 + SPAN * Math.max(0, +Q.get("t") - .03), false); else { seek(T1, false); setPlay(false); }
if (reduced && !still) controls.enableDamping = false;
if (Q.has("sel")) select(+Q.get("sel"));
resize(); bake();
craneCam(100); craneCam(100);
if (Q.has("cam")) { crane = false; camera.position.set(...Q.get("cam").split(",").map(Number)); controls.target.set(0, 0, 0); }
let last = performance.now(), rendered = 0;
function tick() {
  requestAnimationFrame(tick); const nowMs = performance.now();        // not the callback's timestamp: with frame pacing off it runs behind the wall clock
  if (document.hidden) { last = nowMs; return; }
  const raw = nowMs - last; if (raw < 2 && !Q.has("step")) return;      // never more than a few hundred frames a second, whatever the browser allows
  let dt = Math.min(.05, Math.max(0, raw / 1000)); last = nowMs;
  if (Q.has("step")) dt = +Q.get("step"); if (Q.has("freeze") && U.uClock.value > +Q.get("freeze")) dt = 0;
  U.uClock.value += dt; tilt.uniforms.uTime.value = U.uClock.value;
  const busy = playing || intro || dragging || convoys.length > 0 || hmDirty || U.uClock.value < wakeUntil;
  if (!busy) { controls.update(); return; }                             // nothing moves: no work, no frame
  if (raw > 19.5 && raw < 400) { if (++slow > 80 && tier > 0) { tier--; slow = 0; resize(); } } else slow = Math.max(0, slow - 2);
  if (intro && U.uClock.value > 2.2) { intro = false; seek(T0, false); setPlay(true); }
  if (playing && !dragging) { const lim = still ? T0 + SPAN * Math.min(1, +Q.get("t")) : T1; seek(Math.min(lim, T + dt * SPAN / REPLAY_S), true); if (T >= T1) setPlay(false); }
  if (crane && !reduced && (intro || !(T >= T1 && !playing))) craneCam(dt); else controls.update();
  if (hmDirty && U.uClock.value - hmAt > .12 || hmAt > U.uClock.value) bake();
  stepConvoys();
  const now = U.uClock.value;                                           // district outlines: quiet, lighter for a moment when a merge arrives
  DS.forEach((d, i) => { const k = Math.max(0, 1 - (now - pulse[i]) / 2.4), s = (sel === i ? .9 : hovD === i ? .6 : .34) + k * k * .9;
    for (let j = 0; j < 8; j++) plotCol.set([s * .86, s * .8, s * .68], i * 24 + j * 3);
    nameMat[i].opacity = sel < 0 || sel === i ? Math.min(1, .5 + k * .5 + (hovD === i ? .3 : 0)) : .15; });
  plotGeo.attributes.color.needsUpdate = true;
  const ld = sel >= 0 ? sel : hovD;                                     // one floating name, for the district under the pointer or selected
  if (ld >= 0) { const [x, y, w, h] = DS[ld].r, v = new THREE.Vector3(x + w / 2, 0, y + h).project(camera); dLab.textContent = DS[ld].name;
    dLab.style.opacity = v.z < 1 ? .9 : 0; dLab.style.transform = `translate(${(v.x * .5 + .5) * innerWidth}px, ${(-v.y * .5 + .5) * innerHeight + 8}px)`; } else dLab.style.opacity = 0;
  drawScrub();
  composer.render(); rendered++;
}
window.__dbg = () => JSON.stringify({ rendered, clock: +U.uClock.value.toFixed(2), p: +((T - T0) / SPAN).toFixed(3), playing, tier, convoys: convoys.length, slow });
requestAnimationFrame(tick);
</script>
</body>
</html>
