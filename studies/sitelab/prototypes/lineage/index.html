<style>
:root {
  color-scheme: dark;

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
body { font: 400 15px/1.5 "Archivo", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#gl.over { cursor: pointer; } canvas#gl.drag { cursor: grabbing; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

.left { position: fixed; left: 0; top: 0; bottom: 0; padding: 28px 0 0 32px; width: calc(min(340px, 30vw) + 32px); pointer-events: none; }
.left::before { content: ""; position: absolute; inset: 0 -120px 0 0; background: linear-gradient(90deg, rgba(16, 15, 14, .92) 55%, rgba(16, 15, 14, 0)); z-index: -1; }
.left > * { pointer-events: auto; }
.tag { font-weight: 660; font-stretch: 114%; font-size: 13px; letter-spacing: .02em; color: var(--mute); }
.tag a { color: var(--faint); text-decoration: none; margin-right: 10px; padding-right: 10px; border-right: 1px solid var(--rule); font-weight: 500; } .tag a:hover { color: var(--ink); }
.finish { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 55%, rgba(0, 0, 0, .5) 100%); }
.grainy { position: fixed; inset: 0; pointer-events: none; opacity: .055; }
.cap { margin: 14px 0 0; font-family: "Newsreader", Georgia, serif; font-size: clamp(23px, 2vw, 34px); line-height: 1.13; font-weight: 300; letter-spacing: -.012em; text-wrap: balance; }
.cap b { font-weight: 400; color: var(--blue); }
.sub { margin: 12px 0 0; color: var(--mute); font-size: 13.5px; line-height: 1.45; max-width: 34ch; }
.rank { margin: 22px 0 0; border-top: 1px solid var(--rule); }
.rank h3 { margin: 10px 0 4px; font-size: 12.5px; font-weight: 640; font-stretch: 110%; color: var(--mute); letter-spacing: .015em; }
.row { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: baseline; width: 100%; padding: 6px 0; border-bottom: 1px solid var(--rule); position: relative; }
.row .n { font-weight: 560; font-size: 15px; text-align: right; color: var(--ink); }
.row .t { font-size: 13px; line-height: 1.3; color: var(--mute); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .t i { font-style: normal; color: oklch(var(--pl) var(--pc) var(--h)); }
.row::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: calc(var(--w) * 100%); background: oklch(var(--pl) var(--pc) var(--h)); opacity: .8; transition: width .5s; }
.row:hover .t, .row.on .t { color: var(--ink); }
.opts { margin-top: 12px; font-size: 12.5px; color: var(--faint); display: flex; gap: 16px; }
.opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.opts input { accent-color: var(--blue); margin: 0; }

.panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 92vw); padding: 28px 30px 60px 44px; overflow-y: auto; bottom: 100px;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 50px), transparent); mask-image: linear-gradient(#000 calc(100% - 50px), transparent);
  background: rgba(16, 15, 14, .965); border-left: 1px solid var(--rule); transform: translateX(104%); transition: transform .55s cubic-bezier(.2, .8, .2, 1); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.panel { visibility: hidden; } .panel.open { transform: none; visibility: visible; }
.panel .x { position: absolute; right: 26px; top: 24px; color: var(--mute); font-size: 13px; }
.panel .x:hover { color: var(--ink); }
.meta { font-size: 13px; color: var(--mute); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-right: 50px; }
.meta .who { color: oklch(var(--pl) var(--pc) var(--h)); font-weight: 620; }
.meta .id { color: var(--faint); }
.panel h2 { margin: 12px 0 0; font-family: "Newsreader", Georgia, serif; font-size: 25px; line-height: 1.14; font-weight: 300; letter-spacing: -.01em; text-wrap: balance; }
.counts { display: grid; grid-template-columns: 1fr 1fr; margin: 18px 0 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts div { padding: 10px 0; } .counts div + div { border-left: 1px solid var(--rule); padding-left: 16px; }
.counts b { display: block; font-family: "Newsreader", Georgia, serif; font-size: 30px; font-weight: 300; line-height: 1.1; }

.plain { margin: 14px 0 0; font-size: 14px; line-height: 1.45; }
.plain p { margin: 0 0 8px; } .plain em { font-style: normal; color: var(--mute); font-size: 12.5px; font-weight: 600; margin-right: 6px; }
.scores { margin: 12px 0 0; font-size: 13px; }
.scores div { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.scores b { font-weight: 600; } .scores span { color: var(--mute); }
.text { margin: 14px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--mute); white-space: pre-wrap; overflow-wrap: anywhere; }
.text a, .lst button { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--faint); }
.text a:hover { color: var(--blue); border-color: var(--blue); }
.panel h4 { margin: 20px 0 2px; font-size: 12.5px; font-weight: 640; font-stretch: 110%; color: var(--mute); letter-spacing: .015em; }
.lst button { display: grid; grid-template-columns: 9px 1fr; gap: 9px; align-items: baseline; width: 100%; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13px; line-height: 1.3; color: var(--mute); }
.lst button:hover { color: var(--ink); }
.lst .d { width: 8px; height: 8px; border-radius: 50%; background: oklch(var(--pl) var(--pc) var(--h)); transform: translateY(-1px); }
.lst .via { color: var(--faint); font-size: 12px; }
.cm { font-size: 13px; color: var(--mute); padding: 6px 0; border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.cm b { font-weight: 600; color: oklch(var(--pl) var(--pc) var(--h)); margin-right: 6px; }
.cm time { color: var(--faint); margin-right: 6px; }

.bar { position: fixed; left: 32px; right: 32px; bottom: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: end; pointer-events: none; }
.bar > * { pointer-events: auto; }
.play { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--faint); color: var(--ink); margin-bottom: 4px; transition: border-color .2s; } .play:hover { border-color: var(--ink); }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.scrub { position: relative; height: 64px; cursor: ew-resize; touch-action: none; }
.scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.now { text-align: right; min-width: 150px; margin-bottom: 2px; }
.now b { display: block; font-family: "Newsreader", Georgia, serif; font-size: 24px; font-weight: 300; line-height: 1.1; }
.now span { font-size: 12.5px; color: var(--mute); }
.feed { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(760px, 60vw); font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .4s; }
.feed i { font-style: normal; color: oklch(var(--pl) var(--pc) var(--h)); font-weight: 620; }
.key { margin-top: 22px; display: flex; gap: 16px; font-size: 12.5px; color: var(--faint); align-items: center; pointer-events: none; flex-wrap: wrap; max-width: 340px; }
.key { row-gap: 6px; column-gap: 14px; }
.key span { display: flex; gap: 6px; align-items: center; } .key .br { flex-basis: 100%; height: 0; }
.key svg { width: 13px; height: 13px; overflow: visible; }
.who-key i { width: 8px; height: 8px; border-radius: 50%; background: oklch(var(--pl) var(--pc) var(--h)); display: inline-block; }

.lab { position: fixed; left: 0; top: 0; font-size: 12.5px; line-height: 1.2; color: var(--ink); pointer-events: none; white-space: nowrap; will-change: transform; text-shadow: 0 0 3px #100f0e, 0 0 3px #100f0e, 0 0 7px #100f0e, 0 0 12px #100f0e; font-weight: 500; }
.lab em { font-style: normal; color: var(--mute); font-weight: 400; margin-left: 6px; }
.hr { position: fixed; left: 0; top: 0; font-size: 11.5px; color: var(--faint); pointer-events: none; white-space: nowrap; will-change: transform; }
.tip { position: fixed; left: 0; top: 0; max-width: 340px; font-size: 13px; line-height: 1.35; pointer-events: none; opacity: 0; transition: opacity .15s; padding-left: 12px; border-left: 1px solid oklch(var(--pl) var(--pc) var(--h)); text-shadow: 0 0 8px #100f0e, 0 0 3px #100f0e; }
.tip .m { color: var(--mute); font-size: 12px; } .tip .m i { font-style: normal; color: oklch(var(--pl) var(--pc) var(--h)); font-weight: 620; }
.err { position: fixed; left: 32px; bottom: 150px; color: var(--red); font-size: 13px; white-space: pre-wrap; max-width: 60vw; z-index: 9; }
@media (max-width: 820px) {
  .left { left: 16px; top: 14px; width: calc(100vw - 32px); } .rank, .sub, .key, .opts, .left::before { display: none; } .cap { font-size: 20px; }
  .bar { left: 16px; right: 16px; gap: 10px; } .now { min-width: 0; } .now b { font-size: 16px; }
  .panel { top: auto; bottom: 84px; height: 46vh; width: 100vw; padding: 18px 18px 110px; background: rgba(16, 15, 14, .94); transform: translateY(104%); }
  .feed { display: none; }
}

<body>

<div class="finish"></div><div class="grainy" id="grainy"></div>
<div id="labs"></div>
<div class="left">
  <div class="tag"><a href="../../">Lab</a><span>Who cited whom</span></div>
  <p class="cap" id="cap">&nbsp;</p>
  <p class="sub" id="sub"></p>
  <div class="rank"><h3>Most descendants</h3><div id="rank"></div></div>

</div>

<script type="module">
window.addEventListener("error", e => { document.getElementById("err").textContent += e.message + "\n"; });
window.addEventListener("unhandledrejection", e => { document.getElementById("err").textContent += (e.reason && e.reason.stack || e.reason) + "\n"; });

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { forceSimulation, forceLink, forceManyBody, forceX, forceY, forceZ } from "https://cdn.jsdelivr.net/npm/d3-force-3d@3.0.5/+esm";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Q = new URLSearchParams(location.search);
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HUES = [38, 150, 240, 95, 320, 200];  // clay, sage, slate: muted, one per person in the sorted list of names
const PL = .74, PC = .048;
const ID = /\b(?:work|result|idea|knowledge|skill)-[0-9a-f]{6}\b/g;
const KIND = { result: "Result", work: "Work", idea: "Idea", knowledge: "Knowledge", skill: "Skill", finding: "Finding page", theory: "Theory round" };

function oklch(L, C, h) {  // -> linear sRGB
  const a = C * Math.cos(h * Math.PI / 180), b = C * Math.sin(h * Math.PI / 180);
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s, -.0041960863 * l - .7034186147 * m + 1.707614701 * s].map(v => Math.max(0, v));
}
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const day = ms => new Date(ms).toLocaleDateString([], { weekday: "short" });
const clip = (s, n) => { s = s.replace(/\s+/g, " ").trim(); if (s.length <= n) return s; const c = s.slice(0, n); return c.slice(0, Math.max(c.lastIndexOf(" "), n - 12)) + "…"; };

// ---------- data: build.py's data.json (the whole board, with comments), then /data live for anything newer
const D = await (await fetch("data.json")).json();
const nodes = [], byId = new Map(), edges = [], edgeKey = new Set();
let people = [];
function addNode(n) {
  if (byId.has(n.id)) return null;
  n.i = nodes.length; n.out = []; n.inn = []; n.desc = 0; n.vis = 0; n.flash = 0; n.lit = 1;
  const lead = n.text.replace(/^(Day-\d+ #\d+[^:]{0,60}:|[A-Z][\w-]* ?\d*:)\s*/, "").replace(/\s+/g, " "), cut = lead.slice(24).search(/[,;:.] | — | \(/);
  n.name = (n.plain && n.plain.title) || (cut >= 0 && cut < 50 ? lead.slice(0, 24 + cut) : clip(lead, 60));  // the title, or the first clause of the text
  nodes.push(n); byId.set(n.id, n); return n;
}
function addEdge(e) {
  const s = byId.get(e.s), t = byId.get(e.t), key = e.s + ">" + e.t;
  if (!s || !t || edgeKey.has(key)) return null;
  edgeKey.add(key);
  const E = { s, t, source: s, target: t, ref: e.k === "ref", via: e.via, at: e.at, i: edges.length, g: 0, lit: 1, phase: Math.random() };
  edges.push(E);
  if (E.ref) { s.out.push(E); t.inn.push(E); }
  return E;
}
D.nodes.forEach(addNode); D.edges.forEach(addEdge);
people = [...new Set(nodes.map(n => n.who))].sort();
const hue = who => HUES[Math.max(0, people.indexOf(who)) % HUES.length];
const T0 = nodes[0].at;
let T1 = Math.max(Date.now(), nodes[nodes.length - 1].at);  // the right end of the scrubber is now
const TEND = () => Math.max(nodes[nodes.length - 1].at + 6e5, Math.min(T1, nodes[nodes.length - 1].at + 36e5));

// ---------- lanes: the study an item belongs to. Its text names studies/<name>; an item that names none takes the
// study most common among the items it is linked to by a reference
const laneOf = n => { const m = n.text.match(/studies\/([a-z0-9_]+)/); return m ? m[1] : null; };
let lanes = [];
function setLanes() {
  for (const n of nodes) n.study = n.study0 = n.study0 !== undefined ? n.study0 : laneOf(n);
  for (let pass = 0; pass < 4; pass++) for (const n of nodes) if (!n.study) {
    const c = {}; for (const e of n.inn) if (e.s.study) c[e.s.study] = (c[e.s.study] || 0) + 1; for (const e of n.out) if (e.t.study) c[e.t.study] = (c[e.t.study] || 0) + 1;
    const best = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; if (best) n.study = best;
  }
  const count = {}; for (const n of nodes) if (n.study) count[n.study] = (count[n.study] || 0) + 1;
  const keep = Object.keys(count).filter(k => count[k] >= 8);
  for (const n of nodes) if (!keep.includes(n.study)) n.study = "other";
  const first = k => nodes.find(n => n.study === k).at;
  lanes = [...keep.sort((a, b) => first(a) - first(b)), "other"].filter(k => nodes.some(n => n.study === k)).map(k => ({ name: k, n: nodes.filter(n => n.study === k).length }));
  let z = 0; for (const l of lanes) { l.w = 26 + .95 * l.n; /* a lane is as deep as it has items */ l.z0 = z; z += l.w; }
  for (const l of lanes) { l.z0 -= z / 2; l.zc = l.z0 + l.w / 2; }
  for (const n of nodes) n.lz = lanes.find(l => l.name === n.study).zc;
}
setLanes();

// ---------- layout: a force simulation in 3D; x is pulled toward the time an item was posted, z toward the lane of its study
const XS = 52;  // world units per hour
const tx = ms => ((ms - T0) / 36e5) * XS;
const sim = forceSimulation(nodes, 3)
  .force("link", forceLink(edges).distance(e => e.ref ? 26 : 34).strength(e => e.ref ? .2 / Math.min(e.s.out.length + e.s.inn.length, e.t.out.length + e.t.inn.length, 4) : .035))
  .force("charge", forceManyBody().strength(-70).distanceMax(220).theta(.9))
  .force("x", forceX(n => tx(n.at)).strength(.34))
  .force("y", forceY(0).strength(.3)).force("z", forceZ(n => n.lz).strength(.22))
  .alphaDecay(.02).velocityDecay(.42).stop();
nodes.forEach(n => { n.x = tx(n.at); n.y = (Math.random() - .5) * 120; n.z = n.lz + (Math.random() - .5) * 30; });
for (let i = 0; i < 260; i++) sim.tick();
sim.alpha(.02).alphaTarget(0);  // at rest unless a body is being pulled

// ---------- descendants at a time T: everything reachable along reference edges that existed by T
let T = T0, shown = 0, top = [];
const stamp = new Int32Array(4096); let stampN = 0;
function countDesc() {
  for (const n of nodes) {
    if (n.at > T || !n.out.length) { n.desc = 0; continue; }
    stampN++; let c = 0; const st = [n];
    while (st.length) for (const e of st.pop().out) if (e.at <= T && stamp[e.t.i] !== stampN) { stamp[e.t.i] = stampN; c++; st.push(e.t); }
    n.desc = c;
  }
  shown = nodes.filter(n => n.at <= T).length;
  top = nodes.filter(n => n.desc > 0).sort((a, b) => b.desc - a.desc || a.at - b.at).slice(0, innerHeight < 900 ? 4 : 6);
}
function lineage(n, dir) {  // dir "inn": what n stands on; "out": what stands on n. Item -> its number of steps from n
  const seen = new Map(), q = [[n, 0]];
  for (let i = 0; i < q.length; i++) for (const e of q[i][0][dir]) { const m = dir === "out" ? e.t : e.s; if (e.at <= T && !seen.has(m)) { seen.set(m, q[i][1] + 1); q.push([m, q[i][1] + 1]); } }
  return seen;
}

// ---------- scene
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
let PR = Math.min(devicePixelRatio, 2); renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const BG = new THREE.Color("#0d0c0b");
const scene = new THREE.Scene(); scene.background = BG;
scene.fog = new THREE.Fog(BG, 800, 4000);
// the room: a procedural studio, seen only in reflections; one key from the upper left, a low fill, a rim from behind
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const key = new THREE.DirectionalLight(0xfff1dc, 2.6); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0004; key.shadow.normalBias = .6; key.shadow.radius = 5;
const rim = new THREE.DirectionalLight(0xcfd8e6, .6), fill = new THREE.HemisphereLight(0xf2ebe0, 0x15120f, .28);
scene.add(key, key.target, rim, rim.target, fill);
function aimLights() {
  const c = tx(TEND()) / 2, h = c + 120;
  key.target.position.set(c, FY, 0); key.position.set(c - 240, FY + 900, 300);
  Object.assign(key.shadow.camera, { left: -h, right: h, top: 460, bottom: -460, near: 100, far: 1800 }); key.shadow.camera.updateProjectionMatrix();
  rim.target.position.set(c, 0, 0); rim.position.set(c + 500, 260, -700);
}
const camera = new THREE.PerspectiveCamera(36, 1, 2, 24000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .07; controls.rotateSpeed = .6; controls.zoomSpeed = .8; controls.minDistance = 40; controls.maxDistance = 9000;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
// the finish (vignette, grain) is two still layers over the canvas, so the picture is one direct render pass
{ const cv = document.createElement("canvas"); cv.width = cv.height = 160; const g = cv.getContext("2d"), im = g.createImageData(160, 160);
  for (let i = 0; i < im.data.length; i += 4) { im.data[i] = im.data[i + 1] = im.data[i + 2] = Math.random() < .5 ? 0 : 255; im.data[i + 3] = Math.random() * 255; }
  g.putImageData(im, 0, 0); $("grainy").style.backgroundImage = `url(${cv.toDataURL()})`; }

const U = { uTime: { value: 0 }, uBg: { value: new THREE.Vector3(BG.r, BG.g, BG.b) }, uFog: { value: new THREE.Vector2(500, 2400) }, uRes: { value: new THREE.Vector2(1, 1) } };

// bodies: instanced, physically lit, each kind its own material with a fine grain in roughness and relief
function grainTex(size, streak) {

    b.forEach((c, pi) => { if (!c) return; const h = c * unit; hctx.fillStyle = `oklch(${PL} ${PC} ${hue(people[pi])} / ${past ? .95 : .25})`; hctx.fillRect(i * bw + .5 * dpr, y - h, Math.max(bw - dpr, 1), h - .5 * dpr); y -= h; });
  });
  hctx.fillStyle = "#2b2824"; hctx.fillRect(0, base, W, dpr);
  hctx.fillStyle = "#7b756b"; hctx.font = `${11.5 * dpr}px Archivo, sans-serif`; hctx.textBaseline = "bottom";
  const step = Math.ceil(64 * dpr / (W / ((TEND() - T0) / 36e5)));
  for (let h = Math.ceil(T0 / 36e5) * 36e5; h < TEND(); h += step * 36e5) hctx.fillText(clock(h), (h - T0) / (TEND() - T0) * W + 2 * dpr, H);
  const x = (T - T0) / (TEND() - T0) * W;
  hctx.fillStyle = "#cfa765"; hctx.fillRect(Math.min(x, W - 1.5 * dpr), 0, 1.5 * dpr, base);
}
let scrubbing = false;
const scrubTo = e => { const r = $("scrub").getBoundingClientRect(); setT(T0 + (TEND() - T0) * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); };
$("scrub").addEventListener("pointerdown", e => { scrubbing = true; setPlay(false); $("scrub").setPointerCapture(e.pointerId); scrubTo(e); });
$("scrub").addEventListener("pointermove", e => { if (scrubbing) scrubTo(e); });
$("scrub").addEventListener("pointerup", () => { scrubbing = false; });
$("sess").onchange = e => { showSess = e.target.checked; };

// ---------- pointer: hover, click to select, drag a body to pull on its lineage
const ptr = { x: -1e4, y: -1e4, down: false, sx: 0, sy: 0, moved: false, cand: null };
const ray = new THREE.Raycaster(), plane = new THREE.Plane(), v3 = new THREE.Vector3();
function pick(x, y) {
  let best = null, bd = 1e9;
  for (const n of nodes) {
    if (n.vis < .5 || n.sz < 0) continue;
    const d = Math.hypot(n.sx - x, n.sy - y), hit = Math.max(n.sr + 5, 11);
    if (d < hit && (n.lit > .5 || !sel || d < n.sr + 2)) { const score = d / hit + n.sz * 1e-4 + (n.lit > .5 ? 0 : 1); if (score < bd) { bd = score; best = n; } }
  }
  return best;
}
canvas.addEventListener("pointermove", e => {
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (ptr.down && !ptr.moved && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 5) {
    ptr.moved = true;
    if (ptr.cand) { dragging = ptr.cand; controls.enabled = false; canvas.classList.add("drag"); sim.alphaTarget(.22); plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(v3).clone(), new THREE.Vector3(dragging.x, dragging.y, dragging.z)); }
  }
  if (dragging) {
    ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
    if (ray.ray.intersectPlane(plane, v3)) { dragging.fx = v3.x; dragging.fy = v3.y; dragging.fz = v3.z; }
  }
});
canvas.addEventListener("pointerdown", e => { ptr.down = true; ptr.moved = false; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.x = e.clientX; ptr.y = e.clientY; ptr.cand = pick(e.clientX, e.clientY); glide.on = false; framed = false; if (ptr.cand) controls.enabled = false; });
canvas.addEventListener("wheel", () => { framed = false; glide.on = false; }, { passive: true });
addEventListener("pointerup", e => {
  if (!ptr.down) return; ptr.down = false; if (e.pointerType === 'touch') setTimeout(() => { ptr.x = ptr.y = -1e4; hov = null; }, 0); controls.enabled = true; canvas.classList.remove("drag");
  if (dragging) { dragging.fx = dragging.fy = dragging.fz = null; dragging = null; sim.alphaTarget(0); return; }
  if (!ptr.moved && e.target === canvas) { const n = pick(e.clientX, e.clientY); if (n) select(n); else if (sel) select(null); }
});
canvas.addEventListener("pointerleave", () => { ptr.x = ptr.y = -1e4; });
addEventListener("keydown", e => { if (e.key === "Escape") select(null); if (e.key === " ") { e.preventDefault(); $("play").click(); } });

// ---------- labels: the items with the most descendants; with a selection, the item and its direct links
const labPool = Array.from({ length: 16 }, () => { const el = document.createElement("div"); el.className = "lab"; el.style.display = "none"; $("labs").append(el); return { el, n: null }; });
function drawLabels() {
  let want = sel ? [sel, ...sel.inn.filter(e => e.at <= T).map(e => e.s), ...sel.out.filter(e => e.at <= T).map(e => e.t)].slice(0, 11) : top.slice(0, 5);
  if (hov && !want.includes(hov) && ptr.x < -1e3) want = [hov, ...want];   // hovered from the list; under the pointer the tooltip names it
  const placed = []; let k = 0;
  for (const n of want) {
    if (k >= labPool.length || n.vis < .6 || n.sz < 0) continue;
    const text = clip(n.name, sel && n !== sel ? 36 : 48), w = text.length * 6.6 + (n.desc ? 30 : 0), x = n.sx + n.sr + 8, y = n.sy - 8;
    if (x < 0 || x + w > innerWidth || y < 0 || y > innerHeight - 110) continue;
    if (placed.some(p => x < p.x + p.w + 8 && x + w + 8 > p.x && Math.abs(y - p.y) < 17)) continue;
    if (!sel && innerWidth > 820 && x < Math.min(340, innerWidth * .3) + 50 && y < 460) continue;
    placed.push({ x, y, w });
    const L = labPool[k++];
    const html = esc(text) + (n.desc ? `<em>${n.desc}</em>` : "");
    if (L.html !== html) { L.el.innerHTML = html; L.html = html; }
    L.el.style.display = ""; L.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; L.el.style.opacity = n === sel || n === hov || !sel ? 1 : .8;
  }
  for (; k < labPool.length; k++) labPool[k].el.style.display = "none";
}
function drawTip() {
  const tip = $("tip"), n = hov && !dragging && ptr.x > -1e3 ? hov : null;
  if (!n) { tip.style.opacity = 0; return; }
  if (tip._n !== n) {
    tip._n = n; tip.style.setProperty("--h", hue(n.who));
    const s = n.scores && n.scores[0];
    tip.innerHTML = `<div class="m">${KIND[n.kind]}, <i>${esc(n.who)}</i>, ${day(n.at)} ${clock(n.at)}${n.desc ? `, ${n.desc} descendants` : ""}</div><div>${esc(clip(n.text, 170))}</div>${s ? `<div class="m">${s.right}/${s.n} ${esc(s.benchmark)} (${pct(s)} %), ${esc(s.model)}</div>` : ""}`;
  }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ptr.x + 18, y = ptr.y + 18; if (x + w > innerWidth - 12) x = ptr.x - w - 18; if (y + h > innerHeight - 110) y = ptr.y - h - 14;
  tip.style.transform = `translate(${x}px,${y}px)`; tip.style.opacity = 1;
}
function feed(n) {
  $("feed").style.setProperty("--h", hue(n.who));
  $("feed").innerHTML = `${clock(n.at)} <i>${esc(n.who)}</i> ${n.kind === "finding" ? "published a finding page" : n.kind === "theory" ? "ran a theory round" : "posted " + (n.kind === "idea" ? "an idea" : n.kind === "work" ? "work" : n.kind === "result" ? "a result" : n.kind)}: ${esc(clip(n.name, 90))}`;
}

// ---------- frame
const M = new THREE.Matrix4(), P = new THREE.Vector3(), S = new THREE.Vector3(), Qd = new THREE.Quaternion(), spin = new THREE.Quaternion(), yAxis = new THREE.Vector3(.3, 1, .2).normalize();
const ease = t => 1 - Math.pow(1 - t, 3);
let W = 1, H = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; offNow = offX(); offYNow = offY(); camera.setViewOffset(W, H, -offNow, offYNow, W, H);
  U.uRes.value.set(W * renderer.getPixelRatio(), H * renderer.getPixelRatio());
  drawHist();
}
addEventListener("resize", () => { resize(); if (!sel) { home(true); framed = true; } });
let prev = performance.now(), snap = 6, slow = 16, prev0 = performance.now(), nf = 0, strikes = 0;
function frame(now) {
  const dt = Math.min(Math.max((now - prev) / 1000, 0), .1); prev = now; U.uTime.value += dt;
  const kk = snap > 0 ? (snap--, 1e3) : 1;  // a still view (?t=) starts settled
  if (playing) {
    setT(T + (TEND() - T0) * dt / REPLAY_S, true);
    if (now - lastCount > 120) refreshT();
    if (T >= TEND()) { setPlay(false); refreshT(); if (follow && !sel) home(); }
  }
  if (sim.alpha() > .0012 || dragging) sim.tick();
  if (glide.on) {
    glide.t = Math.min(1, glide.t + dt / 1.5); const k = glide.t < .5 ? 4 * glide.t ** 3 : 1 - Math.pow(-2 * glide.t + 2, 3) / 2;
    camera.position.lerpVectors(glide.p0, glide.p1, k); controls.target.lerpVectors(glide.q0, glide.q1, k); if (glide.t >= 1) glide.on = false;
  }
  if (playing && follow && !sel && !glide.on) { const f = frameFor(grown()), k = Math.min(1, dt * 1.6); camera.position.lerp(f.pos, k); controls.target.lerp(f.target, k); }
  if (Math.abs(offX() - offNow) + Math.abs(offY() - offYNow) > .5) { const k = Math.min(1, dt * 3.5 * kk); offNow += (offX() - offNow) * k; offYNow += (offY() - offYNow) * k; camera.setViewOffset(W, H, -offNow, offYNow, W, H); }
  controls.update(); camera.updateMatrixWorld();
  const d0 = camera.position.distanceTo(controls.target); U.uFog.value.set(d0 * .75, d0 * 2.6 + 500); scene.fog.near = d0 * .9; scene.fog.far = d0 * 3 + 800;
  const fl = H / (2 * Math.tan(camera.fov * Math.PI / 360));
  nowLine.position.x = tx(T); nowLine.scale.z = FZ * 2;
  spin.setFromAxisAngle(yAxis, now / 16000);

  // nodes
  let born = null;
  for (const n of nodes) {
    const on = n.at <= T ? 1 : 0;
    if (on && n.vis === 0) {  // born: starts at the newest item it references, with a flash
      const e = n.inn.length ? n.inn[n.inn.length - 1] : null;
      if (e && e.s.vis > .5) { n.bx = e.s.px; n.by = e.s.py; n.bz = e.s.pz; } else { n.bx = n.x; n.by = n.y - 30; n.bz = n.z; }
      n.flash = 1; born = n;
    }
    n.vis += (on - n.vis) * Math.min(1, dt * (on ? 2.6 : 7)); if (Math.abs(on - n.vis) < .002) n.vis = on;
    n.flash *= Math.exp(-dt * 1.2);
    const k = ease(n.vis);
    n.px = n.bx !== undefined ? n.bx + (n.x - n.bx) * k : n.x; n.py = n.by !== undefined ? n.by + (n.y - n.by) * k : n.y; n.pz = n.bz !== undefined ? n.bz + (n.z - n.bz) * k : n.z;
    const tr = BASE[n.kind] * (1 + .5 * Math.log2(1 + n.desc)); n.r += (tr - n.r) * Math.min(1, dt * 4 * kk);
    const r = n.r * k * (n === hov ? 1.1 : 1);
    P.set(n.px, n.py, n.pz); S.setScalar(Math.max(r, 1e-4));
    M.compose(P, n.mesh === meshes.ring ? camera.quaternion : n.mesh === meshes.glazed || n.mesh === meshes.clay ? Qd : spin, S); n.mesh.setMatrixAt(n.slot, M);
    const lit = n.litNow = (n.litNow ?? 1) + ((now < (n.litAt || 0) ? .1 : n.lit) - (n.litNow ?? 1)) * Math.min(1, dt * 6 * kk);
    const gain = 1 + n.flash * .9 + (n === hov ? .2 : 0), ic = n.mesh.instanceColor.array, o = n.slot * 3;  // newly posted: briefly lighter
    for (let j = 0; j < 3; j++) ic[o + j] = (DIMC[j] + (n.col[j] - DIMC[j]) * lit) * gain;
    P.project(camera); n.sx = (P.x + 1) * W / 2; n.sy = (1 - P.y) * H / 2; n.sz = P.z > 1 ? -1 : P.z;
    const depth = v3.set(n.px, n.py, n.pz).applyMatrix4(camera.matrixWorldInverse).z; n.sr = depth < 0 ? r * fl / -depth : 0; if (depth >= 0) n.sz = -1;
  }
  if (born && born !== lastBorn) { lastBorn = born; feed(born); }
  for (const k in meshes) { meshes[k].instanceMatrix.needsUpdate = true; meshes[k].instanceColor.needsUpdate = true; }

  // edges
  let c = 0; const aS = eBuf.aS.array, aT = eBuf.aT.array, aCs = eBuf.aCs.array, aCt = eBuf.aCt.array, aE = eBuf.aE.array;
  for (const e of edges) {
    const on = e.at <= T && e.s.vis > .3 && (e.ref || showSess) ? 1 : 0;
    e.g += (on - e.g) * Math.min(1, dt * (on ? 2.2 : 9)); if (e.g < .004) { e.g = 0; continue; }
    e.litNow = (e.litNow ?? 1) + ((now < (e.litAt || 0) ? .05 : e.lit) - (e.litNow ?? 1)) * Math.min(1, dt * 6 * kk);
    const s = e.s, t = e.t;
    aS[c * 3] = s.px; aS[c * 3 + 1] = s.py; aS[c * 3 + 2] = s.pz; aT[c * 3] = t.px; aT[c * 3 + 1] = t.py; aT[c * 3 + 2] = t.pz;
    aCs.set(s.col, c * 3); aCt.set(t.col, c * 3);
    aE[c * 4] = e.g > .996 ? 1 : e.g; aE[c * 4 + 1] = e.litNow; aE[c * 4 + 2] = e.ref ? 1 : 0; aE[c * 4 + 3] = e.phase; c++;
  }
  eg.instanceCount = c; for (const k in eBuf) eBuf[k].needsUpdate = true;

  // hover and rings
  if (!ptr.down && !scrubbing && ptr.x > -1e3) { const h = pick(ptr.x, ptr.y); if (h !== hov) { hov = h; canvas.classList.toggle("over", !!h); } }
  for (const [ring, n] of [[selRing, sel], [hovRing, hov !== sel ? hov : null]]) {
    ring.visible = !!n && n.vis > .5; if (!ring.visible) continue;
    ring.position.set(n.px, n.py, n.pz); ring.quaternion.copy(camera.quaternion); ring.scale.setScalar(n.r * 1.25 + 1.2);
  }
  drawLabels(); drawTip();
  renderer.render(scene, camera);
  if (now - prev0 < 100) slow = slow * .97 + (now - prev0) * .03; prev0 = now;   // frames steadily slow (not one stall): lower the internal resolution one step
  if (++nf % 120 === 0) { strikes = slow > 20 ? strikes + 1 : 0; if (strikes >= 3 && PR > 1) { PR = Math.max(1, PR - .25); renderer.setPixelRatio(PR); renderer.setSize(W, H, false); U.uRes.value.set(W * PR, H * PR); slow = 16; strikes = 0; } }
  requestAnimationFrame(frame);
}

// ---------- live: the site's /data, every 45 s; an item that is not in data.json yet joins the graph
async function poll() {
  const r = await fetch("/data"); if (!r.ok) throw new Error("/data " + r.status);
  const live = await r.json(); let added = 0; const fresh = [], wasEnd = T >= TEND() - 1;
  for (const it of live.items.slice().sort((a, b) => a.at_ns - b.at_ns)) {
    if (byId.has(it.id)) { byId.get(it.id).open = it.listed === "work"; continue; }
    const n = addNode({ id: it.id, kind: it.kind, who: it.who, branch: it.branch, text: it.text, at: Math.round(it.at_ns / 1e6), open: it.listed === "work", session: it.session || "", comments: [],
      plain: live.plain && live.plain[it.id] && live.plain[it.id].title ? live.plain[it.id] : undefined,
      scores: live.scores.filter(s => s.result === it.id).map(s => ({ model: s.model, benchmark: s.benchmark, right: +s.right, n: +s.n, config: s.config || "", tokens: s.tokens })) });
    if (!n) continue; if (!n.scores.length) delete n.scores;
    if (!people.includes(n.who)) people.push(n.who);
    const near = nodes[n.i - 1]; n.x = tx(n.at); n.y = near ? near.y + 10 : 0; n.z = near ? near.z + 10 : 0;
    placeNode(n); fresh.push(n); added++;
  }
  for (const n of fresh) {
    for (const m of new Set(n.text.match(ID) || [])) if (m !== n.id && byId.has(m)) { const o = byId.get(m), [a, b] = o.at <= n.at ? [o, n] : [n, o]; addEdge({ s: a.id, t: b.id, k: "ref", via: "text", at: b.at }); }
    const same = n.session && nodes.filter(m => m !== n && m.session === n.session && m.at <= n.at).pop();
    if (same) addEdge({ s: same.id, t: n.id, k: "session", via: "same agent session", at: n.at });
  }
  if (added) {
    T1 = Date.now();
    setLanes(); sim.nodes(nodes); sim.force("link").links(edges); sim.force("z", forceZ(n => n.lz).strength(.3)); sim.alpha(.2);
    buildFloor(); if (wasEnd && !playing) setT(TEND()); else refreshT();
    if (!sel && framed) home();
  }
}

// a lost graphics context (the GPU process restarted) leaves no textures: say so, and start again when it is back
canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); $("count").textContent = "graphics context lost, reloading when it returns"; });
canvas.addEventListener("webglcontextrestored", () => location.reload());
resize(); home(true);
setPlay(playing);
const qt = Q.get("t");  // the page opens on the whole graph at now; the replay starts only when the reader presses play
setT(T0 + (TEND() - T0) * (qt === null ? 1 : +qt)); for (const n of nodes) if (n.at <= T) n.vis = 1; for (const e of edges) if (e.at <= T) e.g = 1;
if (Q.get("sel") && byId.has(Q.get("sel"))) { const n = byId.get(Q.get("sel")); select(n); glide.t = .999; }
document.fonts.ready.then(drawHist);
requestAnimationFrame(frame);
const tryPoll = () => poll().then(() => { liveNote = ""; }, () => { liveNote = `, live read failed at ${clock(Date.now())}, showing the last data`; }).then(() => { $("count").textContent = countText() + liveNote; });
tryPoll(); setInterval(() => { if (!document.hidden) tryPoll(); }, 45000);
</script>
