<style>
:root {
  color-scheme: dark;
  --paper: #121110; --sheet: #1a1816; --ink: #e8e2d6; --mute: #a39a8c; --faint: #7b7368; --rule: #2e2a25;
  --brass: #c7a56a; --red: #c4634a; --col: 372px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--paper); overflow: hidden;
  font: 400 14px/1.5 "Archivo", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; border-radius: 2px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.orbit { cursor: grabbing; } canvas.level { cursor: ns-resize; } canvas.pick { cursor: pointer; }
.shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(18, 17, 16, .93), rgba(18, 17, 16, .8) 21%, rgba(18, 17, 16, 0) 38%); }

.col { position: fixed; left: 0; top: 0; bottom: 0; width: var(--col); padding: 22px 0 18px 40px; display: flex; flex-direction: column; pointer-events: none; }
.col > * { pointer-events: auto; }
.top { display: flex; align-items: baseline; gap: 14px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--faint); }
.top a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--rule); }
.top a:hover { color: var(--ink); }
h1 { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 30px; line-height: 1.16; letter-spacing: -.012em; margin: 26px 0 18px; text-wrap: balance; }
h1 b { font-weight: 300; color: var(--brass); font-variant-numeric: lining-nums; }
h1 i { font-style: normal; color: var(--red); }
.slots { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--rule); }
.slots button { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule); color: var(--mute); }
.slots button u { text-decoration: none; font-weight: 700; font-size: 11px; letter-spacing: .08em; color: var(--faint); }
.slots button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots button em { font-style: normal; font-family: "Newsreader", Georgia, serif; font-size: 19px; line-height: 1; color: var(--mute); font-variant-numeric: lining-nums tabular-nums; }
.slots button[aria-pressed=true] { color: var(--ink); } .slots button[aria-pressed=true] u { color: var(--brass); } .slots button[aria-pressed=true] em { color: var(--ink); }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 10px; padding: 12px 0 10px; }
.nums div { font-size: 11px; color: var(--faint); letter-spacing: .04em; line-height: 1.25; }
.nums strong { display: block; font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 30px; line-height: 1.1; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.nums .is strong { color: var(--brass); } .nums .bu strong { color: var(--red); }
.note { font-size: 12.5px; color: var(--mute); min-height: 3em; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.note b { color: var(--ink); font-weight: 500; }
.list { flex: 1; min-height: 60px; overflow-y: auto; margin: 0 -8px 0 0; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #3a352f transparent; }
.list h3 { margin: 12px 0 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.list button { display: grid; grid-template-columns: 1fr 34px 26px; gap: 8px; width: 100%; padding: 2.5px 0; font-size: 13px; color: var(--mute); align-items: baseline; }
.list button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list button em, .list button i { font-style: normal; text-align: right; font-size: 12px; color: var(--faint); }
.list button:hover { color: var(--ink); }
.list button.on { color: var(--ink); font-weight: 600; } .list button.on em { color: var(--brass); }
.list button.b span::after { content: " · B"; color: var(--faint); font-weight: 600; font-size: 11px; }
.list button.a span::after { content: " · A"; color: var(--faint); font-weight: 600; font-size: 11px; }
.list button.a.b span::after { content: " · A, B"; }
.list button.on span::after { color: var(--brass); }
.listhead { display: grid; grid-template-columns: 1fr 34px 26px; gap: 8px; font-size: 10.5px; letter-spacing: .06em; color: var(--faint); padding: 8px 8px 0 0; text-align: right; }
.listhead span:first-child { text-align: left; }
.def { font-size: 11.5px; line-height: 1.45; color: var(--faint); border-top: 1px solid var(--rule); padding-top: 9px; margin-top: 6px; }
.def a { color: var(--mute); }
select { display: none; font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 7px 8px; width: 100%; }

.caption { position: fixed; left: calc(var(--col) + 30px); right: 30px; bottom: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px 24px; font-size: 12px; color: var(--mute); pointer-events: none; }
.caption span { display: inline-flex; align-items: center; gap: 7px; }
.caption span::before { content: ""; width: 9px; height: 9px; background: var(--c); border-radius: 1px; }
.caption .k { color: #8d8478; flex-basis: 100%; justify-content: center; } .caption .k::before { display: none; }
.caption .back { pointer-events: auto; color: var(--ink); border: 1px solid #4b443b; border-radius: 99px; padding: 3px 13px; background: rgba(26, 24, 22, .8); }
.caption .back[hidden] { display: none; }

.tag { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; will-change: transform; font-size: 12px; }
#gauge { color: var(--ink); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); line-height: 1.15; }
#gauge strong { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 27px; font-variant-numeric: lining-nums tabular-nums; display: block; }
#gauge small { font-size: 11px; color: var(--mute); letter-spacing: .04em; }
#tip { background: rgba(26, 24, 22, .94); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 9px; opacity: 0; transition: opacity .12s; color: var(--ink); }
#tip.on { opacity: 1; } #tip small { color: var(--mute); font-size: 11px; display: block; }

.card { position: fixed; right: 28px; top: 24px; width: 380px; max-height: calc(100% - 110px); overflow-y: auto; background: rgba(24, 22, 20, .96); border: 1px solid var(--rule); border-radius: 3px; padding: 18px 20px 16px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .5); transform: translateY(-8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .7, .2, 1); scrollbar-width: thin; }
.card.on { opacity: 1; transform: none; pointer-events: auto; }
.card .hd { display: flex; align-items: baseline; gap: 10px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--faint); }
.card .hd button { margin-left: auto; color: var(--mute); font-size: 12px; letter-spacing: .04em; text-transform: none; }
.card .hd span { white-space: nowrap; } .card .pid { font-size: 11px; color: var(--faint); margin-top: 2px; }
.card .q { font-family: "Newsreader", Georgia, serif; font-size: 17px; line-height: 1.42; margin: 10px 0 10px; color: var(--ink); overflow-wrap: anywhere; }
.card .q .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; }
.card .ans { font-size: 12.5px; color: var(--mute); padding: 8px 0; border-top: 1px solid var(--rule); }
.card .ans b { color: var(--ink); font-weight: 400; }
.card .ab { font-size: 13px; padding: 8px 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 18px 1fr auto; gap: 3px 8px; }
.card .ab u { text-decoration: none; font-weight: 700; font-size: 11px; color: var(--faint); letter-spacing: .08em; }
.card .ab span { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .card .ab em { font-style: normal; }
.card .ab em.r { color: var(--ink); } .card .ab em.w { color: var(--red); } .card .ab em.x { color: var(--brass); }
.card .by { font-size: 12.5px; color: var(--mute); padding-top: 9px; border-top: 1px solid var(--rule); }
.card .by b { color: var(--ink); font-weight: 500; font-family: "Newsreader", Georgia, serif; font-size: 19px; }
.ticks { display: flex; gap: 2px; align-items: flex-end; height: 18px; margin: 8px 0 6px; }
.ticks u { flex: 1; text-decoration: none; background: var(--mute); height: 4px; opacity: .35; }
.ticks u.r { height: 16px; opacity: .9; } .ticks u.n { height: 1px; } .ticks u.sa { background: var(--brass); opacity: 1; } .ticks u.g { margin-left: 5px; }
.card .who { font-size: 12px; color: var(--faint); line-height: 1.45; }
#err { position: fixed; left: 8px; bottom: 8px; color: var(--red); font-size: 12px; white-space: pre-wrap; z-index: 9; max-width: 70%; }

@media (max-width: 760px) {
  .shade { background: linear-gradient(180deg, rgba(18, 17, 16, .9), rgba(18, 17, 16, 0) 36%, rgba(18, 17, 16, 0) 74%, rgba(18, 17, 16, .85)); }
  .col { right: 0; width: auto; padding: 12px 16px 0; bottom: auto; }
  h1 { font-size: 20px; margin: 10px 0 8px; }
  .list, .listhead, .def, .note { display: none; }
  select { display: block; margin-top: 8px; }
  .slots { grid-template-columns: 1fr 1fr; gap: 0 12px; } .slots button { padding: 6px 0; grid-template-columns: 16px 1fr auto; font-size: 12px; } .slots button em { font-size: 16px; }
  .nums { padding: 8px 0 0; } .nums strong { font-size: 22px; }
  .caption { left: 12px; right: 12px; bottom: 10px; gap: 2px 14px; font-size: 11px; } .caption .k { display: none; }
  .card { left: 10px; right: 10px; width: auto; top: auto; bottom: 10px; max-height: 56%; }
}

<body>
<canvas id="c" aria-label="A stone basin with one column per problem, flooded to the level of the chosen configuration"></canvas>
<div class="shade"></div>
<div class="col" id="col">
  <div class="top"><a href="../../">Lab</a><span>Tide table · MATH-500</span></div>
  <h1 id="line">&nbsp;</h1>
  <div class="slots" id="slots"></div>
  <select id="pick" aria-label="Configuration of the active slot"></select>
  <div class="nums" id="nums"></div>
  <div class="note" id="note"></div>
  <div class="listhead"><span>Configuration</span><span>solves</span><span title="islands plus buoys">out</span></div>
  <div class="list" id="list"></div>
  <div class="def" id="def"></div>
</div>
<div class="caption" id="cap">
  <span style="--c:#4d6b62">under water: solved</span>
  <span style="--c:#c4634a">buoy: missed, though under water</span>
  <span style="--c:#b9ad98">dry stone: missed</span>
  <span style="--c:#7a6248">wet stone above water: solved, an island</span>
  <button class="back" id="back" hidden>Back to its level</button>
  <span class="k">Drag the waterline or the brass index, or ↑ ↓ · ← → configuration · Space A / B · click a stone</span>
</div>
<div class="tag" id="gauge"></div>
<div class="tag" id="tip"></div>
<div class="card" id="card"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const fail = e => { $('err').textContent += (e && (e.stack || e.message || e.reason) || e) + '\n'; console.error(e); };
window.addEventListener('error', e => fail(e.error || e.message));
window.addEventListener('unhandledrejection', e => fail(e.reason));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

const DATA = await (await fetch('data.json')).json();
await Promise.race([Promise.all([document.fonts.load('400 40px Newsreader'), document.fonts.load('600 40px Archivo')]), new Promise(r => setTimeout(r, 2500))]);

// ------------------------------------------------------------------ the data: stones, heights, levels
const N = DATA.n, P = DATA.problems, ARMS = DATA.arms, ARM = Object.fromEntries(ARMS.map(a => [a.k, a]));
const COLS = 36, ROWS = 14, DX = 0.75, DZ = 0.8660254, RC = 0.43, BASE = 0.5, HS = 7.0, WALL = 8.15;
const X0 = -(COLS - 1) / 2 * DX, Z0 = (ROWS - 1) / 2 * DZ + DZ / 4, XI = -X0 + 0.66, ZI = Z0 + 0.6;
const pos = new Int32Array(N); DATA.rank.forEach((i, j) => { pos[i] = j; });
const cellOf = i => { const j = pos[i], c = Math.floor(j / ROWS), r = j % ROWS; return { c, r, x: X0 + c * DX, z: Z0 - r * DZ - (c & 1 ? DZ / 2 : 0) }; };
const CELL = P.map((_, i) => cellOf(i));
const topY = h => BASE + h * HS;
for (const a of ARMS) {                                   // heights with this configuration left out, and its level
  a.x = Int8Array.from(a.r, ch => ch === '-' ? -1 : +ch);
  a.h = Float32Array.from(P, (p, i) => a.single && a.x[i] >= 0 ? 1 - (p.s - a.x[i]) / (p.n - 1) : 1 - p.s / p.n);
  const hs = [...new Set(a.h)].sort((u, v) => u - v);
  let best = null;
  for (const t of [-1, ...hs]) { let u = 0; for (let i = 0; i < N; i++) if (a.h[i] <= t + 1e-6) u++; if (!best || Math.abs(u - a.total) < Math.abs(best.u - a.total)) best = { t, u }; }
  const k = hs.indexOf(best.t), next = k + 1 < hs.length ? hs[k + 1] : best.t + 0.03;
  a.y = best.t < 0 ? BASE * 0.5 : topY((best.t + next) / 2);
  const c = count(a, a.y);
  if (c.under !== a.under || c.islands !== a.islands || c.buoys !== a.buoys || a.x.reduce((s, v) => s + (v > 0), 0) !== a.total)
    fail(`${a.k}: the page counts ${c.under}/${c.islands}/${c.buoys}, data.json stores ${a.under}/${a.islands}/${a.buoys}`);
}
function count(a, y) {                                    // stones under a water surface at y, and the two kinds of exception
  let under = 0, islands = 0, buoys = 0;
  for (let i = 0; i < N; i++) { const u = topY(a.h[i]) < y; if (u) under++; if (a.x[i] === 1 && !u) islands++; if (a.x[i] === 0 && u) buoys++; }
  return { under, islands, buoys };
}

// ------------------------------------------------------------------ state, in the address
const S = { a: 'rl_plain_s0', b: 'base_cue_s0', on: 'a', hand: null, sel: null, yaw: null, pitch: 0.3, zoom: 1 };
function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (ARM[q.get('a')]) S.a = q.get('a'); if (ARM[q.get('b')]) S.b = q.get('b');
  S.on = q.get('on') === 'b' ? 'b' : 'a';
  S.hand = q.has('y') && isFinite(+q.get('y')) ? clamp(+q.get('y'), 0.12, WALL - 0.35) : null;
  S.sel = q.has('p') && P[+q.get('p')] ? +q.get('p') : null;
  if (q.has('v')) { const v = q.get('v').split(',').map(Number); if (v.length === 3 && v.every(isFinite)) { S.yaw = clamp(v[0], -1.5, 1.5); S.pitch = clamp(v[1], 0.1, 1.2); S.zoom = clamp(v[2], 0.42, 1.25); } }
}
let hashT = 0;
function toHash() {
  clearTimeout(hashT);
  hashT = setTimeout(() => {
    const q = [`a=${S.a}`, `b=${S.b}`, `on=${S.on}`];
    if (S.hand != null) q.push(`y=${S.hand.toFixed(2)}`); if (S.sel != null) q.push(`p=${S.sel}`);
    if (viewTouched) q.push(`v=${S.yaw.toFixed(2)},${S.pitch.toFixed(2)},${S.zoom.toFixed(2)}`);
    history.replaceState(null, '', '#' + q.join('&'));
  }, 200);
}
fromHash();
const arm = () => ARM[S[S.on]];
let viewTouched = S.yaw != null;

// ------------------------------------------------------------------ renderer, targets
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false;
renderer.autoClear = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(27, 1, 2, 1200);
const HF = THREE.HalfFloatType;
const rtMain = new THREE.WebGLRenderTarget(4, 4);
const rtRefr = new THREE.WebGLRenderTarget(4, 4, { type: HF, depthTexture: new THREE.DepthTexture(4, 4) });
const rtRefl = new THREE.WebGLRenderTarget(4, 4, { type: HF });

// one tiling noise texture carries every surface: r mottling, g speckle, b fine grain, a slow bands
function noiseTexture() {
  const n = 256, d = new Uint8Array(n * n * 4), rnd = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const layer = p => { const g = Float32Array.from({ length: p * p }, rnd); return (x, y) => {
    const fx = x * p / n, fy = y * p / n, x0 = Math.floor(fx), y0 = Math.floor(fy); let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const v = (i, j) => g[(j % p) * p + (i % p)];
    return (v(x0, y0) * (1 - tx) + v(x0 + 1, y0) * tx) * (1 - ty) + (v(x0, y0 + 1) * (1 - tx) + v(x0 + 1, y0 + 1) * tx) * ty; }; };
  const r = [layer(4), layer(9), layer(19)], g = layer(64), b = layer(128), a = [layer(5), layer(11), layer(23)];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const o = (y * n + x) * 4;
    d[o] = 255 * (0.5 * r[0](x, y) + 0.3 * r[1](x, y) + 0.2 * r[2](x, y)); d[o + 1] = 255 * g(x, y); d[o + 2] = 255 * b(x, y);
    d[o + 3] = 255 * (0.5 * a[0](x, y) + 0.3 * a[1](x, y) + 0.2 * a[2](x, y));
  }
  const t = new THREE.DataTexture(d, n, n, THREE.RGBAFormat); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true; return t;
}
const KEY = new THREE.Vector3(-0.52, 0.74, 0.43).normalize();      // direction to the key light
const U = {
  uNoise: { value: noiseTexture() }, uLevel: { value: 3 }, uTime: { value: 0 }, uSim: { value: null }, uCells: { value: null },
  uAtlas: { value: null }, uAbs: { value: new THREE.Vector3(0.25, 0.15, 0.17) }, uKey: { value: KEY }, uFloorY: { value: -100 },
};

// ------------------------------------------------------------------ GLSL shared by several shaders
const GLSL_ROOM = `
vec3 room(vec3 d) {                       // the studio the basin stands in: dark walls, one large softbox, a strip and a rim
  float up = d.y;
  vec3 c = mix(vec3(0.012, 0.011, 0.010), vec3(0.040, 0.037, 0.034), smoothstep(-0.25, 0.55, up));
  c += vec3(0.050, 0.045, 0.038) * exp(-8.0 * (pow(d.x + 0.05, 2.0) * 0.45 + pow(d.y - 0.02, 2.0) * 2.6)) * step(d.z, 0.0);
  vec3 k = normalize(vec3(-0.52, 0.74, 0.43)), ku = normalize(cross(vec3(0.0, 1.0, 0.0), k)), kv = cross(k, ku);
  float w = dot(d, k);
  if (w > 0.0) { vec2 q = vec2(dot(d, ku), dot(d, kv)) / w; vec2 e = smoothstep(vec2(0.62, 0.40), vec2(0.52, 0.32), abs(q)); c += vec3(9.0, 8.3, 7.2) * e.x * e.y * (0.8 + 0.2 * smoothstep(0.5, 0.0, length(q))); }
  vec3 f = normalize(vec3(0.85, 0.30, 0.42)), fu = normalize(cross(vec3(0.0, 1.0, 0.0), f)), fv = cross(f, fu);
  w = dot(d, f);
  if (w > 0.0) { vec2 q = vec2(dot(d, fu), dot(d, fv)) / w; vec2 e = smoothstep(vec2(0.16, 0.75), vec2(0.12, 0.6), abs(q)); c += vec3(1.5, 1.7, 1.9) * e.x * e.y; }
  float el = asin(clamp(d.y, -1.0, 1.0));                         // a light wash on the wall behind the set
  c += vec3(1.12, 1.17, 1.22) * smoothstep(0.07, 0.45, el) * smoothstep(1.0, 0.5, el) * smoothstep(-0.55, 0.6, -d.z);
  vec3 b = normalize(vec3(-0.15, 0.30, 1.0)), bu = normalize(cross(vec3(0.0, 1.0, 0.0), b)), bv = cross(b, bu);
  w = dot(d, b);
  if (w > 0.0) { vec2 q = vec2(dot(d, bu), dot(d, bv)) / w; vec2 e = smoothstep(vec2(1.1, 0.5), vec2(0.6, 0.2), abs(q)); c += vec3(0.42, 0.40, 0.37) * e.x * e.y; }
  return c;

  const r = setRay(e.clientX, e.clientY); down = { x: e.clientX, y: e.clientY, moved: false };
  if (levelGrab(r)) { dragLevel = true; const f = frontHit(r); grabDy = Math.abs(f.y - level) < 0.45 ? level - f.y : 0; setHand(clamp(f.y + grabDy, 0.12, WALL - 0.35)); canvas.className = 'level'; }
  else { dragOrbit = true; }
  lastMove = { x: e.clientX, y: e.clientY }; need = true;
});
canvas.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, e);
  if (pts.size === 2) { const [p, q] = [...pts.values()], d = Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY); if (pinch) { S.zoom = clamp(S.zoom * pinch / d, 0.42, 1.25); viewTouched = true; toHash(); } pinch = d; need = true; return; }
  const r = setRay(e.clientX, e.clientY);
  if (dragLevel) { const f = frontHit(r); if (f) setHand(clamp(f.y + grabDy, 0.12, WALL - 0.35)); }
  else if (dragOrbit && down) {
    const dx = e.clientX - lastMove.x, dy = e.clientY - lastMove.y;
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down.moved = true; canvas.className = 'orbit'; }
    if (down.moved) { yawV = -dx * 0.0032 * 60; pitchV = dy * 0.0028 * 60; S.yaw += -dx * 0.0032; S.pitch += dy * 0.0028; limits(); viewTouched = true; toHash(); }
  } else {
    const g = levelGrab(r), i = g ? -1 : pickStone(r); hover = i; canvas.className = g ? 'level' : i >= 0 ? 'pick' : '';
    showTip(i, e.clientX, e.clientY);
    const wh = waterHit(r); if (wh && lastMove && !still) { const sp = Math.hypot(e.clientX - lastMove.x, e.clientY - lastMove.y); if (sp > 1.5 && drops.length < 12) drops.push([wh.x, wh.z, 0.3, Math.min(0.05, sp * 0.004)]); }
  }
  lastMove = { x: e.clientX, y: e.clientY }; need = true;
});
const up = e => {
  pts.delete(e.pointerId); pinch = 0;
  if (dragLevel) { dragLevel = false; canvas.className = ''; }
  else if (dragOrbit && down && !down.moved) { const i = pickStone(setRay(e.clientX, e.clientY)); select(i >= 0 ? i : null); yawV = pitchV = 0; }
  dragOrbit = false; down = null; if (canvas.className === 'orbit') canvas.className = ''; need = true;
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('pointerleave', () => { hover = -1; showTip(-1); need = true; });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const z0 = S.zoom; S.zoom = clamp(S.zoom * Math.exp(e.deltaY * 0.0011), 0.42, 1.25);
  const r = setRay(e.clientX, e.clientY), t = (3.3 - r.origin.y) / r.direction.y;
  if (S.zoom < z0 && t > 0) { V3.copy(r.direction).multiplyScalar(t).add(r.origin); V3.x = clamp(V3.x, -XI, XI); V3.z = clamp(V3.z, -ZI, ZI); V3.y = 3.3; target.lerp(V3, 0.22); }
  viewTouched = true; toHash(); need = true;
}, { passive: false });
function limits() { S.yaw = clamp(S.yaw, -1.45, 1.45); S.pitch = clamp(S.pitch, 0.17, 1.15); }

// ------------------------------------------------------------------ the page around the basin
function setHand(y) { S.hand = y; levelT = y; paint(); toHash(); need = true; }
function setArm(k, slot) { if (slot) S.on = slot; S[S.on] = k; S.hand = null; setTargets(); drawWall(); paint(); toHash(); need = true; if (still) snap(); }
function toggle(slot) { S.on = slot || (S.on === 'a' ? 'b' : 'a'); S.hand = null; setTargets(); drawWall(); paint(); toHash(); need = true; if (still) snap(); }
function select(i) { const was = S.sel != null; S.sel = i; paintCard(); if (was !== (i != null)) fit(); toHash(); need = true; }
const short = n => n.replace(' (Olmo 3.1 RL-Zero-Math)', '');
function paint() {
  const a = arm(), hand = S.hand != null && Math.abs(S.hand - a.y) > 0.02, c = count(a, hand ? S.hand : a.y), out = a.islands + a.buoys;
  $('line').innerHTML = `${esc(a.name)} solves <b>${a.total}</b> of ${N}. One water level on one shared order of difficulty puts all but <b>${out}</b> stones on the right side.`;
  $('slots').innerHTML = ['a', 'b'].map(s => `<button data-s="${s}" aria-pressed="${S.on === s}"><u>${s.toUpperCase()}</u><span>${esc(ARM[S[s]].name)}</span><em>${ARM[S[s]].total}</em></button>`).join('');
  $('nums').innerHTML = `<div><strong>${a.total}</strong>solves</div><div><strong>${c.under}</strong>under water</div><div class="is"><strong>${c.islands}</strong>islands</div><div class="bu"><strong>${c.buoys}</strong>buoys</div>`;
  const A = ARM[S.a], B = ARM[S.b]; let diff = 0; for (let i = 0; i < N; i++) if (A.x[i] !== B.x[i]) diff++;
  $('note').innerHTML = hand
    ? `By hand: at this level <b>${c.islands + c.buoys}</b> stones are on the wrong side. At its own level, where ${a.under} stones are under water, it is <b>${out}</b>.`
    : (a.resample ? `A second sample of this same configuration answers <b>${a.resample}</b> problems differently, on average over its 4 samples: more than the ${out} that break the order. ` : '')
      + (S.a !== S.b ? `A and B differ on <b>${diff}</b> problems.` : '');
  $('back').hidden = !hand;
  for (const b of $('list').querySelectorAll('button')) { b.classList.toggle('on', b.dataset.k === S[S.on]); b.classList.toggle('a', b.dataset.k === S.a); b.classList.toggle('b', b.dataset.k === S.b); }
  $('pick').value = S[S.on];
  paintCard();
}
{ let h = '';
  const groups = [...new Set(ARMS.map(a => a.group))];
  for (const gr of groups) { h += `<h3>${esc(gr)}</h3>`; for (const a of ARMS.filter(x => x.group === gr)) h += `<button data-k="${a.k}" title="${esc(a.name)}"><span>${esc(short(a.name))}</span><em>${a.total}</em><i>${a.islands + a.buoys}</i></button>`; }
  $('list').innerHTML = h;
  $('pick').innerHTML = groups.map(gr => `<optgroup label="${esc(gr)}">${ARMS.filter(x => x.group === gr).map(a => `<option value="${a.k}">${esc(a.name)} · ${a.total}</option>`).join('')}</optgroup>`).join('');
  $('def').innerHTML = `A stone's height is the share of the other ${DATA.singles - 1} single-sample configurations that miss its problem. The water stands where as many stones are under it as the configuration solves. `
    + `Out of order: an island (solved, above the water) or a buoy (missed, under it). Grader ${esc(DATA.grader)}, ${esc(DATA.sampling)}. `
    + `<a href="${esc(DATA.src.finding)}">The finding</a> · ${esc(DATA.src.vectors)}`; }
$('list').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setArm(b.dataset.k); });
$('slots').addEventListener('click', e => { const b = e.target.closest('button'); if (b) toggle(b.dataset.s); });
$('pick').addEventListener('change', e => setArm(e.target.value));
$('back').addEventListener('click', () => { S.hand = null; setTargets(); paint(); toHash(); need = true; });
function mathHTML(el) { if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true }, { left: '$', right: '$', display: false }, { left: '\\(', right: '\\)', display: false }], throwOnError: false }); }
let cardFor = -2;
function paintCard() {
  const card = $('card'), i = S.sel; card.classList.toggle('on', i != null); if (i == null) { cardFor = -2; return; }
  const p = P[i], row = (s, k) => { const a = ARM[k], x = a.x[i], u = topY(a.h[i]) < a.y;
    const txt = x < 0 ? 'not run' : x ? (u ? 'solves it' : 'solves it: an island') : (u ? 'misses it: a buoy' : 'misses it');
    return `<u>${s}</u><span>${esc(a.name)}</span><em class="${x < 0 ? '' : x ? (u ? 'r' : 'x') : 'w'}">${txt}</em>`; };
  const ab = `<div class="ab">${row('A', S.a)}${row('B', S.b)}</div>`;
  if (cardFor === i) { card.querySelector('.ab').outerHTML = ab; return; }
  cardFor = i;
  const solvers = ARMS.filter(a => a.x[i] === 1), miss = ARMS.filter(a => a.x[i] === 0);
  const fewer = solvers.length <= miss.length ? ['Solved only by', solvers] : ['Missed by', miss];
  let lastG = null; const ticks = ARMS.map(a => { const g = a.group !== lastG; lastG = a.group; return `<u class="${a.x[i] === 1 ? 'r' : a.x[i] < 0 ? 'n' : ''}${g ? ' g' : ''}" title="${esc(a.name)}"></u>`; }).join('');
  card.innerHTML = `<div class="hd"><span>${esc(DATA.subjects[p.sub])} · level ${p.lvl}</span><button id="close" aria-label="Close">Close</button></div><div class="pid">MATH-500 · ${esc(p.id)}</div>
    <div class="q" id="q"></div><div class="ans">Answer key: <b id="ak"></b></div>${ab}
    <div class="by"><b>${p.s}</b> of the ${p.n} single-sample configurations solve it; stone ${pos[i] + 1} of ${N} from the easy end.
    <div class="ticks">${ticks}</div><div class="who">${fewer[1].length ? `${fewer[0]}: ${fewer[1].map(a => esc(short(a.name))).join('; ')}.` : 'No configuration solves it.'}</div></div>`;
  $('q').textContent = p.t; $('ak').textContent = '$' + p.a + '$'; mathHTML($('q')); mathHTML($('ak'));
  $('close').addEventListener('click', () => select(null)); card.scrollTop = 0;
}
function showTip(i, x, y) {
  const t = $('tip'); if (i < 0) { t.classList.remove('on'); return; }
  const p = P[i], a = arm(), st = a.x[i] < 0 ? 'not run' : a.x[i] ? 'solved' : 'missed';
  t.innerHTML = `${esc(DATA.subjects[p.sub])}, level ${p.lvl} · ${st}<small>${p.s} of ${p.n} solve it</small>`;
  t.style.transform = `translate(${Math.min(x + 16, W - 190)}px, ${y + 18}px)`; t.classList.add('on');
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  const a = arm(), k = e.key;
  if (k === 'ArrowUp' || k === 'ArrowDown') {               // one tier of stones at a time
    const ys = [...new Set(Array.from(a.h, topY))].sort((u, v) => u - v), cur = S.hand != null ? S.hand : a.y;
    const mids = [BASE * 0.5, ...ys.map((y, j) => j + 1 < ys.length ? (y + ys[j + 1]) / 2 : y + 0.1)];
    const nx = k === 'ArrowUp' ? mids.find(m => m > cur + 0.01) : [...mids].reverse().find(m => m < cur - 0.01);
    if (nx != null) setHand(nx); if (still) snap();
  } else if (k === 'ArrowLeft' || k === 'ArrowRight') { const j = ARMS.indexOf(a) + (k === 'ArrowRight' ? 1 : -1); setArm(ARMS[(j + ARMS.length) % ARMS.length].k);
    const b = $('list').querySelector('button.on'); if (b) b.scrollIntoView({ block: 'nearest' });
  } else if (k === ' ') toggle();
  else if (k === 'Enter' || k === 'Home') { S.hand = null; setTargets(); paint(); toHash(); if (still) snap(); }
  else if (k === 'Escape') select(null);
  else return;
  e.preventDefault(); need = true;
});
addEventListener('hashchange', () => { fromHash(); setTargets(); drawWall(); paint(); fit(); need = true; });

// ------------------------------------------------------------------ the frame
const reflCam = new THREE.PerspectiveCamera(), clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), NONE = [];
const gp = new THREE.Vector3();
let need = true, last = performance.now(), time = 0, gaugeN = -1, moving = false, shadowN = 0;
function frame(now) {
  const dt = still ? 0.016 : Math.min(0.05, (now - last) / 1000); last = now; time += still ? 0 : dt; U.uTime.value = time;
  if (!dragOrbit) { S.yaw += yawV * dt; S.pitch += pitchV * dt; const f = Math.exp(-dt * 5.5); yawV *= f; pitchV *= f; limits(); }
  if (S.zoom > 0.98) target.lerp(CENTER, 1 - Math.exp(-dt * 3));
  if (still) snap(); else animate(dt, time);
  upload(time);
  { const k = still ? 1 : 1 - Math.exp(-dt * 5); curDist += (fitDist - curDist) * k;
    if (Math.abs(offGX - offX) + Math.abs(offGY - offY) > 0.3) { offX += (offGX - offX) * k; offY += (offGY - offY) * k; camera.setViewOffset(W, H, offX, offY, W, H); camera.updateProjectionMatrix(); } }
  let dist = curDist * S.zoom; place(dist);
  if (camera.position.y < level + 1.2) { S.pitch = Math.min(1.15, Math.asin(clamp((level + 1.2 - target.y) / dist, -1, 1)) + 0.001); place(dist); }

  if (!still) simStep(); else if (!U.uSim.value) simStep();
  renderer.shadowMap.needsUpdate = moving || shadowN < 3; if (renderer.shadowMap.needsUpdate) shadowN++;
  camera.layers.set(0); camera.layers.enable(2);
  renderer.setRenderTarget(rtRefr); renderer.render(scene, camera);          // everything but the water, with its depth
  renderer.shadowMap.needsUpdate = false;
  reflCam.copy(camera); reflCam.layers.set(0);                                                       // the mirror image above the water, at half size
  reflCam.position.set(camera.position.x, 2 * level - camera.position.y, camera.position.z);
  reflCam.up.set(0, -1, 0); V3.set(target.x, 2 * level - target.y, target.z); reflCam.lookAt(V3);
  reflCam.projectionMatrix.copy(camera.projectionMatrix); reflCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  reflCam.updateMatrixWorld(); reflCam.matrixWorldInverse.copy(reflCam.matrixWorld).invert();
  reflVP.multiplyMatrices(reflCam.projectionMatrix, reflCam.matrixWorldInverse);
  clipPlane.constant = -level + 0.02; renderer.clippingPlanes = [clipPlane]; U.uFloorY.value = level - 0.05;
  renderer.setRenderTarget(rtRefl); renderer.render(scene, reflCam);
  renderer.clippingPlanes = NONE; U.uFloorY.value = -100;
  quad.material = copyMat; renderer.setRenderTarget(rtMain); renderer.render(quadScene, quadCam);   // that picture again, then the water and the glass over it
  renderer.autoClear = false; camera.layers.set(1); renderer.render(scene, camera); renderer.autoClear = true;
  quad.material = postMat; renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);

  // the count at the index
  gp.set(SX + 1.2, level + 0.2, SZ + 0.1).project(camera);
  const c = count(arm(), level);
  if (c.under !== gaugeN) { gaugeN = c.under; $('gauge').innerHTML = `<strong>${c.under}</strong><small>stones under water</small>`; }
  $('gauge').style.opacity = W > 760 && (gp.x * 0.5 + 0.5) * W < 384 ? 0 : 1;
  $('gauge').style.transform = `translate(${((gp.x * 0.5 + 0.5) * W).toFixed(1)}px, ${((-gp.y * 0.5 + 0.5) * H - 54).toFixed(1)}px)`;
  if (!still) requestAnimationFrame(frame);
}
resize(); drawWall(); paint(); snap();
if (still) { const once = () => { if (need) { need = false; frame(performance.now()); } requestAnimationFrame(once); }; once(); }
else requestAnimationFrame(frame);
addEventListener('load', () => { if (S.sel != null) { cardFor = -2; paintCard(); } });
</script>
