<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invariant: Problem field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:opsz,wght@6..72,300..500&display=swap">
<style>
:root {
  color-scheme: dark;
  --paper: #0d0c0b; --sheet: #191816; --ink: #ebe6da; --mute: #a39d90; --faint: #7f796d; --rule: #2c2a26;
  --blue: #9db0d0; --red: #cf7058; --serif: "Newsreader", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); background: var(--paper);
  font: 400 14px/1.45 "Archivo", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 3px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.col {
  position: fixed; left: 40px; top: 22px; width: 348px; z-index: 3; pointer-events: none;
  text-shadow: 0 0 18px var(--paper), 0 0 6px var(--paper);
}
.col > * { pointer-events: auto; }
.top { display: flex; align-items: center; gap: 14px; font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.name { font-weight: 700; font-stretch: 118%; font-size: 14px; letter-spacing: .03em; }
.top .page { color: var(--mute); }
.sets { margin-left: auto; display: flex; gap: 14px; }
.sets button { color: var(--mute); }
.sets button[aria-pressed="true"] { color: var(--ink); font-weight: 600; box-shadow: 0 1px 0 var(--blue); }
h1 { font-family: var(--serif); font-weight: 300; font-size: 30px; line-height: 1.16; letter-spacing: -.005em; margin: 24px 0 12px; text-wrap: balance; }
h1 b { font-weight: 400; font-style: italic; }
h1 .b { color: var(--blue); } h1 .a { color: var(--red); }
.cap { color: var(--mute); margin: 0 0 18px; font-size: 13px; }
.pick { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 0 8px; border-top: 1px solid var(--rule); padding: 9px 0; }
.pick .l { font-weight: 700; font-size: 13px; }
.pick.a .l { color: var(--red); } .pick.b .l { color: var(--blue); }
.pick select {
  width: 100%; background: transparent; border: 0; padding: 2px 18px 2px 0; font-size: 14px; font-weight: 520; cursor: pointer;
  appearance: none; -webkit-appearance: none; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
  background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%);
  background-position: calc(100% - 9px) 55%, calc(100% - 4px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
}
.pick select option, .pick select optgroup { background: var(--sheet); color: var(--ink); font-weight: 400; }
.pick .sub { grid-column: 2; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows { border-top: 1px solid var(--rule); margin: 0; padding: 8px 0 0; }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13px; }
.rows dt { color: var(--mute); } .rows dd { margin: 0; text-align: right; font-weight: 520; }
.rows .bad { color: var(--red); }
.swap { color: var(--mute); font-size: 12px; margin-top: 8px; }
.swap:hover { color: var(--ink); }

.time { position: fixed; left: 40px; right: 40px; bottom: 18px; z-index: 3; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.play {
  grid-row: 1 / 3; height: 36px; padding: 0 16px 0 14px; border-radius: 2px; font-weight: 560; font-size: 13px; color: var(--ink);
  border: 1px solid var(--faint); background: var(--paper); display: flex; align-items: center; gap: 10px; transition: border-color .2s;
}
.play:hover { border-color: var(--ink); }
.play i { width: 0; height: 0; border-left: 8px solid var(--ink); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.play.on i { width: 8px; height: 10px; border: 0; border-left: 2.5px solid var(--ink); border-right: 2.5px solid var(--ink); }
.ticks { position: relative; height: 30px; cursor: pointer; touch-action: none; }
.ticks::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); }
.ticks u { position: absolute; top: 50%; width: 1px; height: 9px; margin-top: -4px; background: var(--faint); opacity: .7; }
.ticks u.g { height: 15px; margin-top: -7px; opacity: 1; }
.ticks .mb, .ticks .ma { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5px; border-radius: 50%; transition: left .25s cubic-bezier(.3,0,.2,1); }
.ticks .mb { background: var(--blue); box-shadow: 0 0 0 3px var(--paper); }
.ticks .ma { border: 1.5px solid var(--red); background: var(--paper); }
.tl { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; }
.tl b { color: var(--ink); font-weight: 520; }

.key { position: fixed; right: 40px; top: 24px; z-index: 3; color: var(--mute); font-size: 12px; text-align: right; line-height: 1.7; pointer-events: none; }
.key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 7px; vertical-align: -1px; }
.key .live::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); margin-left: 9px; vertical-align: 1px; }

.card {
  position: fixed; z-index: 5; width: 340px; padding: 14px 16px 13px; pointer-events: none; opacity: 0; transition: opacity .15s;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; box-shadow: 0 12px 34px rgba(0,0,0,.45); user-select: text;
}
.card.on { opacity: 1; } .card.pin { pointer-events: auto; border-color: var(--faint); }
.card .id { color: var(--mute); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
.card .tx { margin: 8px 0 10px; font-family: var(--serif); font-size: 15px; line-height: 1.36; overflow-wrap: anywhere; }
.card .g, .card .r { display: grid; grid-template-columns: 18px 1fr; gap: 0 6px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--rule); }
.card .r .l { font-weight: 700; } .card .r.a .l { color: var(--red); } .card .r.b .l { color: var(--blue); }
.card .r span, .card .g span, .card .f { color: var(--mute); }
.card .ok { color: var(--ink); font-weight: 600; } .card .no { color: var(--red); font-weight: 600; }
.card .f { font-size: 12px; padding-top: 6px; border-top: 1px solid var(--rule); }
.tip { position: fixed; z-index: 6; pointer-events: none; font-size: 12px; background: var(--sheet); border: 1px solid var(--rule); padding: 4px 8px; border-radius: 2px; transform: translate(-50%, -130%); white-space: nowrap; opacity: 0; }
#err { position: fixed; left: 40px; bottom: 80px; z-index: 9; color: var(--red); font-size: 12px; white-space: pre-wrap; max-width: 70vw; }

@media (max-width: 900px) {
  .col { left: 16px; right: 16px; top: 12px; width: auto; }
  h1 { font-size: 19px; margin: 12px 0 6px; } .cap, .rows, .key, .swap { display: none; }
  .pick { padding: 5px 0; } .pick .sub { display: none; }
  .time { left: 16px; right: 16px; bottom: 12px; } .tl span { display: none; } .tl { justify-content: center; }
  .card { width: min(340px, calc(100vw - 32px)); }
}
</style>

<body>
<canvas id="c"></canvas>

<div class="col">
  <div class="top"><span class="name">Invariant</span><span class="page">Problem field</span>
    <span class="sets"><button data-set="hard328" aria-pressed="true">The 328</button><button data-set="math500" aria-pressed="false">MATH-500</button></span></div>

  <p class="cap" id="cap"></p>
  <div class="pick a"><span class="l">A</span><select id="selA" aria-label="Configuration A"></select><span class="sub" id="subA"></span></div>
  <div class="pick b"><span class="l">B</span><select id="selB" aria-label="Configuration B"></select><span class="sub" id="subB"></span></div>
  <dl class="rows" id="rows"></dl>
  <button class="swap" id="swap">Swap A and B</button>
</div>

<div class="key" id="key"></div>
<div id="labs"></div>

<div class="time">
  <button class="play" id="play"><i></i><span>Replay in run order</span></button>
  <div class="ticks" id="ticks"></div>
  <div class="tl"><span id="t0"></span><b id="tc"></b><span id="t1"></span></div>
</div>
<div class="card" id="card"></div>
<div class="tip" id="tip"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const $ = id => document.getElementById(id);
const fail = e => { $('err').textContent += (e && (e.stack || e.message || e.reason) || e) + '\n'; };
window.addEventListener('error', e => fail(e.error || e.message));
window.addEventListener('unhandledrejection', e => fail(e.reason));
const fmt = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MON = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const whenText = w => w ? `${MON[+w.slice(0, 2)]} ${+w.slice(2, 4)}, ${w.slice(5, 7)}:${w.slice(7, 9)}` : 'time not stored';

const DATA = await (await fetch('data.json')).json();
await Promise.race([Promise.all([document.fonts.load('300 216px Newsreader'), document.fonts.load('500 46px Archivo')]), new Promise(r => setTimeout(r, 2500))]);

// ------------------------------------------------------------------ the five basins (world units; y is up)
const BOTH = 0, ONLYA = 1, ONLYB = 2, NONE = 3, CAP = 4;
const BASIN = [
  { x: 0, z: -3.5, R: 3.7, name: 'Right under both', cls: '' },
  { x: -6.9, z: 1.0, R: 2.6, name: 'Right only under A', cls: 'a' },
  { x: 6.9, z: 1.0, R: 2.6, name: 'Right only under B', cls: 'b' },
  { x: -2.7, z: 5.0, R: 2.9, name: 'Wrong under both', cls: '' },
  { x: 3.4, z: 5.3, R: 2.6, name: 'Wrong under both, cap hit', cls: '' },
];
for (const b of BASIN) b.d = b.R * 0.36;
function floorAt(x, z, out) {           // height of the table and its gradient
  let h = 0, gx = 0, gz = 0;
  for (const b of BASIN) {
    const dx = x - b.x, dz = z - b.z, q = (dx * dx + dz * dz) / (b.R * b.R);
    if (q < 1) { h = -b.d * (1 - q); gx = 2 * b.d * dx / (b.R * b.R); gz = 2 * b.d * dz / (b.R * b.R); break; }
  }
  out.h = h; out.gx = gx; out.gz = gz;
}

const NOISE = `
float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z); }
float fbm(vec3 p) { return 0.5 * vn(p) + 0.3 * vn(p * 2.1 + 3.1) + 0.2 * vn(p * 4.3 + 7.7); }
`;

// The reference is a counting tray: beads of five materials in dishes ground into a dark stone slab.
// c: albedo (linear), r: roughness, cc: lacquer coat, band: growth lines of shell
const LOOK = [
  { c: [0.42, 0.385, 0.315], r: 0.34, cc: 0.4, band: 1 },      // right under both: shell
  { c: [0.27, 0.052, 0.034], r: 0.2, cc: 1, band: 0 },       // right only under A: cinnabar lacquer
  { c: [0.020, 0.040, 0.105], r: 0.18, cc: 1, band: 0 },       // right only under B: indigo lacquer
  { c: [0.085, 0.090, 0.097], r: 0.55, cc: 0.12, band: 0.25 }, // wrong under both: slate
  { c: [0.020, 0.019, 0.018], r: 0.92, cc: 0, band: 0 },      // cut off at the cap: raw basalt
];
const INLAY = ['#d9d0bd', '#b5452e', '#5d74a6', '#d9d0bd', '#d9d0bd'];

// ------------------------------------------------------------------ renderer and scene
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const BG = new THREE.Color('#0d0c0b');
scene.background = BG; scene.fog = new THREE.Fog(BG, 24, 53);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(36, 1, 0.5, 260);
camera.position.set(0.6, 14.2, 21.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, -0.4, 1.0); controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.3; controls.minDistance = 9; controls.maxDistance = 42;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.7; controls.panSpeed = 0.6;

const sun = new THREE.DirectionalLight('#fff0dc', 2.6);   // key, upper left
sun.position.set(-11, 17, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 12, bottom: -12, near: 4, far: 44 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 6;
const rim = new THREE.DirectionalLight('#cddcf2', 0.55); rim.position.set(10, 5, -14);   // rim, from behind
scene.add(sun, rim, new THREE.HemisphereLight('#aab4c0', '#1c1713', 0.42));              // soft fill

// the slab: dark soapstone with five ground dishes, a fine inlaid line at each rim, and the counts printed on the stone
const decals = [];
{
  const g = new THREE.PlaneGeometry(26, 21, 312, 252); g.rotateX(-Math.PI / 2); g.translate(0, 0, 0.4);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), o = {};
  const lo = new THREE.Color().setRGB(0.021, 0.019, 0.017), hi = new THREE.Color().setRGB(0.046, 0.041, 0.036), t = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    floorAt(p.getX(i), p.getZ(i), o); p.setY(i, o.h);
    let dep = 0; for (const b of BASIN) dep = Math.max(dep, -o.h / b.d * (o.h < 0 && Math.hypot(p.getX(i) - b.x, p.getZ(i) - b.z) < b.R ? 1 : 0));
    t.copy(lo).lerp(hi, Math.min(1, dep)); col.set([t.r, t.g, t.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const stone = sh => {
    sh.vertexShader = 'varying vec3 vTP;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvTP = position;');
    sh.fragmentShader = 'varying vec3 vTP;\n' + NOISE + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float sm = fbm(vec3(vTP.xz * 0.9, 1.0)), sg = vn(vec3(vTP.xz * 24.0, 4.0));
        float vein = smoothstep(0.012, 0.0, abs(fbm(vec3(vTP.xz * 0.45 + 5.0, 9.0)) - 0.5)) * smoothstep(0.45, 0.7, sm);
        diffuseColor.rgb *= (0.8 + 0.4 * sm) * (0.88 + 0.24 * sg); diffuseColor.rgb += vein * 0.012 * vec3(1.0, 0.94, 0.84);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = clamp(0.66 + (sg - 0.5) * 0.22 - smoothstep(-0.02, -0.14, vTP.y) * 0.32 - vein * 0.12, 0.05, 1.0);`);
  };
  const tm = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.6, metalness: 0.0, envMapIntensity: 0.55 }); tm.onBeforeCompile = stone;
  const table = new THREE.Mesh(g, tm); table.receiveShadow = true; scene.add(table);
  const sh = new THREE.Shape([[-300, -300], [300, -300], [300, 300], [-300, 300]].map(p => new THREE.Vector2(...p)));
  sh.holes.push(new THREE.Path([[-12.95, -10.05], [12.95, -10.05], [12.95, 10.85], [-12.95, 10.85]].map(p => new THREE.Vector2(...p))));
  const fm = new THREE.MeshPhysicalMaterial({ color: lo, roughness: 0.6, metalness: 0.0, envMapIntensity: 0.55, side: THREE.DoubleSide }); fm.onBeforeCompile = stone;
  const far = new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateX(Math.PI / 2), fm); far.position.y = -0.004; far.receiveShadow = true; scene.add(far);
  BASIN.forEach((b, k) => {
    for (const [s, op] of [[1, 0.5], [1.035, 0.16]]) {   // the inlaid line at the rim and a fainter one outside it
      const pts = []; for (let i = 0; i <= 200; i++) { const a = i / 200 * Math.PI * 2; pts.push(new THREE.Vector3(b.x + Math.cos(a) * b.R * s, 0.012, b.z + Math.sin(a) * b.R * s)); }
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: INLAY[k], transparent: true, opacity: op })));
    }
    // the count and the name, printed flat on the stone: behind the three far dishes, in front of the two near ones
    const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 360;
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(k <= ONLYB ? 7.4 : 5.0, (k <= ONLYB ? 7.4 * 1.5 : 5.0 * 1.15) * 360 / 1024).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
    m.position.set(b.x, 0.014, k <= ONLYB ? b.z - b.R - 1.75 : b.z + b.R + 1.15); scene.add(m);
    decals.push({ cv, tex, last: '' });
  });
}
function printLabel(k, count, name, dim) {
  const d = decals[k], key = count + '|' + name + '|' + dim; if (d.last === key) return; d.last = key;
  const c = d.cv.getContext('2d'); c.clearRect(0, 0, 1024, 360); c.textAlign = 'center'; c.globalAlpha = dim ? 0.4 : 0.92;
  c.fillStyle = k === ONLYA ? '#cf7058' : k === ONLYB ? '#9db0d0' : '#e6dfcf';
  c.font = `normal normal 300 ${dim ? 120 : 210}px Newsreader, Georgia, serif`; c.fillText(count, 512, dim ? 190 : 206);
  c.fillStyle = '#b9b2a2'; c.font = 'normal normal 500 54px Archivo, sans-serif'; if ('letterSpacing' in c) c.letterSpacing = '1px';
  c.fillText(name, 512, 318); d.tex.needsUpdate = true;
}

// ------------------------------------------------------------------ bodies: one instanced sphere per problem
const NMAX = 500;
const P = new Float32Array(NMAX * 3), Q = new Float32Array(NMAX * 3), V = new Float32Array(NMAX * 3);
const rad = new Float32Array(NMAX), radT = new Float32Array(NMAX), basin = new Int8Array(NMAX), transit = new Uint8Array(NMAX);
const delay = new Float32Array(NMAX), fly = new Float32Array(NMAX), offX = new Float32Array(NMAX), offZ = new Float32Array(NMAX), hov = new Float32Array(NMAX);
const curC = new Float32Array(NMAX * 3), curE = new Float32Array(NMAX * 4);
let N = 0, R0 = 0.2;

const mat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.3, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.07, envMapIntensity: 0.8 });
mat.onBeforeCompile = sh => {            // surface per bead: mottling, shell lines, speckle and pitting on the raw stones, occlusion from below
  sh.vertexShader = 'attribute vec4 aMat;\nvarying vec4 vMat;\nvarying vec3 vObj;\n' + sh.vertexShader
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvMat = aMat; vObj = position + vec3(float(gl_InstanceID) * 1.37, float(gl_InstanceID) * 0.71, 0.0);');
  sh.fragmentShader = 'varying vec4 vMat;\nvarying vec3 vObj;\n' + NOISE + sh.fragmentShader
    .replace('#include <color_fragment>', `#include <color_fragment>
      float nA = fbm(vObj * 2.2), sp = vn(vObj * 26.0);
      diffuseColor.rgb *= 0.84 + 0.32 * nA;
      diffuseColor.rgb *= 1.0 - vMat.z * 0.11 * smoothstep(0.3, 0.9, 0.5 + 0.5 * sin(vObj.y * 46.0 + nA * 14.0));
      diffuseColor.rgb *= 1.0 - (1.0 - vMat.y) * 0.42 * smoothstep(0.6, 0.85, sp);
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 1.5 + 0.035, vMat.w);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>

  tip.textContent = `${c.total} of ${S.n} · ${c.name}`; tip.style.left = Math.max(170, Math.min(W - 170, ev.clientX)) + 'px'; tip.style.top = tk.getBoundingClientRect().top + 'px'; tip.style.opacity = 1;
  if (scrub && c !== B && !ev.shiftKey) setPair(null, c);
});
tk.addEventListener('pointerup', () => scrub = false); tk.addEventListener('pointerleave', () => tip.style.opacity = 0);
addEventListener('keydown', ev => {
  if (ev.target.tagName === 'SELECT') return;
  const j = S.configs.indexOf(B);
  if (ev.key === 'ArrowRight' && j < S.configs.length - 1) { stop(); setPair(null, S.configs[j + 1]); }
  else if (ev.key === 'ArrowLeft' && j > 0) { stop(); setPair(null, S.configs[j - 1]); }
  else if (ev.key === ' ') { ev.preventDefault(); play(); }
  else if (ev.key === 'Escape') { pin = -1; showCard(hover); }
});

// the board, live: which posted result states each total
async function readBoard() { try { const r = await fetch('/data'); if (r.ok) { board = await r.json(); paint(); } } catch (e) { /* the page works from data.json without the board */ } }
readBoard(); setInterval(readBoard, 30000);
const reprint = () => { for (const d of decals) d.last = ''; if (S) paint(); };   // print again once the typefaces are in
document.fonts.ready.then(reprint); setTimeout(reprint, 3000);

// ------------------------------------------------------------------ frame
const m4 = new THREE.Matrix4(), clock = new THREE.Clock(); let acc = 0, T = 0, lastInput = 0, sway = 0, snap = false;
controls.addEventListener('start', () => lastInput = T);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function update() {
  const e = mesh.instanceMatrix.array;
  for (let i = 0; i < N; i++) {
    rad[i] += (radT[i] - rad[i]) * 0.08;
    const x = i * 3, L = LOOK[cls[i]], s = rad[i] * (i === hover || i === pin ? 1.18 : 1), o = i * 16;
    e[o] = s; e[o + 5] = s; e[o + 10] = s; e[o + 15] = 1; e[o + 12] = P[x]; e[o + 13] = P[x + 1]; e[o + 14] = P[x + 2];
    e[o + 1] = e[o + 2] = e[o + 3] = e[o + 4] = e[o + 6] = e[o + 7] = e[o + 8] = e[o + 9] = e[o + 11] = 0;
    const k = snap ? 1 : 0.07, m = i * 4;
    for (let c = 0; c < 3; c++) curC[x + c] += (L.c[c] - curC[x + c]) * k;
    curE[m] += (L.r - curE[m]) * k; curE[m + 1] += (L.cc - curE[m + 1]) * k; curE[m + 2] += (L.band - curE[m + 2]) * k;
    curE[m + 3] += ((i === hover || i === pin ? 1 : 0) - curE[m + 3]) * 0.2;
    // trail: shift the history, write segments that fade to the tail
    const h = i * TK * 3; trail.copyWithin(h + 3, h, h + (TK - 1) * 3); trail[h] = P[x]; trail[h + 1] = P[x + 1]; trail[h + 2] = P[x + 2];
    const f = fly[i] > 0.03 ? fly[i] : 0, q = i * (TK - 1) * 6;
    for (let j = 0; j < TK - 1; j++) {
      const a = h + j * 3, w = q + j * 6, g0 = f * (1 - j / (TK - 1)) * 0.16, g1 = f * (1 - (j + 1) / (TK - 1)) * 0.16;
      tPos[w] = trail[a]; tPos[w + 1] = trail[a + 1]; tPos[w + 2] = trail[a + 2]; tPos[w + 3] = trail[a + 3]; tPos[w + 4] = trail[a + 4]; tPos[w + 5] = trail[a + 5];
      tCol[w] = g0; tCol[w + 1] = 0.94 * g0; tCol[w + 2] = 0.84 * g0; tCol[w + 3] = g1; tCol[w + 4] = 0.94 * g1; tCol[w + 5] = 0.84 * g1;
    }
  }
  snap = false;
  mesh.instanceMatrix.needsUpdate = colAttr.needsUpdate = emAttr.needsUpdate = true;
  tGeo.attributes.position.needsUpdate = tGeo.attributes.color.needsUpdate = true;
}
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20); T += dt; acc += dt;
  let n = 0; while (acc > 1 / 120 && n < 4) { step(1 / 120); acc -= 1 / 120; n++; } if (n === 4) acc = 0;

  update();

  if (!still && held < 0 && T - lastInput > 4) {   // a slow sway while nobody steers
    const s2 = Math.sin(T * 0.21) * 0.085, d = s2 - sway; sway = s2;
    const ox = camera.position.x - controls.target.x, oz = camera.position.z - controls.target.z, c = Math.cos(d), s = Math.sin(d);
    camera.position.x = controls.target.x + ox * c - oz * s; camera.position.z = controls.target.z + ox * s + oz * c;
  }
  controls.update();
  bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target) - 0.5;
  if (!still) film.uniforms.t.value = T;
  composer.render();

  placeCard();
}
const q = new URLSearchParams(location.search);
loadSet(q.get('set') || 'hard328');
if (q.get('a') || q.get('b')) setPair(S.byKey[q.get('a')], S.byKey[q.get('b')]);
for (let i = 0, n = (+q.get('warm') || 0) * 120; i < n; i++) step(1 / 120);   // ?warm=<seconds> settles the bodies before the first frame
if (q.get('warm')) snap = true;
if (q.get('warm')) for (let i = 0; i < N; i++) for (let j = 0; j < TK; j++) trail.set([P[i * 3], P[i * 3 + 1], P[i * 3 + 2]], (i * TK + j) * 3);
if (q.get('then')) {                     // ?then=<key of B>&t=<seconds>: a later moment of a change, for a still
  update(); setPair(null, S.byKey[q.get('then')]);
  for (let i = 0, n = (+q.get('t') || 1) * 60; i < n; i++) { step(1 / 120); step(1 / 120); update(); }
}
for (let i = 0, n = +q.get('frames') || 0; i < n; i++) { step(1 / 120); step(1 / 120); update(); }
if (q.get('dbg')) { let m = 0, mx = 0; for (let i = 0; i < N; i++) { const v = Math.hypot(V[i * 3], V[i * 3 + 1], V[i * 3 + 2]); m += v / N; mx = Math.max(mx, v); } document.title = `speed mean ${m.toFixed(4)} max ${mx.toFixed(3)} transit ${transit.reduce((a, b) => a + b, 0)}`; }
if (q.get('pin')) { pin = +q.get('pin'); showCard(pin); }
frame();
</script>
