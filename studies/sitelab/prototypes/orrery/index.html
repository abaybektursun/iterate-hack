<style>

}

.col { position: fixed; left: 0; top: 0; bottom: 0; width: var(--col); padding: 22px 0 18px 40px; display: flex; flex-direction: column; pointer-events: none; }

.clock strong { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 34px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }

  line-height: 1.2; text-align: center; background: rgba(17, 15, 13, .9); border: 1px solid #3a342c; border-radius: 2px; padding: 3px 7px 2px; transition: opacity .2s; }
.tag:empty { display: none; }
.tag em { font-style: normal; display: inline; margin-left: 6px; font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--brass); font-variant-numeric: lining-nums; }
.tag.q { color: var(--mute); }

  text-align: left; max-width: 330px; white-space: normal; z-index: 3; }

.card { position: fixed; right: 28px; top: 24px; width: 390px; max-height: calc(100% - 60px); overflow-y: auto; background: rgba(24, 22, 20, .97); border: 1px solid var(--rule); border-radius: 3px; padding: 18px 20px 16px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .5); transform: translateY(-8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .7, .2, 1); scrollbar-width: thin; z-index: 4; }

.card .hd { display: flex; align-items: baseline; gap: 10px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--faint); }

.card .q { font-family: "Newsreader", Georgia, serif; font-size: 21px; line-height: 1.25; margin: 10px 0 8px; color: var(--ink); overflow-wrap: anywhere; }
.card p { margin: 0 0 10px; font-size: 13px; color: var(--mute); overflow-wrap: anywhere; }

.card .sc b { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 18px; line-height: 1.2; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.card .sc.base b { color: var(--brass); } .card .sc u { text-decoration: none; color: var(--ink); }
.card .by { font-size: 12px; color: var(--faint); padding-top: 9px; border-top: 1px solid var(--rule); }
.card .by b { color: var(--ink); font-weight: 500; }

  .shade { background: linear-gradient(180deg, rgba(16, 15, 14, .93), rgba(16, 15, 14, .8) 24%, rgba(16, 15, 14, 0) 40%, rgba(16, 15, 14, 0) 80%, rgba(16, 15, 14, .9)); }

  .card { left: 10px; right: 10px; width: auto; top: auto; bottom: 10px; max-height: 56%; }

<canvas id="c" aria-label="A brass orrery: one arm and one stone sphere per study, enamel beads for its board results, the RL score as the gilt sphere at the centre"></canvas>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const fail = e => { $('err').textContent += (e && (e.stack || e.message || e.reason) || e) + '\n'; console.error(e); };
window.addEventListener('error', e => fail(e.error || e.message));
window.addEventListener('unhandledrejection', e => fail(e.reason));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const ease = x => x * x * (3 - 2 * x);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = () => innerWidth <= 760;
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const DATA = await (await fetch('data.json')).json();
await Promise.all([document.fonts.load('500 40px Newsreader'), document.fonts.load('600 40px Archivo')]).catch(() => 0);

// ------------------------------------------------------------------ the data and its mappings
const T0 = DATA.t0, T1 = DATA.t1, SPAN = T1 - T0, HOURS = SPAN / 3.6e6, RL = DATA.rl.right;
const R_RL = 2.3, PER = 0.035, R_END = 5.4;                 // the RL ring, world units per problem short of RL, the end of an arm
const Y0 = 0.68, Y_ARM = Y0 + 1.5, Y_BODY = Y0 + 2.3;      // top of the dial plate, the arms, the centres of the spheres
const PHI0 = 120 * Math.PI / 180, SWEEP = 300 * Math.PI / 180;   // the carriage turns 300 degrees over the whole time
const W_IN = 0.004, W_MOVE = 0.012;                        // share of the time a body takes to arrive, a sphere to slide
const isBase = x => x[0] === 'base' && x[1] === 'MATH-500' && x[3] === 500;
const STONE = {   // one stone per study: its colour only tells the studies apart
  rlneurons: ['lapis', '#2a3c66'], theory: ['malachite', '#2f5c49'], cleanneurons: ['jasper', '#6f3128'], jspace: ['bone', '#cfc6b2'],
  autobench: ['tiger', '#7a5a2c'], basins: ['agate', '#757a7b'], sitelab: ['onyx', '#1f1e1d'] };
const ORDER = ['gpuprice', 'rlneurons', 'metaharness', 'cleanneurons', 'basins', 'jspace', 'autobench', 'theory', 'sitelab'];
const ENAMEL = ['#ddd5c2', '#7d3a2e', '#46586a', '#8a8371'];
const whoN = {}; for (const r of [...DATA.studies.flatMap(s => s.results), ...DATA.loose]) whoN[r.who] = (whoN[r.who] || 0) + 1;
const WHO = Object.keys(whoN).sort((a, b) => whoN[b] - whoN[a]);
const whoColor = w => ENAMEL[Math.min(WHO.indexOf(w), ENAMEL.length - 1)];
const moonR = n => 0.04 + 0.07 * Math.sqrt(n / 6000), planetR = n => 0.17 + 0.048 * Math.sqrt(n);

const studies = DATA.studies.slice().sort((a, b) => ORDER.indexOf(a.k) - ORDER.indexOf(b.k));
const bodies = [];   // everything that can be picked: {kind, mesh | instance, ...}
studies.forEach((s, i) => {
  s.local = (20 + 40 * (ORDER.includes(s.k) ? ORDER.indexOf(s.k) : i)) * Math.PI / 180;
  s.t = Math.max(T0, Math.min(s.first_commit, s.results.length ? s.results[0].t : Infinity));
  s.r = planetR(s.results.length);
  s.steps = []; let best = 0;
  for (const r of s.results) for (const x of r.sc) if (isBase(x) && x[2] > best) { best = x[2]; s.steps.push({ t: r.t, best, x, r }); }
  let ring = 0, slot = 0, cap = c => Math.floor(2 * Math.PI * (s.r + 0.28 + 0.24 * c) / 0.24);
  s.rings = [];
  for (const r of s.results) {
    if (slot >= cap(ring)) { ring++; slot = 0; }
    r.ring = ring; r.slot = slot++; r.study = s; s.rings[ring] = { rad: s.r + 0.28 + 0.24 * ring, n: slot, t: s.rings[ring] ? s.rings[ring].t : r.t };
  }
  for (const r of s.results) r.ang = 2 * Math.PI * r.slot / s.rings[r.ring].n + r.ring * 0.4;
});
const allResults = [...studies.flatMap(s => s.results), ...DATA.loose].sort((a, b) => a.t - b.t);
const bestAt = (s, t) => { let b = null; for (const st of s.steps) if (st.t <= t) b = st; return b; };
const arrived = (t0, t, w) => ease(clamp((t - t0) / (w * SPAN) + 1, 0, 1));
const radiusAt = (s, t) => { let R = R_END; for (const st of s.steps) R = lerp(R, R_RL + (RL - st.best) * PER, arrived(st.t, t, W_MOVE)); return R; };

// ------------------------------------------------------------------ renderer, room, light
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const BACK = new THREE.Color('#0b0a09');
scene.background = BACK; scene.fog = new THREE.Fog(BACK, 30, 64);
const camera = new THREE.PerspectiveCamera(27, 1, 1, 200);

function studio() {   // a photographer's room for the metal to reflect: one large softbox, a strip, a warm bounce
  const es = new THREE.Scene(), lit = (w, h, v, c = [1, 1, 1]) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c[0] * v, c[1] * v, c[2] * v), side: THREE.DoubleSide }));
  es.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.016, 0.014, 0.012), side: THREE.BackSide })));
  const key = lit(30, 22, 6.5, [1, 0.95, 0.87]); key.position.set(-16, 26, 12); key.lookAt(0, 0, 0);
  const top = lit(46, 30, 1.5, [1, 0.96, 0.9]); top.position.set(4, 34, -22); top.lookAt(0, 0, 0); es.add(top);
  const strip = lit(5, 30, 3.2, [0.86, 0.92, 1]); strip.position.set(30, 10, -6); strip.lookAt(0, 2, 0);
  const back = lit(40, 5, 1.6, [1, 0.9, 0.8]); back.position.set(0, 9, -34); back.lookAt(0, 2, 0);
  const bounce = lit(50, 50, 0.1, [1, 0.8, 0.6]); bounce.position.set(0, -6, 0); bounce.rotation.x = Math.PI / 2;
  es.add(key, strip, back, bounce);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.02, 1, 200).texture; pm.dispose();
}
studio();
const key = new THREE.SpotLight(new THREE.Color(1.0, 0.94, 0.85), 2.0, 0, 0.6, 0.62, 0);   // one lamp: its pool falls off on the felt
key.position.set(-14, 24, 11); key.target.position.set(0, 0.5, 0.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { near: 14, far: 48 }); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 4;
scene.add(key.target);
scene.add(key, new THREE.HemisphereLight(0x8a8580, 0x1a1410, 0.25));

// ------------------------------------------------------------------ surfaces drawn once: brass dial, walnut, felt, stones
const tex = (cv, srgb, rep) => { const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
const cvs = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const R_PLATE = 6.5, HOUR_IN = 5.72, HOUR_OUT = 6.36;

function dial() {
  const S = 2048, U = S / (2 * R_PLATE), C = S / 2, rand = rnd(7);
  const [cc, c] = cvs(S, S), [oc, o] = cvs(S, S);           // colour; and roughness (green) with metalness (blue)
  c.fillStyle = '#a3854f'; c.fillRect(0, 0, S, S); o.fillStyle = 'rgb(0,84,215)'; o.fillRect(0, 0, S, S);
  const band = (ctx, r0, r1, fill) => { ctx.beginPath(); ctx.arc(C, C, r1 * U, 0, 2 * Math.PI); ctx.arc(C, C, r0 * U, 2 * Math.PI, 0, true); ctx.fillStyle = fill; ctx.fill(); };
  band(c, HOUR_IN, HOUR_OUT, '#aeaba2'); band(o, HOUR_IN, HOUR_OUT, 'rgb(0,125,215)');        // the silvered hour ring
  for (let i = 0; i < 2600; i++) {                                                            // spun finish: fine concentric lines
    const r = Math.sqrt(rand()) * R_PLATE * U, a = rand() * 7, l = 0.3 + rand() * 2.2, d = rand() < 0.5;
    c.beginPath(); c.arc(C, C, r, a, a + l); c.lineWidth = 0.6 + rand(); c.strokeStyle = d ? `rgba(40,26,8,${0.05 + rand() * 0.09})` : `rgba(255,236,190,${0.04 + rand() * 0.07})`; c.stroke();
    o.beginPath(); o.arc(C, C, r, a, a + l); o.lineWidth = 0.6 + rand(); o.strokeStyle = d ? 'rgba(0,150,215,.25)' : 'rgba(0,40,215,.25)'; o.stroke();
  }
  const INK = '#120d07', WAX = 'rgb(0,235,0)';              // engraving filled with black wax: dark, rough, not metal
  const both = f => { c.fillStyle = c.strokeStyle = INK; f(c); o.fillStyle = o.strokeStyle = WAX; f(o); };
  const circle = (r, w) => both(x => { x.beginPath(); x.arc(C, C, r * U, 0, 7); x.lineWidth = w; x.stroke(); });
  const tick = (phi, r0, r1, w) => both(x => { x.beginPath(); x.moveTo(C + Math.cos(phi) * r0 * U, C + Math.sin(phi) * r0 * U); x.lineTo(C + Math.cos(phi) * r1 * U, C + Math.sin(phi) * r1 * U); x.lineWidth = w; x.stroke(); });
  const arcText = (str, r, phi, px, font, track = 0) => both(x => {     // text along a circle, centred on phi, feet outward
    x.font = `${font === serif ? 500 : 600} ${px}px ${font}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const ws = [...str].map(ch => x.measureText(ch).width + track), tot = ws.reduce((a, b) => a + b, 0);
    let run = 0; [...str].forEach((ch, i) => { const p = phi + (tot / 2 - run - ws[i] / 2) / (r * U); run += ws[i];
      x.save(); x.translate(C + Math.cos(p) * r * U, C + Math.sin(p) * r * U); x.rotate(p - Math.PI / 2); x.fillText(ch, 0, 0); x.restore(); });
  });
  const serif = '"Newsreader", Georgia, serif', sans = '"Archivo", sans-serif';
  // the scale: one ring every 5 problems short of the RL score, a heavier one every 10

const setPlay = p => { playing = p && !still; if (playing && frac > 0.995) { setFrac(0); shown = 0; } $('play').textContent = playing ? 'Pause' : 'Play'; need = true; };
$('scrub').value = Math.round(frac * 1000);
$('scrub').addEventListener('input', e => { setPlay(false); setFrac(e.target.value / 1000); });
$('play').addEventListener('click', () => { if (still) setFrac(frac >= 1 ? 0 : (allResults.find(r => (r.t - T0) / SPAN > frac + 1e-4) || { t: T1 }).t / SPAN - T0 / SPAN); else setPlay(!playing); });
if (still) $('play').textContent = 'Next result';
$('list').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select({ kind: 'study', s: studies.find(s => s.k === b.dataset.k) }); });

function card() {
  const c = $('card'); if (!sel) { c.classList.remove('on'); return; }
  const x = '<button id="x" aria-label="Close">Close</button>';
  if (sel.kind === 'result') { const r = sel.r;
    c.innerHTML = `<div class="hd"><span>Result · ${esc(r.study ? r.study.k : 'no study')}</span>${x}</div><div class="q">${esc(r.title)}</div><p>${esc(r.what)}</p>` +
      (r.sc.length ? r.sc.map(line).join('') : '<div class="sc"><span></span><span>No score line on the board.</span></div>') +
      `<div class="by">Posted by <b>${esc(r.who)}</b> · ${fmtT(r.t)} · hour ${((r.t - T0) / 3.6e6).toFixed(1)} · ${esc(r.id)}</div>`; }
  else if (sel.kind === 'study') { const s = sel.s, t = T0 + frac * SPAN, b = bestAt(s, t), n = s.results.filter(r => r.t <= t).length;
    c.innerHTML = `<div class="hd"><span>Study · studies/${esc(s.k)}</span>${x}</div><div class="q">${esc(s.about)}</div>` +
      `<p>${n} of its ${s.results.length} results are on the board at this time; ${s.results.reduce((a, r) => a + r.n, 0).toLocaleString('en-US')} problems scored in all. ${s.commits} commits touch its folder.</p>` +
      (b ? line(b.x) + `<div class="sc"><b>${b.best >= RL ? '+' : '−'}${Math.abs(b.best - RL)}</b><span>problems ${b.best >= RL ? 'past' : 'short of'} RL’s ${RL}; best base-model score on MATH-500 so far, from “${esc(b.r.title)}”.</span></div>` : '<div class="sc"><span></span><span>No base-model score on MATH-500 (n 500) among its results at this time: it stays at the end of its arm.</span></div>') +
      `<div class="by">First seen ${fmtT(s.t)}${s.results.length ? ` · results by ${[...new Set(s.results.map(r => r.who))].map(w => `<b>${esc(w)}</b>`).join(', ')}` : ' · no result names this folder'}</div>`; }
  else { const r = allResults.find(r => r.id === DATA.rl.result);
    c.innerHTML = `<div class="hd"><span>The goal · RL checkpoint</span>${x}</div><div class="q">${esc(r ? r.title : 'RL-Zero-Math on MATH-500')}</div><p>${esc(r ? r.what : '')}</p>` +
      line(['rl', 'MATH-500', RL, DATA.rl.n, DATA.rl.config, null]) + `<div class="by">${r ? `Posted by <b>${esc(r.who)}</b> · ${fmtT(r.t)} · ` : ''}${esc(DATA.rl.result)}</div>`; }
  c.classList.add('on'); $('x').onclick = () => select(null);
}
function select(b) { sel = b; shownKey = ''; card(); need = true; saveHash(); }

// ------------------------------------------------------------------ layout and camera
let W = 0, H = 0;
const target = new THREE.Vector3(-0.2, 1.0, 1.0);
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, W * H > 1.2e6 ? 1.25 : 1.5)); renderer.setSize(W, H, false);
  need = true;
}
function aim() {
  const nar = narrow(), left = nar ? 0 : 392, top = nar ? $('line').getBoundingClientRect().bottom + 70 : 0, bot = nar ? 40 : 0;
  const aw = W - left, ah = H - top - bot, tan = Math.tan(camera.fov * Math.PI / 360), fit = nar ? 7.6 : 8.4;
  const d = Math.max(fit * H / (tan * aw), (fit * Math.sin(elS) + 2.0) * H / (tan * ah)) * zoomS;
  scene.fog.near = d + 6; scene.fog.far = d + 46;
  camera.aspect = W / H; camera.setViewOffset(W, H, -left / 2, -(top - bot) / 2, W, H);
  camera.position.set(target.x + d * Math.cos(elS) * Math.sin(azS), target.y + d * Math.sin(elS), target.z + d * Math.cos(elS) * Math.cos(azS));
  camera.lookAt(target); camera.updateMatrixWorld();
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------ one frame of the mechanism at time t
const m4 = new THREE.Matrix4(), v3 = new THREE.Vector3(), qI = new THREE.Quaternion(), s3 = new THREE.Vector3();
function pose(f) {
  const t = T0 + f * SPAN, phi = PHI0 + f * SWEEP;
  carriage.rotation.y = -phi; hourArm.rotation.y = 0;
  pinion.rotation.y = phi * G_T / P_T + 0.11;
  for (const s of studies) {
    const a = arrived(s.t, t, W_IN), R = radiusAt(s, t), spin = phi * 1.5 + s.local;
    s.slider.position.x = R; s.slider.visible = a > 0.001; s.a = a; s.R = R;
    s.mesh.scale.setScalar(Math.max(1e-4, s.r * a));
    s.ringGroup.rotation.y = -spin;
    let out = 0;
    s.rings.forEach(g => { const ga = arrived(g.t, t, W_IN); g.mesh.visible = ga > 0.001; g.mesh.scale.setScalar(Math.max(1e-4, ga)); if (ga > 0.5) out = g.rad; });
    if (s.spokes) s.spokes.forEach(m => { m.visible = out > 0; m.scale.x = out || 1; });
    const armPhi = phi + s.local, cx = R * Math.cos(armPhi), cz = R * Math.sin(armPhi);
    for (const r of s.results) { const ra = arrived(r.t, t, W_IN), g = s.rings[r.ring], psi = armPhi + spin + r.ang, k = Math.max(1e-5, moonR(r.n) * ra);
      moons.setMatrixAt(r.i, m4.compose(v3.set(cx + g.rad * Math.cos(psi), Y_BODY, cz + g.rad * Math.sin(psi)), qI, s3.set(k, k, k))); }
  }
  for (const r of DATA.loose) { const k = Math.max(1e-5, moonR(r.n) * arrived(r.t, t, W_IN)); moons.setMatrixAt(r.i, m4.compose(r.pos, qI, s3.set(k, k, k))); }
  moons.instanceMatrix.needsUpdate = true;
  words_(t);
  $('hour').textContent = Math.max(0, (t - T0) / 3.6e6).toFixed(1); $('stamp').innerHTML = `hours since the first result<br>${fmtT(t)}`;
}
function place(e, p, dy) { v3.copy(p).project(camera); e.style.transform = `translate(${((v3.x + 1) / 2 * W).toFixed(1)}px, ${((1 - v3.y) / 2 * H + dy).toFixed(1)}px) translate(-50%, -100%)`; }
function labels() {
  const pxPer = H / (2 * Math.tan(camera.fov * Math.PI / 360));
  studies.forEach((s, i) => { tags[i].style.opacity = s.a > 0.5 ? 1 : 0; s.mesh.getWorldPosition(v3); const d = v3.distanceTo(camera.position); const out = s.rings.length ? s.rings.filter(g => g.mesh.visible).length : 0, up = Math.max(s.r, out ? (s.rings[out - 1].rad + 0.1) * Math.sin(elS) : 0); tags[i].style.zIndex = 1000 - Math.round(d * 10); place(tags[i], v3.clone(), -up * pxPer / d - 7); });
  place(sunTag, v3.set(0, Y_BODY + 0.6, 0), -6);
  place(trayTag, v3.set(TRAY.x - Math.sin(TRAY.rot) * 0.9, 0.3, TRAY.z - Math.cos(TRAY.rot) * 0.9), -4);
  const tipOf = hover || (sel && sel.kind === 'result' ? sel : null);
  if (tipOf) { const b = tipOf, p = b.kind === 'result' ? (moons.getMatrixAt(b.r.i, m4), v3.setFromMatrixPosition(m4).clone()) : b.kind === 'study' ? b.s.mesh.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3(0, Y_BODY, 0);
    const rr = b.kind === 'result' ? moonR(b.r.n) : b.kind === 'study' ? b.s.r : 0.6; p.y -= rr; v3.copy(p).project(camera);
    $('tip').style.transform = `translate(${clamp((v3.x + 1) / 2 * W, 170, W - 170).toFixed(1)}px, ${((1 - v3.y) / 2 * H + 10).toFixed(1)}px) translate(-50%, 0)`;
    $('tip').innerHTML = b.kind === 'result' ? `${esc(b.r.title)}<small>${b.r.sc.length ? esc(`${b.r.sc[0][0]} ${b.r.sc[0][1]} ${b.r.sc[0][2]}/${b.r.sc[0][3]}`) + (b.r.sc.length > 1 ? ` and ${b.r.sc.length - 1} more score lines` : '') : 'no score line'} · ${esc(b.r.who)}</small>`
      : b.kind === 'study' ? `studies/${esc(b.s.k)}<small>${esc(b.s.about)}</small>` : `The RL checkpoint: ${RL} of ${DATA.rl.n} on MATH-500<small>${esc(DATA.rl.config)}, one sample</small>`;
    $('tip').classList.add('on'); } else $('tip').classList.remove('on');
}

// ------------------------------------------------------------------ pointer: turn the dial, look around, pick
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -Y0), hit = new THREE.Vector3();
const toNdc = e => ndc.set(e.clientX / W * 2 - 1, 1 - e.clientY / H * 2);
function pickAt(e) {
  toNdc(e); ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(bodies.map(b => b.mesh), false)[0]; if (!h) return null;
  const b = bodies.find(b => b.mesh === h.object);
  return b.kind === 'moons' ? { kind: 'result', r: allResults[h.instanceId] } : b.kind === 'study' ? (b.s.a > 0.5 ? { kind: 'study', s: b.s } : null) : { kind: 'sun' };
}
const dialAngle = e => { toNdc(e); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(plane, hit) && Math.hypot(hit.x, hit.z) < 7.3 ? Math.atan2(hit.z, hit.x) : null; };
let drag = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); const a = dialAngle(e);
  drag = { x: e.clientX, y: e.clientY, moved: 0, mode: a !== null && !e.shiftKey && e.button === 0 ? 'turn' : 'orbit', a, t: performance.now() };
  if (drag.mode === 'turn') { setPlay(false); vel = 0; }
});
canvas.addEventListener('pointermove', e => {
  if (!drag) { const h = pickAt(e); if ((h && (h.r || h.s || h.kind)) !== (hover && (hover.r || hover.s || hover.kind))) { hover = h; need = true; } canvas.classList.toggle('pick', !!h); return; }
  drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
  if (drag.moved > 4) canvas.classList.add(drag.mode);
  if (drag.mode === 'turn') { const a = dialAngle(e); if (a !== null && drag.moved > 4) { let d = a - drag.a; d = Math.atan2(Math.sin(d), Math.cos(d)); const now = performance.now(), df = d / SWEEP;
      vel = lerp(vel, df / Math.max(8, now - drag.t) * 1000, 0.5); drag.t = now; setFrac(frac + df, true); } if (a !== null) drag.a = a; }
  else { az -= (e.clientX - drag.x) * 0.005; el = clamp(el + (e.clientY - drag.y) * 0.004, 0.2, 1.4); need = true; saveHash(); }
  drag.x = e.clientX; drag.y = e.clientY;
});
const up = e => { if (!drag) return; canvas.classList.remove('turn', 'orbit');
  if (drag.moved <= 4) { vel = 0; select(pickAt(e)); } else if (drag.mode !== 'turn' || performance.now() - drag.t > 120 || still) vel = 0;
  drag = null; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', () => { drag = null; vel = 0; canvas.classList.remove('turn', 'orbit'); });
canvas.addEventListener('pointerleave', () => { if (hover) { hover = null; need = true; } });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = clamp(zoom * Math.exp(e.deltaY * 0.001), 0.45, 1.5); need = true; }, { passive: false });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Escape') return;
  const next = d => { const t = T0 + frac * SPAN, c = allResults.filter(r => d > 0 ? r.t > t + 1 : r.t < t - 1); return c.length ? (c[d > 0 ? 0 : c.length - 1].t - T0) / SPAN : d > 0 ? 1 : 0; };
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const d = e.key === 'ArrowRight' ? 1 : -1; setPlay(false); setFrac(e.shiftKey ? next(d) : frac + d * 0.01); }
  else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  else if (e.key === 'Home') { setPlay(false); setFrac(0); } else if (e.key === 'End') { setPlay(false); setFrac(1); }
  else if (e.key === 'Escape') select(null); else return;
});

// ------------------------------------------------------------------ the loop: draw only when something moves
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); });
canvas.addEventListener('webglcontextrestored', () => { studio(); need = true; });
let last = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (playing) { setFrac(frac + dt / 40, true); if (frac >= 1) setPlay(false); }
  else if (!drag && Math.abs(vel) > 1e-4) { setFrac(frac + vel * dt, true); vel *= Math.exp(-dt * 2.2); if (frac <= 0 || frac >= 1) vel = 0; }
  const k = still ? 1 : 1 - Math.exp(-dt * 9), near = (a, b) => Math.abs(a - b) < 2e-5;
  shown = near(shown, frac) ? frac : lerp(shown, frac, k); azS = near(azS, az) ? az : lerp(azS, az, k); elS = near(elS, el) ? el : lerp(elS, el, k); zoomS = near(zoomS, zoom) ? zoom : lerp(zoomS, zoom, k);
  if (shown !== frac || azS !== az || elS !== el || zoomS !== zoom) need = true;
  if (!need || renderer.getContext().isContextLost()) return;
  need = false;
  aim(); pose(shown); scene.updateMatrixWorld(); labels();
  renderer.shadowMap.needsUpdate = true;
  renderer.render(scene, camera);
}
card();
requestAnimationFrame(frame);
</script>
</body>
