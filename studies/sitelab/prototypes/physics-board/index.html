<style>
:root {
  color-scheme: dark;   /* two warm neutrals, one brass accent, one oxide red */
  --paper: #121112; --sheet: #1a1918; --ink: #e9e4da; --mute: #a09a8f; --faint: #7a756c; --rule: #302d2a;
  --blue: #c6a46c; --red: #b5533c; --pl: .7; --pc: .07;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
body { color: var(--ink); font: 400 14px/1.5 "Archivo", ui-sans-serif, system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
.hue { --c: oklch(var(--pl) var(--pc) var(--h)); }

#top { position: fixed; left: 40px; right: 40px; top: 22px; display: flex; align-items: flex-start; gap: 40px; pointer-events: none; }
#lead { max-width: 640px; }
#lead .name { font-weight: 600; font-stretch: 112%; font-size: 11.5px; letter-spacing: .09em; color: var(--mute); }
#sentence { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: clamp(21px, 2.2vw, 32px); line-height: 1.16; margin: 8px 0 10px; letter-spacing: -.012em; }
#lead .name a { color: var(--mute); text-decoration: none; pointer-events: auto; margin-right: 12px; padding-right: 12px; border-right: 1px solid var(--rule); }
#lead .name a:hover { color: var(--ink); }
#caption { margin: 0; color: var(--mute); font-size: 13px; max-width: 560px; }
#caption b { color: var(--ink); font-weight: 600; }
#ctl { margin-left: auto; display: flex; align-items: center; gap: 14px; pointer-events: auto; font-size: 13px; color: var(--mute); }
.seg { display: flex; gap: 20px; }
.seg button, .pill { padding: 4px 0 5px; color: var(--mute); border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
.seg button:hover, .pill:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--blue); }
.pill { color: var(--ink); border-bottom-color: var(--rule); }
#ctl .sep { width: 1px; height: 14px; background: var(--rule); }

#tip { position: fixed; left: 0; top: 0; max-width: 380px; padding: 11px 15px 12px; pointer-events: none; opacity: 0;
  background: var(--sheet); border-top: 1px solid var(--blue); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); transition: opacity .12s; font-size: 13px; line-height: 1.4; z-index: 5; }
#tip .m { color: var(--mute); font-size: 12px; display: flex; gap: 8px; align-items: center; }
#tip .dot, .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
#tip .t { margin-top: 4px; }
#tip .s { margin-top: 5px; color: var(--mute); font-size: 12px; }
#tip .s b { color: var(--ink); font-weight: 600; }

#panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw); padding: 30px 34px 30px; overflow-y: auto; z-index: 6;
  background: var(--sheet); border-left: 1px solid var(--rule); box-shadow: -30px 0 60px rgba(0, 0, 0, .35);
  transform: translateX(104%); transition: transform .5s cubic-bezier(.3, 0, .2, 1); user-select: text; -webkit-user-select: text; }
#panel.open { transform: none; }
#panel .x { position: absolute; top: 22px; right: 26px; color: var(--mute); font-size: 13px; }
#panel .x:hover { color: var(--ink); }
#panel .k { color: var(--mute); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-right: 60px; }
#panel h2 { font-family: "Newsreader", Georgia, serif; font-weight: 300; font-size: 26px; line-height: 1.16; margin: 14px 0 16px; letter-spacing: -.012em; }
#panel p { margin: 0 0 12px; overflow-wrap: anywhere; }
#panel .lab { display: block; color: var(--faint); font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 2px; }
#panel .sec { border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 12px; color: var(--mute); font-size: 12.5px; font-weight: 600; }
#panel table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; }
#panel td { padding: 5px 8px 5px 0; vertical-align: top; border-bottom: 1px solid var(--rule); }
#panel td.n { white-space: nowrap; font-weight: 600; }
#panel .c { margin-top: 10px; font-size: 13px; }
#panel .c .m { color: var(--mute); font-size: 12px; display: flex; gap: 7px; align-items: center; }
#panel a.id { color: var(--blue); text-decoration: none; cursor: pointer; }

#bottom { position: fixed; left: 40px; right: 40px; bottom: 20px; pointer-events: none; }
#keys { display: flex; gap: 20px; align-items: center; color: var(--mute); font-size: 12.5px; margin-bottom: 12px; flex-wrap: wrap; }

#keys .p { display: inline-flex; align-items: center; gap: 7px; }
#keys #hint { margin-left: auto; color: var(--faint); }
#tl { display: flex; align-items: center; gap: 16px; pointer-events: auto; border-top: 1px solid var(--rule); padding-top: 12px; }
#bar { position: relative; flex: 1; height: 46px; cursor: ew-resize; touch-action: none; }
#bar canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#head { position: absolute; top: -4px; bottom: 0; width: 1px; background: var(--blue); pointer-events: none; }
#clock { min-width: 128px; color: var(--ink); font-size: 13px; }
#live { color: var(--mute); font-size: 12.5px; display: flex; align-items: center; gap: 8px; min-width: 150px; justify-content: flex-end; }
#live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
#live.on i { background: var(--blue); }
#toast { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); max-width: 640px; padding: 9px 16px; font-size: 13px;
  background: var(--sheet); border-top: 1px solid var(--blue); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); opacity: 0; transition: opacity .4s; pointer-events: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; }
#err { position: fixed; left: 10px; top: 10px; color: var(--red); font-size: 12px; white-space: pre-wrap; z-index: 99; max-width: 90vw; }
@media (max-width: 900px) {
  #top { left: 16px; right: 16px; top: 14px; flex-direction: column; gap: 6px; } #ctl { margin-left: 0; font-size: 12.5px; } #sentence { font-size: 19px; margin: 6px 0 2px; }
  #bottom { left: 16px; right: 16px; bottom: 12px; } #hint, #caption, #keys .sep, #keys .enc { display: none; }
  #keys { gap: 6px 14px; margin-bottom: 8px; font-size: 12px; } #people { gap: 14px !important; }
  #tl { flex-wrap: wrap; gap: 6px 14px; padding-top: 8px; } #bar { flex: 1 0 100%; order: -1; height: 34px; } #clock, #live { min-width: 0; } #live { margin-left: auto; }
}

<canvas id="gl"></canvas>

  <div id="ctl"><span>Sort by</span>

    <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.6" stroke-width="2.6"/></svg>work</span>

<script type="module">
const errEl = document.getElementById('err');
addEventListener('error', e => errEl.textContent += (e.message || e) + '\n');
addEventListener('unhandledrejection', e => errEl.textContent += (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n');

import * as THREE from 'three';
import * as RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);          // test hooks: ?mode=person  ?t=0.4  ?focus=<id>  ?late=3  ?az=0.5
const HUES = [325, 150, 65, 195, 105, 45, 175, 350];     // the site's person colours
const V3 = THREE.Vector3;

    clamp(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * s, 0, 1), clamp(-.0041960863 * l - .7034186147 * m + 1.707614701 * s, 0, 1), THREE.LinearSRGBColorSpace);
}

/* ---------- data ---------- */
async function getData(tries) { for (let i = 0; ; i++) try { const r = await fetch('/data'); if (!r.ok) throw new Error('/data ' + r.status); return await r.json(); } catch (e) { if (i >= tries) throw e; await new Promise(r => setTimeout(r, 700)); } }
let D = await getData(5);
const late = +Q.get('late') || 0;                         // test hook: hold back the newest N real items until the first poll
let people = [], hueOf = {}, colOf = {};
function indexData() {
  people = [...new Set(D.items.map(i => i.who))].sort();
  people.forEach((p, i) => { hueOf[p] = HUES[i % HUES.length]; colOf[p] = oklch(.6, .075, hueOf[p]); });
  D.byId = Object.fromEntries(D.items.map(i => [i.id, i]));
  D.scoresOf = {};
  for (const s of D.scores) (D.scoresOf[s.result] ||= []).push(s);
}
indexData();
const atMs = it => it.at_ns / 1e6, actMs = it => (it.active_ns || it.at_ns) / 1e6;
const closedMs = it => it.closed_at ? Date.parse(it.closed_at) : Infinity;
const weight = it => (it.ups || 0) + (it.downs || 0) + (it.n_comments || 0);
const radius = it => .36 + .13 * Math.sqrt(weight(it));
const kindOf = it => it.kind === 'skill' ? 'knowledge' : it.kind;       // 2 skill notes sit with knowledge
function benchOf(it) {                                    // the benchmark of a result: from its score lines, else the first one its text names
  const rows = D.scoresOf[it.id];
  if (rows) { const c = {}; let best; for (const s of rows) { c[s.benchmark] = (c[s.benchmark] || 0) + 1; if (!best || c[s.benchmark] > c[best]) best = s.benchmark; } return best; }
  const m = it.text.match(/MATH-500|hard328|fresh2026|HumanEval|MBPP/);
  return m ? (/Human|MBPP/.test(m[0]) ? 'HumanEval+MBPP+' : m[0]) : 'No benchmark';
}
function ideaOf(it) { const m = it.text.match(/idea-[0-9a-f]{6}/g); return m && m.find(x => D.byId[x]) || null; }
const agentName = it => { if (!it.agent) return 'agent'; const [n, v] = it.agent.split('_'); return n.replace(/(^|-)(\w)/g, (_, a, c) => (a ? ' ' : '') + c.toUpperCase()) + (v ? ' ' + v.replace(/-/g, '.') : ''); };
const T0 = () => Math.min(...D.items.map(atMs)) - 6 * 6e4;

/* ---------- renderer, room, light ---------- */
const canvas = $('#gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' }); }
catch (e) { $('#sentence').textContent = 'This picture needs WebGL 2, and the browser did not give it a context.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0e0f);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), .03).texture;   // a studio room for the metal and glass to reflect
scene.environmentIntensity = .46;
const camera = new THREE.PerspectiveCamera(30, 1, .5, 400); camera.layers.enable(1);

// procedural surface textures (decoration only): fine grain, brushed streaks
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const grainTex = (rx, ry, lo, hi) => canvasTex(512, 512, (g, w, h) => {
  const im = g.createImageData(w, h), d = im.data;
  for (let i = 0; i < w * h; i++) { const v = lo + (hi - lo) * (rnd() * .6 + rnd() * .4); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0);
  g.globalAlpha = .06; g.strokeStyle = '#fff'; g.lineWidth = .6;                   // a few hairline scratches
  for (let i = 0; i < 40; i++) { const x = rnd() * w, y = rnd() * h, a = rnd() * 6.28, l = 20 + rnd() * 120; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
}, rx, ry);
const brushTex = (rx, ry) => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const y = rnd() * h, x = rnd() * w, l = 60 + rnd() * 380, v = 90 + rnd() * 120; g.globalAlpha = .1 + rnd() * .25; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, l, .6 + rnd() * .8); if (x + l > w) g.fillRect(x - w, y, l, 1); }
}, rx, ry);
const TEX = { stone: grainTex(9, 4.6, 120, 210), fine: grainTex(2, 2, 150, 235), brush: brushTex(1, 1), brushLong: brushTex(14, 1) };

const key = new THREE.DirectionalLight(0xffe9cf, 3.7);     // key: warm, upper left
key.position.set(-20, 34, 16); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 4; key.shadow.bias = -.0003; key.shadow.normalBias = .03;
Object.assign(key.shadow.camera, { left: -30, right: 30, top: 22, bottom: -22, near: 5, far: 90 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xc6d0de, 0x2a2623, .5));   // fill: soft, cool from above, no shadow
const rim = new THREE.DirectionalLight(0xfff3e2, .9); rim.position.set(10, 9, -26); scene.add(rim);       // rim: from behind

const HX = 22.5, HZ = 11.5, AY = 9.2;                       // tray half size; height of the agents above it
const BRASS = 0xa98b5c;
const brassMat = new THREE.MeshStandardMaterial({ color: BRASS, metalness: 1, roughness: .34, roughnessMap: TEX.brush, envMapIntensity: 1.3 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HX * 2, HZ * 2),                                      // honed slate bed
  new THREE.MeshStandardMaterial({ color: 0x4a4848, roughness: .86, metalness: 0, roughnessMap: TEX.stone, map: TEX.stone, envMapIntensity: .5 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a342d, metalness: 1, roughness: .46, roughnessMap: TEX.brushLong, envMapIntensity: 1.1 });
const slab = new THREE.Mesh(new RoundedBoxGeometry(HX * 2 + 1.5, 1.5, HZ * 2 + 1.5, 4, .12), frameMat);   // dark anodized frame
slab.position.y = -.76; slab.receiveShadow = true; scene.add(slab);
for (const [w, d, x, z] of [[HX * 2 + 1.5, .75, 0, HZ + .375], [HX * 2 + 1.5, .75, 0, -HZ - .375], [.75, HZ * 2, HX + .375, 0], [.75, HZ * 2, -HX - .375, 0]]) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, .95, d, 3, .06), frameMat);
  m.position.set(x, .47, z); m.castShadow = m.receiveShadow = true; scene.add(m);
}
{ // one brass inlay line inside the frame
  const sh = new THREE.Shape(); sh.moveTo(-HX + .5, -HZ + .5); sh.lineTo(HX - .5, -HZ + .5); sh.lineTo(HX - .5, HZ - .5); sh.lineTo(-HX + .5, HZ - .5); sh.closePath();
  const ho = new THREE.Path(); ho.moveTo(-HX + .56, -HZ + .56); ho.lineTo(-HX + .56, HZ - .56); ho.lineTo(HX - .56, HZ - .56); ho.lineTo(HX - .56, -HZ + .56); ho.closePath(); sh.holes.push(ho);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), brassMat); m.rotation.x = -Math.PI / 2; m.position.y = .011; m.receiveShadow = true; scene.add(m);
}
const glassMat = new THREE.MeshStandardMaterial({ color: 0xdfe8e2, roughness: .04, metalness: 0, transparent: true, opacity: .1, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 2.6 });   // thin clear glass; no transmission pass, to hold 60 fps
{ // the table the tray stands on: a soft pool of light on dark paper (decoration, carries no data)
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), gr = g.createRadialGradient(118, 128, 0, 128, 128, 128);
  gr.addColorStop(0, '#3a3633'); gr.addColorStop(.45, '#201e1d'); gr.addColorStop(1, '#0f0e0f');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
  pool.rotation.x = -Math.PI / 2; pool.position.y = -1.52; scene.add(pool);
}
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());
const finish = new ShaderPass({ uniforms: { tDiffuse: { value: null }, px: { value: new THREE.Vector2() } },   // edge smoothing, restrained vignette, fine still grain
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 px; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    #define TX(o) texture2D(tDiffuse, vUv + (o)).rgb
    void main(){ const vec3 L = vec3(.299, .587, .114);
      vec3 m = TX(vec2(0.)); float lnw = dot(TX(vec2(-1., -1.) * px), L), lne = dot(TX(vec2(1., -1.) * px), L), lsw = dot(TX(vec2(-1., 1.) * px), L), lse = dot(TX(vec2(1., 1.) * px), L), lm = dot(m, L);
      float lmin = min(lm, min(min(lnw, lne), min(lsw, lse))), lmax = max(lm, max(max(lnw, lne), max(lsw, lse)));
      vec2 dir = vec2(-((lnw + lne) - (lsw + lse)), (lnw + lsw) - (lne + lse));
